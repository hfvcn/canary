    goal_behavior: >
      End-to-end integration test covering:
      (1) Plan with parent-child path overlap → detected by unified logic
      (2) Plan with cross-scope verification → W_VERIFICATION_CROSS_SCOPE
      (3) Task completion flow: skipped → FAILED, passed → COMPLETED
      (4) Missing params → error not skipped
      (5) BatchResult defaults are correct
      (6) beyond_scope marking on known limitation codes
      (7) verification_mode routing (ralph vs agent)
