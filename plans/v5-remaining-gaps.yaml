# Ralph v5 — 剩余缺口修复计划（经 Codex 审查修订）
# 来源：问题清单 v5 中尚未实现的待解决项
# 前置：Wave 1-3 代码已实现（183 test passed），Wave 4 部分实现
# Codex 审查修订：
#   - BLOCK1 修复：T3 get_snapshot() 不在调用链上 → 改为委托 orchestrator
#   - BLOCK2 修复：T3 sweep 数据结��不对齐 → 改为接线 orchestrator.check_stalled_tasks()
#   - BLOCK3 修复：T1 漏 claim 测试文件
#   - WARN 修复：T1 明确 plan_defaults.registration_invariants 路径

tasks:
  # ── RO-5: 注册不变量检查 ──────────────────────────────────

  - id: T1
    title: "RO-5 配置模型 + 加载：plan_defaults.registration_invariants"
    role: leaf
    claimed_paths:
      - "src/cccc/ralph/models.py"
      - "src/cccc/ralph/plan_io.py"
      - ".cccc/ralph.yaml"
      - "tests/ralph/test_ralph_standalone.py"
    depends_on: []
    addresses: ["RO-5"]
    goal_behavior: >
      在 models.py 新增 RegistrationInvariant 数据模型（name, description,
      registry_file, registry_symbol）。
      Plan 模型新增 registration_invariants: List[RegistrationInvariant] = []。
      plan_io.py 的 _merge_repo_defaults() 从 .cccc/ralph.yaml 的
      plan_defaults.registration_invariants 加载配置并合并到 Plan
      （与 critical_entrypoints/critical_flows 同一命名空间）。
      在 .cccc/ralph.yaml 的 plan_defaults 下为 CCCC 项目添加实际的
      registration_invariants 配置（如 IPC dispatch table）。
      在 test_ralph_standalone.py 中新增 registration_invariant 加载测试。
    acceptance_criteria: >
      1. RegistrationInvariant 模型包含 name/description/registry_file/registry_symbol 字段
      2. Plan.registration_invariants 默认空列表
      3. load_plan() 从 plan_defaults.registration_invariants 加载
      4. 现有 plan 加载不受影响（字段可选）
      5. model_validate round-trip 通过
      6. 新增测试验证加载和合并逻辑
    verification:
      level: unit
      command: "pytest tests/ralph/test_ralph_standalone.py -q -k 'registration_invariant or reg_inv'"
      covers:
        tasks: ["T1"]
    provides:
      - name: registration_invariant_model
        kind: data_model
        schema_hint: "RegistrationInvariant + Plan.registration_invariants"

  - id: T2
    title: "RO-5 校验规则：W_REGISTRATION_INVARIANT_UNCOVERED"
    role: leaf
    claimed_paths:
      - "src/cccc/ralph/filesystem_validator.py"
      - "tests/ralph/test_filesystem_validator.py"
    depends_on: ["T1"]
    addresses: ["RO-5"]
    goal_behavior: >
      在 filesystem_validator.py 新增 _check_registration_invariants()。
      检查逻辑：遍历 plan.registration_invariants，对每个 invariant 检查
      registry_file 是否被某个 task claim 或被某个 task 的传递依赖 claim。
      如果 registry_file 无人 claim 但有其他 task claim 了同目录或相关文件
      → 报 W_REGISTRATION_INVARIANT_UNCOVERED (warning)。
      如果 plan 无 registration_invariants → 跳过。
      利用已有 WorkspaceIndex 做路径解析和传递依赖计算。
    acceptance_criteria: >
      1. 有 task claim registry_file → 不报 warning
      2. registry_file 无人 claim 且有 task claim 同系统文件 → W_REGISTRATION_INVARIANT_UNCOVERED
      3. registration_invariants 为空时不报任何信息
      4. 传递依赖 claim 也算覆盖
      5. evidence 包含哪个 invariant 未覆盖 + 哪些 task 可能需要 claim
      6. 至少 4 个测试覆盖正常/异常场景
    verification:
      level: unit
      command: "pytest tests/ralph/test_filesystem_validator.py -q -k 'registration_invariant'"
      covers:
        tasks: ["T2"]
    consumes:
      - name: registration_invariant_model
        kind: data_model
        from_task: T1

  # ── Wave 4 运行时接线 ──────────────────────────────────────
  # Codex 审查发现：
  #   - orchestrator.check_stalled_tasks() 已实现但无人调用
  #   - orchestrator.get_workflow_state() 已通过 IPC 暴露且完整
  #   - RalphService.get_snapshot()/sweep_stalled_tasks() 是孤立重复代码
  # 正确做法：接线已有的 orchestrator 方法，清理 RalphService 重复

  - id: T3
    title: "Wave 4 接线：定期调用 check_stalled_tasks + 清理重复代码"
    role: leaf
    claimed_paths:
      - "src/cccc/daemon/foreman/ralph_service.py"
      - "src/cccc/daemon/foreman/workflow_orchestrator.py"
      - "src/cccc/daemon/ralph_ipc_handler.py"
      - "tests/test_foreman_workflow.py"
    depends_on: []
    addresses: ["WF-NEW-3-wiring"]
    goal_behavior: >
      1. 在 ralph_ipc_handler 中新增 handle_ralph_check_stalled op，
         调用 orchestrator.check_stalled_tasks() 并返回结果。
         这使得外部（定时器、foreman、CLI）可以触发 stalled 检测。
      2. RalphService.get_snapshot() 改为委托 orchestrator.get_workflow_state()
         而非自行拼装，消除重复。如果 orchestrator 不可用则返回 kind="idle"。
      3. RalphService.sweep_stalled_tasks() 改为委托
         orchestrator.check_stalled_tasks()，统一数据结构。
      4. v5 scope：仅检测+告警（orchestrator 已实��� notify），不自动重派。
    acceptance_criteria: >
      1. handle_ralph_check_stalled IPC op 调用 orchestrator.check_stalled_tasks()
      2. check_stalled_tasks 检测到 stalled worker 时返回 stalled task id 列表
      3. check_stalled_tasks 通过 _notify_foreman_task_update 发送告警
      4. get_snapshot() 返回与 orchestrator.get_workflow_state() 一致的数据
      5. get_snapshot() 无 orchestrator 时返回 kind="idle"
      6. 现有 heartbeat/progress IPC 不受影响
    verification:
      level: unit
      command: "pytest tests/test_foreman_workflow.py -q -k 'stalled or sweep or snapshot or check_stalled'"
      covers:
        tasks: ["T3"]

  # ── 集成验证 ───────────────────────────────────────────────

  - id: T4
    title: "RO-5 + Wave 4 集成测试 + 全量回归"
    role: integration
    claimed_paths:
      - "tests/ralph/test_wave2b_integration.py"
      - "src/cccc/ralph/validator.py"
      - "src/cccc/ralph/cli.py"
      - "tests/ralph/test_ralph_standalone.py"
      - "src/cccc/daemon/server.py"
      - "src/cccc/cli/main.py"
    depends_on: ["T1", "T2", "T3"]
    addresses: ["RO-5", "WF-NEW-3-wiring"]
    goal_behavior: >
      端到端集成测试：
      1. RO-5：从 .cccc/ralph.yaml 加载 registration_invariants →
         plan 加载合并 → validate_with_project → 报告包含
         W_REGISTRATION_INVARIANT_UNCOVERED。CLI 输出验证。
      2. Wave 4：check_stalled IPC op 可调用，
         get_snapshot 返回真实数据。
      3. 全量 Ralph 回归：确认 Wave 1-3 无回归。
    acceptance_criteria: >
      1. 带 registration_invariants 的 plan 通过完整 validate_with_project 流程
      2. 缺少 registry_file claim 时报告包含 W_REGISTRATION_INVARIANT_UNCOVERED
      3. pytest tests/ralph/ 全通过（含 Wave 1-2 已有测试）
      4. pytest tests/test_foreman_workflow.py 全通过
      5. pytest tests/test_ralph_ipc.py 全通过
    verification:
      level: e2e
      command: "pytest tests/ralph/ tests/test_ralph_ipc.py tests/test_foreman_workflow.py -q"
      covers:
        tasks: ["T1", "T2", "T3", "T4"]
        flows: ["registration_invariant_e2e", "stalled_detection", "daemon_startup", "cli_workflow"]

critical_entrypoints:
  - "src/cccc/ralph/filesystem_validator.py"
  - "src/cccc/daemon/foreman/ralph_service.py"

critical_flows:
  - id: registration_invariant_e2e
    description: ".cccc/ralph.yaml plan_defaults → load_plan → validate_with_project → W_REGISTRATION_INVARIANT_UNCOVERED"
    entrypoints: ["src/cccc/ralph/filesystem_validator.py"]
    required_verification_level: integration

  - id: stalled_detection
    description: "IPC op → orchestrator.check_stalled_tasks → notify foreman"
    entrypoints: ["src/cccc/daemon/foreman/ralph_service.py"]
    required_verification_level: unit

required_issues:
  - "RO-5"
  - "WF-NEW-3-wiring"

state:
  completed_task_ids: ["T1", "T2", "T3", "T4"]
  running_tasks: []
  failed_task_ids: []
