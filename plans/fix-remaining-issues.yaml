  - id: T1
    title: "Orchestrator _record_deferred_tasks 改为调用 Engine.defer_task()"
    role: integration
    claimed_paths:
      - "src/cccc/daemon/foreman/workflow_orchestrator.py"
    awareness_paths:
      - "src/cccc/kernel/workflow_state_engine.py"
      - "src/cccc/kernel/workflow_state_types.py"
    depends_on: []
    goal_behavior: >
      1. 修改 _record_deferred_tasks()：对每个 task 调用 self.engine.defer_task(task.id, reason)。
         不再使用 _track_task_ref() 写入 _active_workflows 影子状态。仍返回 List[TaskAssignment]。
      2. 删除 TASK_STATUS_DEFERRED 本地常量（line 66），改为从 WorkflowTaskStatus.DEFERRED.value 引用。
      3. _build_task_snapshot() 中的 deferred 统计：优先从 engine.list_tasks(status=DEFERRED) 获取。
      4. _resuggest_ready_tasks() 过滤候选时：跳过 engine 中状态为 DEFERRED 的 task。
    acceptance_criteria: >
      _record_deferred_tasks() 调用 engine.defer_task()；ledger 中出现 workflow.task_deferred 事件；
      TASK_STATUS_DEFERRED 本地常量已删除或改为引用枚举；daemon 重启 replay 后 deferred 状态可还原；
      _resuggest_ready_tasks 不将 engine 中 DEFERRED 的 task 放入建议。
    verification:
      level: integration
      command: "python -m pytest tests/test_workflow_state.py tests/test_foreman_workflow.py -q --tb=short"
      covers:
        tasks: ["T1"]
    provides:
      - name: orchestrator_deferred_via_engine
        kind: runtime_capability
        schema_hint: "Orchestrator defers tasks through Engine, not shadow state"
    addresses: ["ARCH-7"]

  - id: T2
