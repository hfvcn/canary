      - "src/cccc/kernel/workflow_state_engine.py"
    awareness_paths:
      - "src/cccc/daemon/foreman/workflow_orchestrator.py"
      - "src/cccc/daemon/ops/workflow_task_ops.py"
    depends_on: []
    goal_behavior: >
      1. TaskState 新增 attempt_id: str = "" 字段。
      2. retry_after_verification()：replace(prev, status=READY, agent_id="", attempt_id="")。
      3. _apply_retry_requested()：同样清空 agent_id 和 attempt_id。
      4. approve_batch()：从 assignment 数据读取 attempt_id 写入 TaskState。
      5. _apply_batch_approved()：从 assignment 数据读取 attempt_id。
      6. report_worker_completion() 新增可选 attempt_id 参数。CAS 逻辑：
         - TaskState.attempt_id 非空且 payload attempt_id 非空：必须匹配
         - TaskState.attempt_id 非空但 payload attempt_id 为空：检查 assignment_id 兼容
         - TaskState.attempt_id 为空：跳过 CAS（旧 workflow 兼容）
    acceptance_criteria: >
      retry_after_verification 后 agent_id 和 attempt_id 均为空；
      approve_batch 写入 attempt_id；report_worker_completion 对 attempt_id mismatch 拒绝；
      旧 workflow（无 attempt_id）仍被接受。
    verification:
      level: unit
      command: "python -m pytest tests/test_workflow_state.py -q --tb=short -k 'retry or attempt'"
      covers:
        tasks: ["T2"]
    provides:
      - name: clean_retry_with_attempt_id
        kind: module
        schema_hint: "retry clears agent_id + attempt_id; CAS on complete with backward compat"
    addresses: ["ARCH-8"]

