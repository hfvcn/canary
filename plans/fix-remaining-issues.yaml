critical_entrypoints:
  - src/cccc/kernel/workflow_state_engine.py
  - src/cccc/kernel/workflow_state_types.py
  - src/cccc/daemon/foreman/workflow_orchestrator.py
  - src/cccc/daemon/foreman/workflow_monitor.py
  - src/cccc/ralph/validator.py
  - src/cccc/ralph/cli.py

critical_flows:
  - id: deferred_lifecycle
    description: "Task → deferred (conflict) → undeferred → proceeds"
    entrypoints: ["src/cccc/kernel/workflow_state_engine.py", "src/cccc/daemon/foreman/workflow_orchestrator.py"]
    required_verification_level: e2e
  - id: clean_retry_cas
    description: "Verify fail → retry clears agent_id/attempt_id → stale completion rejected"
    entrypoints: ["src/cccc/kernel/workflow_state_engine.py"]
    required_verification_level: e2e
  - id: blocked_cascade_cancels_downstream
    description: "Task blocked → downstream cascade → running siblings unaffected"
    entrypoints: ["src/cccc/daemon/foreman/workflow_orchestrator.py"]
    required_verification_level: e2e
  - id: hook_rejects_completer_mismatch
    description: "Wrong agent complete → BLOCK hook rejects → state unchanged"
    entrypoints: ["src/cccc/kernel/workflow_state_engine.py"]
    required_verification_level: e2e
  - id: engine_cascade_via_orchestrator
    description: "block_task(cascade=True) → structured results → orchestrator notifies"
    entrypoints: ["src/cccc/kernel/workflow_state_engine.py", "src/cccc/daemon/foreman/workflow_orchestrator.py"]
    required_verification_level: e2e
  - id: mode_persistence_via_ledger
    description: "set_monitor_mode → ledger → replay → config restored"
    entrypoints: ["src/cccc/kernel/workflow_state_engine.py"]
    required_verification_level: e2e
  - id: assignment_provenance_lifecycle
    description: "approve_batch with provenance → engine stores → replay restores"
    entrypoints: ["src/cccc/kernel/workflow_state_engine.py"]
    required_verification_level: e2e
  - id: plan_state_sync
    description: "ralph sync-state reads ledger → updates plan.yaml"
    entrypoints: ["src/cccc/ralph/cli.py"]
    required_verification_level: e2e

forbidden_flows:
  - id: no_retry_keeps_old_agent
    description: "retry MUST NOT preserve old agent_id or attempt_id"
    required_verification_level: e2e
  - id: no_blocked_task_in_suggestions
    description: "BLOCKED/DEFERRED MUST NOT appear in suggest or resuggest"
    required_verification_level: e2e
  - id: no_deferred_only_in_shadow
    description: "DEFERRED MUST be in Engine ledger, not only shadow"
    required_verification_level: e2e
  - id: no_state_change_on_rejection
    description: "TransitionRejected MUST NOT produce state change"
    required_verification_level: e2e
  - id: no_shadow_dependency_in_resuggest
    description: "_resuggest_ready_tasks MUST NOT read from _active_workflows"
    required_verification_level: e2e

