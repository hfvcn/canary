    depends_on: []
    goal_behavior: >
      Engine 侧：
      1. block_task() 加终态保护（COMPLETED/ARCHIVED 拒绝 ValueError）+ 幂等（已 BLOCKED 跳过）。
      Orchestrator 侧：
      2. 新增 _cascade_block(workflow_id, blocked_task_id, reason)：
         visited set 避免菱形 DAG 重复；递归前从 engine 读 task 真实状态；
         COMPLETED/ARCHIVED 跳过；RUNNING 下游 block 后通知 Foreman 取消。
      3. block_task() 调用后执行 _cascade_block()。
      4. _resuggest_ready_tasks() 跳过 BLOCKED 和 DEFERRED。
      5. 级联后向 Foreman 发汇总通知。
    acceptance_criteria: >
      engine.block_task 拒绝覆盖 COMPLETED/ARCHIVED；已 BLOCKED 幂等返回；
      _cascade_block 用 visited 去重；菱形 DAG 每 task 只 block 一次；
      RUNNING 下游被 block 后 Foreman 收到取消通知；
      _resuggest_ready_tasks 不将 BLOCKED/DEFERRED 放入建议。
    verification:
      level: integration
      command: "python -m pytest tests/test_foreman_workflow.py tests/test_workflow_state.py -q --tb=short -k 'block or cascade'"
      covers:
        tasks: ["T4"]
