schema_version: "1.0.0"

required_issues:
  - "RO-83"
  - "RO-85"
  - "RO-86"
  - "RO-82"
  - "UX-1"
  - "UX-4"
  - "UX-7"
  - "UX-9"
  - "AD-5"
  - "AD-6"
  - "FL-1"
  - "FL-3"
  - "RL-23"
  - "RL-24"

suppress_codes:
  - E_CRITICAL_ENTRYPOINT_UNOWNED
  - E_CRITICAL_FLOW_UNCOVERED
  - E_CRITICAL_FLOW_ENTRYPOINT_UNOWNED
  - W_AGENT_REVIEW_SKIPPED
  - W_UNCLAIMED_TEST_FOR_SOURCE
  - W_VERIFICATION_BEHAVIOR_MISMATCH
  - W_PLAN_SCOPE_UNUSED
  - W_SHARED_PATH_NO_DEPENDENCY
  - W_COVERS_NOT_EXERCISED
  - W_COVERS_PATHS_UNVERIFIED
  - W_CROSS_BOUNDARY_WITHOUT_GLUE
  - W_NO_EARLY_INTEGRATION_CHECKPOINT
  - W_NO_FAILURE_PATH
  - W_TEST_COVERAGE_GAP
  - W_TASK_ADDRESSES_DISJOINT
  - W_VERIFICATION_TARGET_MISSING

batch_e2e_command: "python -m pytest tests/ -x -q --timeout=60 -o addopts="
batch_e2e_timeout: 300

tasks:
  # =========================================================================
  # T1: RO-86 fix — notification_outcome should preserve "force_passed"
  # =========================================================================
  - id: T1
    title: "RO-86: 编排层 notification_outcome 区分 force_passed 和 passed"
    addresses:
      - "RO-86"
    goal_behavior: |
      修改 src/cccc/daemon/foreman/verification_gate.py 的 process_completed_event()：

      当前 line 230 在 `verification.overall_outcome in {"passed", "force_passed"}` 分支中
      无条件设置 `notification_outcome = "passed"`。

      改为：
        notification_outcome = verification.overall_outcome
      这样 force_passed 会被保留为 "verification_force_passed" 而非 "verification_passed"。

      同步更新测试 tests/test_v5_integration_remaining.py 中
      test_force_complete_emits_verification_skipped 用例，验证 notification 回调
      收到的 outcome 是 "force_passed" 而非 "passed"。
    acceptance_criteria: |
      1. force_complete 任务的 notify_verification_fn 收到 verification_outcome="force_passed"
      2. 正常 passed 任务的 notify_verification_fn 仍收到 verification_outcome="passed"
      3. 现有测试全部通过
    claimed_paths:
      - src/cccc/daemon/foreman/verification_gate.py
      - tests/test_v5_integration_remaining.py
      - tests/test_foreman_workflow.py
    verification:
      level: unit
      checks:
        - name: force-complete-tests
          command: "python -m pytest tests/test_v5_integration_remaining.py tests/test_foreman_workflow.py tests/test_completer_mismatch_verification.py -v -o addopts="
        - name: verification-gate-tests
          command: "python -m pytest tests/ -k 'force_complete or force_passed or verification_skipped' -v -o addopts="

  # =========================================================================
  # T2: RO-85 — force_complete ledger event + observer notification
  # =========================================================================
  - id: T2
    title: "RO-85: force_complete 产生显式 ledger 事件并通知 observer"
    addresses:
      - "RO-85"
    depends_on:
      - T1
    goal_behavior: |
      修改 src/cccc/kernel/workflow_state_engine.py：

      当前 force_passed outcome 记录为 KIND_VERIFICATION_SKIPPED。
      在 record_verification_result() 中，当 outcome == "force_passed" 时，
      额外 append 一个 KIND_FORCE_COMPLETED 事件（新常量），包含：
        task_id, reason="foreman force-complete override"

      新增常量到 src/cccc/kernel/workflow_state_types.py：
        KIND_FORCE_COMPLETED = "workflow.force_completed"

      新增测试验证 force_complete 产生 KIND_FORCE_COMPLETED 事件。
    acceptance_criteria: |
      1. force_complete 在 ledger 中产生 workflow.force_completed 事件
      2. 事件包含 task_id 和 reason 字段
      3. 现有 KIND_VERIFICATION_SKIPPED 事件仍保留（不影响现有行为）
      4. 现有测试全部通过
    claimed_paths:
      - src/cccc/kernel/workflow_state_engine.py
      - src/cccc/kernel/workflow_state_types.py
      - tests/test_v5_integration_remaining.py
    verification:
      level: unit
      checks:
        - name: force-complete-ledger
          command: "python -m pytest tests/test_v5_integration_remaining.py -v -o addopts="

  # =========================================================================
  # T3: UX-9 — workflow_guidance.md 完整注入 foreman prompt
  # =========================================================================
  - id: T3
    title: "UX-9: 扩展 wanted_fragments 注入关键 workflow guidance 到 foreman prompt"
    addresses:
      - "UX-9"
    goal_behavior: |
      修改 src/cccc/kernel/prompt_files.py 的 _workflow_guidance_excerpt()（line 33-44）：

      当前 wanted_fragments 只有 "Reuse workers first."（1/39 行）。

      扩展 wanted_fragments 元组，包含 Foreman Responsibilities 段落的关键行：
        - "Reuse workers first."
        - "Slice work into independently verifiable functional slices"
        - "define the full execution contract"
        - "claimed_paths"
        - "verification_command"
        - "Apply the verify gate strictly"
        - "Foreman Responsibilities"
        - "Stay on orchestration only"

      这样 foreman prompt 会包含任务拆分、claimed_paths、verification 等关键指导，
      而不只是"Reuse workers first"一行。
    acceptance_criteria: |
      1. _workflow_guidance_excerpt() 输出包含 "Slice work"、"claimed_paths"、"verification_command" 关键词
      2. 输出行数 ≥5（原来只有 1 行）
      3. 不引入无关行（CLI commands、Worker responsibilities 等不需要注入）
      4. DEFAULT_PREAMBLE_BODY word count 不超过 tests/test_prompt_defaults.py 的上限（当前 ≤400 words）
         如果新增行导致超限，同步调整 test_prompt_defaults.py 的限制值
    claimed_paths:
      - src/cccc/kernel/prompt_files.py
      - tests/test_prompt_defaults.py
    verification:
      level: unit
      checks:
        - name: prompt-files-tests
          command: "python -m pytest tests/test_prompt_defaults.py -v -o addopts="

  # =========================================================================
  # T4: AD-6 — Foreman system prompt Aegis 纪律感知
  # =========================================================================
  - id: T4
    title: "AD-6: Foreman system prompt 加入 Aegis plan 纪律提示"
    addresses:
      - "AD-6"
    goal_behavior: |
      修改 src/cccc/kernel/system_prompt.py 的 _role_policy_lines()（line 72-82）：

      在 foreman 角色的返回列表末尾追加 Aegis 纪律提示（约 5 行）：

      "Plan Discipline (Aegis):",
      "- fix/debug task: fill failure_path + aegis.repair_track (root_cause, canonical_owner)",
      "- refactor/replace task: fill aegis.retirement_track (old_owner, deletion_trigger)",
      "- each task claimed_paths should include relevant test files",
      "- ralph validate W_AEGIS_ warnings should be resolved before workflow execution",
    acceptance_criteria: |
      1. Foreman system prompt 包含 "Plan Discipline (Aegis)" 字样
      2. 包含 repair_track 和 retirement_track 的具体指导
      3. 非 foreman 角色 prompt 不受影响
    claimed_paths:
      - src/cccc/kernel/system_prompt.py
      - tests/test_system_prompt_roles.py
    verification:
      level: unit
      checks:
        - name: system-prompt-test
          command: "python -m pytest tests/test_system_prompt_roles.py -v -o addopts="

  # =========================================================================
  # T5: AD-5 — prompt_builder 按 intent 条件注入 Aegis section
  # =========================================================================
  - id: T5
    title: "AD-5: prompt_builder 按 intent 条件注入 Aegis section"
    addresses:
      - "AD-5"
    depends_on:
      - T4
    goal_behavior: |
      修改 src/cccc/daemon/foreman/prompt_builder.py 的 build_task_prompt()：

      在 acceptance_criteria section 之后，添加调用 _aegis_sections_for_task(task)：

      新增函数 _aegis_sections_for_task(task) -> List[_PromptSection]：
        1. 从 task 获取 aegis 字段，如果无 aegis 则返回空列表
        2. 使用 effective_intent(task) 获取 intent
        3. 按 intent 构建一个 mandatory section：
           - fix → "先定位根因（symptom→reproduction→root cause→canonical owner），再修复。"
           - feature → "先写最小 failing test，确认 RED，再最小实现。"
           - refactor → "交代旧逻辑退役路径。删除优先于保留。"
           - general → 无 section（不浪费 budget）
        4. 追加通用 evidence 提示：
           "完成前提供 Evidence（command, exit status, covered, not covered）。"

      每种 intent 只追加一个 mandatory section，不膨胀 prompt budget。
    acceptance_criteria: |
      1. fix 类 task prompt 包含根因提示
      2. feature 类 task prompt 包含 TDD 提示
      3. general 类 task prompt 无 aegis section
      4. 无 aegis 字段的 task prompt 不变
      5. PromptBudget 测试不回归（新 section 不超 budget 上限）
    claimed_paths:
      - src/cccc/daemon/foreman/prompt_builder.py
      - tests/test_foreman_workflow.py
    verification:
      level: unit
      checks:
        - name: prompt-builder-tests
          command: "python -m pytest tests/ -k 'prompt_builder or prompt_budget' -v -o addopts="

  # =========================================================================
  # T6: RL-23/24 — agent prompt 加 goal_behavior 逻辑验证规则
  # =========================================================================
  - id: T6
    title: "RL-23/24: agent verification prompt 加 goal_behavior 逻辑与运行时一致性规则"
    addresses:
      - "RL-23"
      - "RL-24"
    goal_behavior: |
      修改 src/cccc/ralph/agent.py 的 _build_verification_prompt()（line 233-259）：

      在现有 rule 7 之后追加两条规则：

      Rule 8（RL-23）：
      "8. Validate goal_behavior logic: Check that any set construction, loops,
       conditions, or variable transformations described in goal_behavior are
       internally consistent. If the described logic would produce wrong results
       (e.g., collecting from 'all tasks' without excluding self, iterating
       without boundary), mark as failed with specific explanation.\n"

      Rule 9（RL-24）：
      "9. Validate goal_behavior assumptions: Check that goal_behavior assumptions
       about pre-conditions, existing helper functions, data structure state, and
       runtime behavior match what source_code actually shows. If goal_behavior
       says 'function X only does Y' but source_code shows X already does Z,
       flag the contradiction.\n"
    acceptance_criteria: |
      1. agent verification prompt 包含 rule 8 和 rule 9
      2. rule 8 针对 goal_behavior 内部逻辑一致性
      3. rule 9 针对 goal_behavior 与源码的假设一致性
      4. 现有 agent 测试全部通过
    claimed_paths:
      - src/cccc/ralph/agent.py
      - tests/ralph/test_adversarial_gate.py
    verification:
      level: unit
      checks:
        - name: agent-tests
          command: "python -m pytest tests/ralph/ -v -o addopts="

  # =========================================================================
  # T7: RO-82 — failure_path/awareness_paths 透传验证
  # =========================================================================
  - id: T7
    title: "RO-82: 验证 failure_path/awareness_paths 在 task_registered 事件中存在"
    addresses:
      - "RO-82"
    goal_behavior: |
      检查 src/cccc/kernel/workflow_state_engine.py 的 register_task()：

      当前 line 242 使用 task.model_dump() 序列化整个 TaskRef，
      理论上 failure_path 和 awareness_paths 已包含在序列化输出中。

      添加测试用例 test_task_registered_contains_failure_path_and_awareness_paths
      到 tests/test_v5_integration_remaining.py：
        1. 创建 TaskRef 包含 failure_path="rollback X" 和 awareness_paths=["src/a.py"]
        2. 注册 task
        3. 断言 task_registered 事件 data 包含这两个字段

      如果测试失败说明需要修复序列化逻辑；如果通过则确认 RO-82 已由现有代码处理。
    acceptance_criteria: |
      1. 测试验证 task_registered 事件包含 failure_path 和 awareness_paths
      2. 现有测试全部通过
    claimed_paths:
      - tests/test_v5_integration_remaining.py
    verification:
      level: unit
      checks:
        - name: v5-integration-tests
          command: "python -m pytest tests/test_v5_integration_remaining.py -v -o addopts="

  # =========================================================================
  # T8: UX-7 — serial chain W_FLOW_OWNER_NO_VERIFICATION 降级验证
  # =========================================================================
  - id: T8
    title: "UX-7: 验证串行链 W_FLOW_OWNER_NO_VERIFICATION 降级逻辑"
    addresses:
      - "UX-7"
    goal_behavior: |
      检查 src/cccc/ralph/validation_rules/coverage.py 的 W_FLOW_OWNER_NO_VERIFICATION 逻辑：

      实际函数名为 _check_flow_segment_ownership()（约 line 590），不是
      _check_flow_owner_no_verification。

      当前 line 631-635 已有降级逻辑：
        - task.role == "leaf" 且被 integration/verification 任务覆盖 → hint
        - task.id in covered_by_flow_verifiers → hint

      需要确认 covered_by_flow_verifiers（line 608-614）是否正确收集了
      所有 integration/verification task 的 verification.covers.tasks。

      如果逻辑已正确（leaf task 被下游 integration covers.tasks 包含时已降级），
      则只需在 tests/ralph/test_ralph_standalone.py 中添加测试用例确认行为。

      如果逻辑不完整，修改 _check_flow_segment_ownership() 确保：
      当 task 被任何其他 task 的 covers.tasks 包含时，severity 降为 hint。
    acceptance_criteria: |
      1. 串行链中 leaf + integration covers 不产生 W_FLOW_OWNER_NO_VERIFICATION warning
      2. 未被任何 covers.tasks 包含的 task 仍报 warning
      3. 新增测试覆盖此场景
    claimed_paths:
      - src/cccc/ralph/validation_rules/coverage.py
      - tests/ralph/test_ralph_standalone.py
    verification:
      level: unit
      checks:
        - name: coverage-rule-tests
          command: "python -m pytest tests/ralph/test_ralph_standalone.py -v -o addopts="

  # =========================================================================
  # T9: FL-1 — e2e flow step-1 自动准备 workspace + daemon
  # =========================================================================
  - id: T9
    title: "FL-1: e2e flow step-1 自动准备 workspace、git init、docs 复制"
    addresses:
      - "FL-1"
    goal_behavior: |
      修改 src/cccc/ralph/flow_steps_e2e.py 的 _check_env_prepare()（line 22-48）：

      扩展准备逻辑为：
      1. mkdir workspace（如不存在）
      2. git init（如 workspace/.git 不存在）
      3. 复制 docs/（现有逻辑保留）
      4. 检查 cccc daemon status（subprocess），如果未运行则记录失败详情
         提示用户启动 daemon（不自动启动 daemon，因为需要用户确认配置）

      不自动创建 group/actor（风险太高），但在 details 中提供清晰的手动步骤提示。
    acceptance_criteria: |
      1. 空目录自动 mkdir + git init + docs 复制
      2. 已存在的 workspace 不重复 git init
      3. daemon 未运行时返回 failed 并提示启动命令
    claimed_paths:
      - src/cccc/ralph/flow_steps_e2e.py
      - tests/ralph/test_flow_e2e.py
    verification:
      level: unit
      checks:
        - name: flow-steps-tests
          command: "python -m pytest tests/ralph/test_flow_e2e.py -v -o addopts="

  # =========================================================================
  # T10: FL-3 — e2e flow step-6 区分短版/full 版
  # =========================================================================
  - id: T10
    title: "FL-3: e2e flow step-6 区分短版和 full 版问题清单"
    addresses:
      - "FL-3"
    depends_on:
      - T9
    goal_behavior: |
      修改 src/cccc/ralph/flow_steps_e2e.py 的 _check_improvement_register()（line 93-109）：

      当前只检查 tracker（默认短版）有 additions。改为同时检查：
      1. 短版（问题清单-v5-ralph.md）有新增行（新发现写入短版）
      2. 全量版（问题清单-v5-ralph-full.md）有变更（已验证条目迁入）

      具体改法：
      - tracker_short = state.params.get("tracker")（默认值为问题清单短版路径）
      - tracker_full = tracker_short.replace("-ralph.md", "-ralph-full.md")
      - 对两个文件分别 git diff 检查
      - 两者都有变更才算通过（details 分别列出两个文件的检查结果）
    acceptance_criteria: |
      1. 只改短版不改全量版 → 不通过
      2. 两个文件都有变更 → 通过
      3. detail 输出分别显示两个文件的检查结果
    claimed_paths:
      - src/cccc/ralph/flow_steps_e2e.py
      - tests/ralph/test_flow_e2e.py
    verification:
      level: unit
      checks:
        - name: flow-steps-tests
          command: "python -m pytest tests/ralph/test_flow_e2e.py -v -o addopts="

  # =========================================================================
  # T11: RO-83 + UX-1 + UX-4 — 文档和模板补全
  # =========================================================================
  - id: T11
    title: "RO-83/UX-1/UX-4: capability guide + template 补全 aegis/mock_tests/challenge 文档"
    addresses:
      - "RO-83"
      - "UX-1"
      - "UX-4"
    depends_on:
      - T5
    goal_behavior: |
      1. 更新 docs/foreman-capability-guide.md：
         - aegis 字段补全 Description（当前为空），说明 AegisDiscipline 包含 intent/repair_track/retirement_track
         - mock_tests 字段补全 Description，说明 MockTestCase 包含 name/input/expected_output/setup_command/verify_command/description
         - verification_mode 字段补全 Description，说明三种模式（ralph/agent/challenge）
         - 添加 provides/consumes 完整示例（对象格式 {name, kind, schema_hint}，非字符串）

      2. 更新 plans/_template.yaml：
         - 添加 verification_mode: challenge 示例 task
         - 添加 aegis 字段示例（含 intent, repair_track, retirement_track）
         - 添加 mock_tests 示例（含 MockTestCase 完整字段）
         - provides/consumes 示例已存在（T-contract-example），确认格式正确

      此项为文档改动，零代码风险。
    acceptance_criteria: |
      1. foreman-capability-guide.md 中 aegis/mock_tests/verification_mode 的 Description 非空
      2. capability guide 包含 provides/consumes 的 {name, kind} 对象格式示例
      3. _template.yaml 包含 verification_mode: challenge + aegis + mock_tests 的完整示例
      4. ralph validate plans/_template.yaml 0 error
    claimed_paths:
      - docs/foreman-capability-guide.md
      - plans/_template.yaml
    verification:
      level: compile
      checks:
        - name: template-validate
          command: "ralph validate plans/_template.yaml --no-agent --compact"

  # =========================================================================
  # T-int: 集成验证
  # =========================================================================
  - id: T-int
    title: "集成验证：全量 regression + 跨任务交互验证"
    depends_on:
      - T1
      - T2
      - T3
      - T4
      - T5
      - T6
      - T7
      - T8
      - T9
      - T10
      - T11
    role: integration
    goal_behavior: |
      运行全量 pytest 套件确认所有改动没有引入回归。
      重点验证跨任务交互：
      - T1+T2：force_passed 在 notification 和 ledger 中一致
      - T3+T4+T5：foreman prompt 包含 workflow guidance + Aegis 纪律
      - T9+T10：flow 步骤改动不影响 solve 流程
    acceptance_criteria: |
      1. 全量 pytest 0 failure
      2. 新增测试全部 pass
    claimed_paths:
      - tests/test_foreman_workflow.py
    verification:
      level: integration
      checks:
        - name: full-regression
          command: "python -m pytest -x -q --override-ini='addopts='"
      covers:
        tasks:
          - T1
          - T2
          - T3
          - T4
          - T5
          - T6
          - T7
          - T8
          - T9
          - T10
          - T11
