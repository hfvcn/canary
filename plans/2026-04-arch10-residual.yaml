         且**为每个被移走的 ID 检查它在 full 中的"已实施/已验证"小节里出现**——
         不仅是"出现在文件任意位置"。检查方式：找包含 "已验证" 或 "已实施" 的章节标题，
         在该章节后续 N 行内查 ID。
      6. 主清单"## 四、已移入 Full 的条目"列表必须更新含本次移走的 ID。
      7. Markdown 表格完整性：主清单和 full 都不应出现表格行不对齐的迹象
         （简单启发：若文件含 "|" 行，相邻 "|" 行的 "|" 列数必须一致；不一致 → FAIL）。
         不必完美，至少能抓"我手抖删了一行表头"这类破坏。
      8. 内部链接完整性：所有 [text](file.md) 形式的相对链接，目标文件必须存在
         （在 todo/ 目录下查）。

      脚本结构示意：
      ```python
      import pathlib, sys, re
      ROOT = pathlib.Path('todo')
      doc = (ROOT / '问题清单.md').read_text(encoding='utf-8')
      full = (ROOT / '问题清单-full.md').read_text(encoding='utf-8')

      errors = []

      # 1. 三个标题必须存在
      for header in ['## 一、核心待解决', '## 二、次级待解决']:
          if header not in doc:
              errors.append(f'missing header: {header}')

      # 解析 sections（split 时严格断言）
      def section(text, start, end_prefixes):
          if start not in text:
              return None
          tail = text.split(start, 1)[1]
          for end in end_prefixes:
              if end in tail:
                  tail = tail.split(end, 1)[0]
                  break
          return tail

      core = section(doc, '## 一、核心待解决', ['## 二'])
      sec = section(doc, '## 二、次级待解决', ['## 三'])
      if core is None: errors.append('core section unparseable')
      if sec is None: errors.append('secondary section unparseable')

      # 2/3. 移除断言
      if core is not None:
          for tid in ['ARCH-4', 'FIX-13']:
              if tid in core:
                  errors.append(f'{tid} still in core section')
      if sec is not None:
          for tid in ['FIX-22', 'FIX-25', 'FIX-26']:
              if tid in sec:
                  errors.append(f'{tid} still in secondary section')

      # 4. ARCH-10 P0 标记不应再出现
      if re.search(r'### ARCH-10[^\n]*P0', doc):
          errors.append('ARCH-10 still marked as P0 in main list')

      # 5. full 中"已实施/已验证"区域必须含被移走的 ID
      if not re.search(r'已验证|已实施', full):
          errors.append('full archive missing 已验证/已实施 section')
      else:
          archived_section = full[max(full.find('已验证'), full.find('已实施')):]
          for tid in ['ARCH-4', 'FIX-13', 'FIX-22', 'FIX-25', 'FIX-26']:
              if tid not in archived_section:
                  errors.append(f'{tid} missing from full archive section')

      # 6. 已移入 Full 列表更新
      moved_section = section(doc, '## 四、已移入 Full', ['## 五']) or section(doc, '已移入 Full', [])
      if moved_section is None:
          errors.append('main list missing 已移入 Full section')
      else:
          for tid in ['ARCH-4', 'FIX-13', 'FIX-22', 'FIX-25', 'FIX-26']:
              if tid not in moved_section:
                  errors.append(f'{tid} not listed in 已移入 Full section')

      # 7. 表格列数一致性（启发式）
      for name, text in [('main', doc), ('full', full)]:
          rows = [line for line in text.splitlines() if line.strip().startswith('|') and line.strip().endswith('|')]
          col_counts = [line.count('|') for line in rows]
          if col_counts and len(set(col_counts)) > 3:  # 容忍轻微不均
              errors.append(f'{name} markdown tables look broken (column counts: {sorted(set(col_counts))[:5]})')

      # 8. 链接目标存在
      for name, text in [('main', doc), ('full', full)]:
          for m in re.finditer(r'\[[^\]]+\]\(([^)]+\.md)\)', text):
              target = m.group(1)
              if target.startswith('http'):
                  continue
              path = (ROOT / target).resolve()
              if not path.exists():
                  errors.append(f'{name} broken link: {target}')

      if errors:
          print('FAIL:'); [print('  - ' + e) for e in errors]; sys.exit(1)
      print('issue list alignment OK')
      ```
      退出 0 表示对齐，非 0 列出所有问题。

