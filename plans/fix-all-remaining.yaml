critical_flows:
  - id: verification_gate_processing
    description: "process_completed_event dispatches by verification_mode, applies gates, records result"
    entrypoints:
      - src/cccc/daemon/foreman/verification_gate.py::process_completed_event
    test_created_by:
      - T2
      - T3
      - T4
      - T8
    required_verification_level: integration

  - id: workflow_state_recovery
    description: "task failure/deferred releases agent, enables retry, supports override"
    entrypoints:
      - src/cccc/daemon/foreman/workflow_orchestrator.py::on_verification_result
    test_created_by:
      - T1
      - T14
      - T15
    required_verification_level: integration

  - id: ralph_validation_pipeline
    description: "ralph validate runs structural + discipline + security rules"
    entrypoints:
      - src/cccc/ralph/validator.py::validate
    test_created_by:
      - T7
      - T9
      - T21
    required_verification_level: unit

# ============================================================================
# Tasks organized by dependency chain (Waves are approximate — check depends_on)
# Wave 1: No deps; Wave 2+: depends on earlier tasks
# ============================================================================

tasks:
  - id: T1
    title: "RO-95: release agent on verification failure + shadow blocked"
    addresses:
      - RO-95
    goal_behavior: |
      Fix workflow_orchestrator.py so agent is released when verification fails:

      1. on_verification_result() (line ~1769): after setting TASK_STATUS_FAILED (line ~1804),
         call self._release_agent_for_task(task_id) to clear _active_assignments.
      2. _update_shadow_blocked() (line ~1714): after setting TASK_STATUS_FAILED,
         call self._release_agent_for_task(task_id).

      This prevents the death loop where _active_assignments stays permanently
      polluted after verification failure, causing defer_batch_for_single_writer
      to block all future batches.
    acceptance_criteria: |
      1. on_verification_result sets failed AND releases agent
      2. _update_shadow_blocked sets failed AND releases agent
      3. After verification failure, _active_assignments no longer contains the failed agent
      4. New batch dispatch succeeds after a task verification failure
    claimed_paths:
      - src/cccc/daemon/foreman/workflow_orchestrator.py
      - tests/test_deferred_recovery.py
    verification:
      level: unit
      checks:
        - name: deferred-recovery
          command: "python -m pytest tests/test_deferred_recovery.py -v"
    provides:
      - name: agent_release_on_failure
        kind: runtime_capability

  - id: T2
    title: "RO-97: make security_lint and input_robustness gates mode-aware"
    addresses:
      - RO-97
    goal_behavior: |
      In verification_gate.py, make _apply_security_lint_gate() (line ~541) and
      _apply_input_robustness_gate() (line ~642) respect verification_mode:

      1. Read mode from task_ref (same pattern as _apply_aegis_evidence_gate line ~490)
      2. mode=ralph: gates record advisory warnings only, never block
      3. mode=agent: gates record warnings only, never block
      4. mode=challenge: gates remain blocking (current behavior)

      Follow the existing pattern in _apply_aegis_evidence_gate (line ~490-505).

      Note: _should_upgrade_to_challenge() may auto-upgrade ralph to challenge when
      a task touches critical_flow entrypoints. This is by design (T26 tests it).
      The mode-awareness here applies AFTER any upgrade has occurred.
    acceptance_criteria: |
      1. verification_mode=ralph task (no critical_flow) passes even if debug=True (warning only)
      2. verification_mode=challenge task still blocked by debug=True (current behavior)
      3. ralph task auto-upgraded to challenge via critical_flow still gets blocking gates
      4. Same mode logic applied to input_robustness gate
      5. Existing tests in test_verification_mode_routing.py still pass
    claimed_paths:
      - src/cccc/daemon/foreman/verification_gate.py
      - tests/test_verification_mode_routing.py
    awareness_paths:
      - tests/test_security_lint_blocking.py
      - tests/test_input_robustness_gate.py
    verification:
      level: unit
      checks:
        - name: mode-routing
          command: "python -m pytest tests/test_verification_mode_routing.py -v"
    provides:
      - name: mode_aware_gates
        kind: runtime_capability

  - id: T5
    title: "AD-1: AegisDiscipline sub-model + TaskSpec.aegis field"
    addresses:
      - AD-1
    goal_behavior: |
      Add AegisDiscipline schema to models.py and wire it through:

      1. models.py: new AegisDiscipline model (intent, repair_track, retirement_track,
         baseline_refs, patch_shape_triage) with all Optional fields and extra="ignore"
      2. models.py: TaskSpec.aegis: Optional[AegisDiscipline] = None
      3. ralph_ipc.py: TaskRef.aegis: Optional[Dict[str, Any]] = None (Dict to avoid circular import)
      4. models.py: TaskSpec.to_task_ref() transparently passes aegis
      5. plan_io.py: strict plan nested field check covers aegis sub-model
      6. cli.py: ralph schema output includes AegisDiscipline
      7. guide_generator.py: MODEL_REFERENCES includes AegisDiscipline

      All fields Optional+default None, old plans unaffected.
    acceptance_criteria: |
      1. Old plan (no aegis) validates with zero new errors
      2. New plan with aegis validates and parses correctly
      3. TaskRef receives and passes aegis data
      4. ralph schema output shows AegisDiscipline fields
    claimed_paths:
      - src/cccc/ralph/models.py
      - src/cccc/contracts/v1/ralph_ipc.py
      - src/cccc/ralph/plan_io.py
      - src/cccc/ralph/cli.py
      - src/cccc/ralph/guide_generator.py
      - tests/test_aegis_discipline_infra.py
    verification:
      level: unit
      checks:
        - name: aegis-infra
          command: "python -m pytest tests/test_aegis_discipline_infra.py -v"
    provides:
      - name: aegis_schema
        kind: runtime_capability

  - id: T16
    title: "RO-84: ralph validate produces ledger event"
    depends_on:
      - T5
      - T6
    addresses:
      - RO-84
    goal_behavior: |
      When ralph validate completes, send a ralph.validate_result event to the daemon:

      1. In validator.py or cli.py, after validate() returns, emit event with:
         - error_count, warning_count, hint_count
         - plan_path digest (sha256 of file content)
         - outcome: "passed" or "failed"
      2. Use existing daemon IPC (call_daemon or similar) to send the event.
      3. If daemon is not running, silently skip (validate works standalone).
    acceptance_criteria: |
      1. validate success sends ralph.validate_result with outcome=passed
      2. validate failure sends ralph.validate_result with outcome=failed
      3. Event includes error/warning/hint counts and plan digest
      4. No daemon running: validate still works, no crash
    claimed_paths:
      - src/cccc/ralph/validator.py
      - src/cccc/ralph/cli.py
      - tests/test_ralph_validate_ledger.py
      - tests/test_validate_ledger_event.py
    verification:
      level: unit
      checks:
        - name: validate-ledger
          command: "python -m pytest tests/test_ralph_validate_ledger.py tests/test_validate_ledger_event.py -v"

  - id: T18
    title: "FL-6: flow step-4 distinguishes new vs pre-existing changes"
    addresses:
      - FL-6
    goal_behavior: |
      Modify _check_improvement_register() in flow_improvement_check.py:

      Instead of just checking "git diff has additions", verify that the diff
      contains additions from the current session. Use state.version or
      state.started_at as discriminator:
      - If state.version is set, check diff contains that version string (e.g. "v39")
      - Otherwise, check that at least one added line has content not in the
        pre-flow snapshot (compare against git stash or baseline)
    acceptance_criteria: |
      1. Tracker with only pre-existing additions (no current session marker) fails step-4
      2. Tracker with current version marker passes step-4
      3. Existing flow behavior preserved when version is set
    claimed_paths:
      - src/cccc/ralph/flow_improvement_check.py
      - tests/test_flow_improvement_check.py
    verification:
      level: unit
      checks:
        - name: improvement-check
          command: "python -m pytest tests/test_flow_improvement_check.py -v"

  - id: T19
    title: "FL-15 + FL-7: flow step-6 guidance for new findings, archive, and version marker"
    addresses:
      - FL-15
      - FL-7
    goal_behavior: |
      Update E2E flow step-6 instruction in flow_steps_e2e.py (line ~253-259) and
      solve flow step-4 instruction in flow_engine.py (SOLVE_STEPS line ~233):

      E2E step-6 instruction should explicitly list three tasks:
      1. Write new findings discovered during this E2E round into the short tracker
      2. Move issues confirmed fixed (verified in this round) from short to full version
      3. Add a version marker line (e.g. "v{N}") so git diff can detect current-session adds

      Solve flow step-4 instruction should similarly guide:
      1. Record discovered gaps and new findings
      2. Archive resolved items
      3. Include version marker
    acceptance_criteria: |
      1. E2E step-6 instruction_text contains guidance for all three tasks
      2. Solve step-4 instruction_text mentions archive and version marker
      3. Agent following instructions produces all three categories of tracker updates
    claimed_paths:
      - src/cccc/ralph/flow_steps_e2e.py
      - src/cccc/ralph/flow_engine.py
      - tests/test_flow_archive_prompt.py
    verification:
      level: unit
      checks:
        - name: flow-archive
          command: "python -m pytest tests/test_flow_archive_prompt.py -v"

  - id: T20
    title: "FL-5: guide --update treats dev branch warnings as advisory"
    depends_on:
      - T5
      - T17
    addresses:
      - FL-5
    goal_behavior: |
      In guide_generator.py update_guide() or the flow step-6 check:

      When running on a non-main branch (e.g. dev) with many uncommitted changes,
      the "affected by changes — review manually" warnings should not block the
      flow step. Approach: flow step check treats these warnings as advisory
      (non-blocking) — display them but do not fail the step.
    acceptance_criteria: |
      1. dev branch with pre-existing uncommitted changes does not block flow step-6/guide
      2. Warnings still displayed for informational purposes
      3. Main branch behavior unchanged
    claimed_paths:
      - src/cccc/ralph/guide_generator.py
      - tests/test_flow_guide_advisory.py
    verification:
      level: unit
      checks:
        - name: guide-advisory
          command: "python -m pytest tests/test_flow_guide_advisory.py -v"

  - id: T24
    title: "UX-12: exempt grep/test commands from SUSPICIOUS duration marking"
    depends_on:
      - T11
    addresses:
      - UX-12
    goal_behavior: |
      In ralph_service.py (line ~1697-1701), before marking a check as SUSPICIOUS:

      Check if the command starts with known-fast prefixes: grep, test, [, true, false.
      If so, skip the SUSPICIOUS marking regardless of duration.

      SUSPICIOUS_DURATION_THRESHOLD_MS is already 50ms (line ~64). The exemption
      is for commands that are inherently fast.
    acceptance_criteria: |
      1. grep command completing in 5ms is NOT marked SUSPICIOUS
      2. test -f command completing in 2ms is NOT marked SUSPICIOUS
      3. python command completing in 5ms IS still marked SUSPICIOUS
      4. Threshold logic unchanged for non-exempt commands
    claimed_paths:
      - src/cccc/daemon/foreman/ralph_service.py
      - tests/test_suspicious_exempt.py
    verification:
      level: unit
      checks:
        - name: suspicious-exempt
          command: "python -m pytest tests/test_suspicious_exempt.py -v"

  - id: T26
    title: "FL-13 + RO-101: test infrastructure — xdist flaky fix + challenge upgrade unit test"
    addresses:
      - FL-13
      - RO-101
    goal_behavior: |
      1. FL-13: Mark test_ralph_enhancement_surface_e2e as @pytest.mark.serial
         or fix the underlying resource race in the E2E enhancement test.
      2. RO-101: Add dedicated unit tests for _should_upgrade_to_challenge() in
         tests/test_critical_flow_challenge_upgrade.py covering:
         - ralph mode task touching critical_flow entrypoint -> upgrade to challenge
         - ralph mode task not touching critical_flow -> no upgrade
         - challenge mode task -> no change
    acceptance_criteria: |
      1. FL-13: test_ralph_enhancement_surface_e2e passes consistently under xdist
      2. RO-101: _should_upgrade_to_challenge has at least 3 dedicated unit tests
    claimed_paths:
      - tests/test_flow_verify_xdist.py
      - tests/test_critical_flow_challenge_upgrade.py
    verification:
      level: unit
      checks:
        - name: challenge-upgrade
          command: "python -m pytest tests/test_critical_flow_challenge_upgrade.py -v"
        - name: xdist-flaky
          command: "python -m pytest tests/test_flow_verify_xdist.py -v"

# ============================================================================
# Tasks with dependencies on earlier tasks
# ============================================================================

  - id: T3
    title: "RO-98: distinguish task failure from verifier infra failure"
    depends_on:
      - T2
      - T5
    addresses:
      - RO-98
    goal_behavior: |
      In verification_gate.py, modify process_completed_event (line ~123):

      1. Add verification_infra_error status. When verifier itself fails (e.g. cannot
         read files, network error, timeout), the failure_type should be "infra_error"
         rather than "task_quality".
      2. Verifier return structure includes failure_type: task_quality | infra_error | timeout
      3. infra_error does NOT count against worker retry count
      4. infra_error triggers automatic verifier retry (up to 2 attempts)
      5. After retries exhausted, escalate to foreman decision

      In workflow_orchestrator.py, on_task_failed should check failure_type:
      - task_quality -> normal retry logic (counts against limit)
      - infra_error -> retry verifier only (does not count as worker retry)
    acceptance_criteria: |
      1. Challenge reviewer file-read failure -> verification_infra_error, not task_failed
      2. infra_error does not decrement worker retry count
      3. Normal task quality failure still counts as retry
      4. infra_error auto-retries verifier up to 2 times
    claimed_paths:
      - src/cccc/daemon/foreman/verification_gate.py
      - src/cccc/contracts/v1/ralph_ipc.py
      - tests/test_verification_infra_error.py
    awareness_paths:
      - src/cccc/daemon/foreman/workflow_orchestrator.py
    consumes:
      - name: mode_aware_gates
        from: T2
        kind: runtime_capability
    verification:
      level: unit
      checks:
        - name: infra-error
          command: "python -m pytest tests/test_verification_infra_error.py -v"

  - id: T4
    title: "SL-1/2/3: security lint upgrade — blocking + extended patterns + input robustness"
    depends_on:
      - T2
      - T3
    addresses:
      - SL-1
      - SL-2
      - SL-3
    goal_behavior: |
      In verification_gate.py:

      1. SL-1: _check_security_lint (line ~759) — when a pattern hits in challenge mode,
         change record_verification_warning to record_verification_failure (blocking).
         In ralph/agent mode, keep as warning (per T2 mode-awareness).
      2. SL-2: Add new patterns to the lint matrix:
         - bare_except: re.compile(r'except\s*:')
         - eval_call: re.compile(r'\beval\s*\(')
         - exec_call: re.compile(r'\bexec\s*\(')
         - app_run_debug: re.compile(r'app\.run\(.*debug\s*=\s*True')
         - hardcoded_secret: re.compile(r'(password|secret|api_key)\s*=\s*["\'][^"\']+["\']')
         Add whitelist for test files and known-safe patterns.
      3. SL-3: _check_input_robustness — same pattern: challenge mode blocking,
         ralph/agent mode warning only.
    acceptance_criteria: |
      1. challenge mode + debug=True -> verification failed (blocking)
      2. ralph mode + debug=True -> warning only (non-blocking)
      3. eval() in non-test file detected
      4. bare except in non-test file detected
      5. Test files are whitelisted (no false positives on test assertions)
    claimed_paths:
      - src/cccc/daemon/foreman/verification_gate.py
      - tests/test_security_lint_blocking.py
      - tests/test_security_lint_extended.py
    consumes:
      - name: mode_aware_gates
        from: T2
        kind: runtime_capability
    verification:
      level: unit
      checks:
        - name: lint-blocking
          command: "python -m pytest tests/test_security_lint_blocking.py -v"
        - name: lint-extended
          command: "python -m pytest tests/test_security_lint_extended.py -v"

  - id: T6
    title: "AD-2: intent inference helper + discipline.py rule infrastructure"
    depends_on:
      - T5
    addresses:
      - AD-2
    goal_behavior: |
      1. In src/cccc/ralph/aegis.py: add effective_intent(task) -> str function.
         Priority: aegis.intent if set -> keyword inference from title/goal -> "general".
         Keywords: fix/bug/debug -> "fix", add/feature/implement -> "feature",
         refactor/migrate/replace -> "refactor", test -> "test".
         Also add has_patch_shape_risk(task) -> bool helper.

      2. In src/cccc/ralph/validation_rules/discipline.py: set up rule infrastructure
         matching existing pattern in structural.py/coverage.py.

      3. In validation_rules/__init__.py: re-export discipline module.

      4. In validator.py: _collect_structural_issues() calls discipline rules.

      5. In agent.py: RULE_DOCS and RULE_VERSION_REGISTRY include discipline rules.
    acceptance_criteria: |
      1. effective_intent works on both TaskSpec and TaskRef
      2. discipline.py follows same pattern as structural.py
      3. ralph explain --code AD_xxx outputs rule documentation
      4. Existing tests pass (no regression)
    claimed_paths:
      - src/cccc/ralph/aegis.py
      - src/cccc/ralph/validation_rules/discipline.py
      - src/cccc/ralph/validation_rules/__init__.py
      - src/cccc/ralph/validator.py
      - src/cccc/ralph/agent.py
      - tests/test_aegis_discipline_infra.py
    consumes:
      - name: aegis_schema
        from: T5
        kind: runtime_capability
    verification:
      level: unit
      checks:
        - name: discipline-infra
          command: "python -m pytest tests/test_aegis_discipline_infra.py -v"

  - id: T11
    title: "RO-99: inject security checklist into challenge verification prompt"
    depends_on:
      - T2
    addresses:
      - RO-99
    goal_behavior: |
      In ralph_service.py _build_verification_prompt() (~30 lines change):

      1. Read plan.critical_flows and extract security keywords
         (input-validation, ssrf, auth, xss, injection, etc.)
      2. For each matched keyword category, inject a security checklist section
         into the Gemini verification prompt:
         - input-validation -> "Are all user inputs validated? Can FTS5/SQL operators
           be injected? Are there resource limits?"
         - ssrf -> "Does URL validation handle encoded IPs, DNS rebinding, redirects?"
         - *-auth -> "Is token comparison timing-safe? Are secrets hardcoded?"
      3. No security critical_flow -> no checklist injected -> Gemini does functional review only
      4. Checklist driven by critical_flow keywords, not project type
    acceptance_criteria: |
      1. Plan with input-validation critical_flow -> Gemini prompt contains security checklist
      2. Plan without security critical_flow -> no checklist injected
      3. Checklist content matches the declared critical_flow category
      4. Existing challenge verification tests still pass
    claimed_paths:
      - src/cccc/daemon/foreman/ralph_service.py
      - tests/test_challenge_security_checklist.py
    consumes:
      - name: mode_aware_gates
        from: T2
        kind: runtime_capability
    verification:
      level: unit
      checks:
        - name: security-checklist
          command: "python -m pytest tests/test_challenge_security_checklist.py -v"

  - id: T14
    title: "FL-11: foreman override path for verification gate"
    depends_on:
      - T1
    addresses:
      - FL-11
    goal_behavior: |
      Add formal override mechanism to workflow_orchestrator.py:

      1. New method: override_task(task_id, reason, evidence) that:
         - Sets task status to completed_by_override
         - Emits workflow.foreman_override ledger event (with reason, evidence, timestamp)
         - Releases agent if still assigned
         - Unblocks downstream dependency gate
      2. Wire to CLI: cccc workflow override --task TASK_ID --reason "..." --evidence "..."
      3. completed_by_override is treated as success by downstream dependency check
    acceptance_criteria: |
      1. override_task sets status and emits ledger event
      2. Downstream tasks can start after override
      3. Override reason and evidence recorded in ledger
      4. CLI command works end-to-end
    claimed_paths:
      - src/cccc/daemon/foreman/workflow_orchestrator.py
      - src/cccc/daemon/ralph_ipc_handler.py
      - tests/test_workflow_override.py
    awareness_paths:
