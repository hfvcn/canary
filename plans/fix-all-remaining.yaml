        from: T1
        kind: runtime_capability
    verification:
      level: unit
      checks:
        - name: override
          command: "python -m pytest tests/test_workflow_override.py -v"

  - id: T17
    title: "FL-4 + UX-5: guide Field descriptions + auto-generation"
    depends_on:
      - T5
    addresses:
      - FL-4
      - UX-5
    goal_behavior: |
      1. FL-4: In models.py, add description= parameter to Field() for key fields:
