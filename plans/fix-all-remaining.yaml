  - id: T7
    title: "AD-3: first 5 high-signal discipline rules"
    depends_on:
      - T6
    addresses:
      - AD-3
    goal_behavior: |
      Add 5 rules to src/cccc/ralph/validation_rules/discipline.py:

      1. Stub-content error: title/goal/acceptance contains deferred-work markers
         (the 5 tokens defined in PLACEHOLDER_TOKENS, outside code fences per PLR-1).
         Code: E_AEGIS_*_CONTENT
      2. Retirement track error: intent=refactor/migration with new fallback/adapter/
         provider but no aegis.retirement_track. Code: E_AEGIS_RETIREMENT_TRACK_MISSING
      3. Repair track warning: intent=fix but no aegis.repair_track.
         Code: W_AEGIS_FIX_NO_REPAIR_TRACK
      4. TDD warning: intent=fix/feature, claimed_paths has no test file
         (test_/tests/_test). Code: W_AEGIS_TDD_NO_TEST_PATH
      5. Baseline warning: complex task (3+ deps or has contracts/critical_flows)
         but empty aegis.baseline_refs. Code: W_AEGIS_COMPLEX_MISSING_BASELINE
    acceptance_criteria: |
      1. Plan with deferred-work marker in title triggers stub-content error
      2. Refactor task without retirement_track triggers retirement error
      3. Fix task without repair_track triggers repair warning
      4. Feature task without test file triggers TDD warning
      5. Full pytest suite: zero regression
    claimed_paths:
      - src/cccc/ralph/validation_rules/discipline.py
      - tests/test_aegis_discipline_rules.py
    verification:
      level: unit
      checks:
        - name: discipline-rules
          command: "python -m pytest tests/test_aegis_discipline_rules.py -v"

