    depends_on:
      - T6
    addresses:
      - AD-9
    goal_behavior: |
      In discipline.py or discipline_security.py, add rule:

      _check_aegis_security_chain: when aegis.intent=feature AND plan has
      security-related critical_flow AND verification.checks contains no
      security test -> emit E_AEGIS_SECURITY_CHAIN_MISSING (error).

      This ensures plans that declare security concern also have security tests.
      Partially redundant with AD-11 (which auto-generates checks), but serves
      as fail-safe if AD-11 is not used.
    acceptance_criteria: |
      1. intent=feature + security critical_flow + no security checks -> error
      2. intent=feature + security critical_flow + has security checks -> no error
      3. No security critical_flow -> no check triggered
    claimed_paths:
