      - tests/test_aegis_security_chain.py
    verification:
      level: unit
      checks:
        - name: security-chain
          command: "python -m pytest tests/test_aegis_security_chain.py -v"

  - id: T12
    title: "AD-11: LLM behavioral security checks from plan metadata"
    depends_on:
      - T5
      - T16
    addresses:
      - AD-11
    goal_behavior: |
      1. New CLI subcommand: ralph validate --generate-security-checks plan.yaml
      2. Enhance security_check_generator.py (already exists as deterministic template):
         - Read plan metadata: goal_behavior, acceptance_criteria, provides.schema_hint,
           critical_flows with security keywords
         - Generate deterministic behavioral check commands based on security recipes
           and critical_flow categories (no runtime LLM call required for core recipes)
         - Output: JSON list of {name, command, auto_generated: true} check specs
      3. No security critical_flow -> no generation -> zero noise
      4. Generated checks can be reviewed/modified by foreman before adding to plan
    acceptance_criteria: |
      1. Plan with input-validation critical_flow generates >= 3 behavioral checks
      2. Generated checks are executable python -c commands
      3. Plan without security critical_flow generates zero checks
      4. Output is valid JSON matching CheckSpec schema
    claimed_paths:
      - src/cccc/ralph/security_check_generator.py
      - src/cccc/ralph/cli.py
      - tests/test_security_check_generator.py
    consumes:
      - name: aegis_schema
        from: T5
        kind: runtime_capability
    verification:
      level: unit
      checks:
        - name: security-gen
          command: "python -m pytest tests/test_security_check_generator.py -v"

  - id: T13
    title: "RO-92/93/94: security recipe library (TOCTOU + hostname encoding + timing-safe)"
    depends_on:
      - T11
    addresses:
      - RO-92
      - RO-93
      - RO-94
    goal_behavior: |
      In security_recipes.py (already exists), implement recipe system:

      1. RO-92 TOCTOU: critical_flow with temporal_pattern: store_then_use |
         check_then_act triggers two-phase test template. No temporal_pattern -> silent.
      2. RO-93 hostname encoding: critical_flow with ssrf/url keywords AND no
         encoding matrix in checks -> emit W_SSRF_ENCODING_UNCOVERED (hint).
         Matrix: [0177.0.0.1, 2130706433, 0x7f000001, [::ffff:127.0.0.1], [::1]]
      3. RO-94 timing-safe: critical_flow with auth/token/key keywords AND
         claimed_paths source has token comparison without secrets.compare_digest
         -> emit W_AUTH_TIMING_UNSAFE (hint).

      All recipes: no matching critical_flow -> zero output -> zero noise.
      New recipes start at hint level (upgrade to warning is a future manual decision).
    acceptance_criteria: |
      1. Plan with temporal_pattern: store_then_use -> recipe triggers
      2. Plan with ssrf critical_flow + no encoding tests -> W_SSRF_ENCODING_UNCOVERED
      3. Plan with auth critical_flow + == comparison -> W_AUTH_TIMING_UNSAFE
      4. Plan without security flows -> zero recipe output
    claimed_paths:
      - src/cccc/ralph/security_recipes.py
      - tests/test_security_recipes.py
    verification:
      level: unit
      checks:
        - name: recipes
          command: "python -m pytest tests/test_security_recipes.py -v"

  - id: T15
    title: "FL-12 + UX-11: deferred state recovery + re-verify with refreshed spec"
    depends_on:
      - T1
      - T14
    addresses:
      - FL-12
      - UX-11
    goal_behavior: |
      1. FL-12: Add transitions from deferred state in workflow state engine:
         - retry_worker: re-dispatch to worker
         - retry_verifier: re-run verification only
         - foreman_accept: accept as-is (via override from T14)
         - cancel: abandon task
         Max deferred duration before auto-escalate to human decision.

      2. UX-11: cccc workflow verify --task TASK_ID --refresh-spec
         Re-reads plan.yaml to get latest verification commands instead of
         using cached task spec. Enables re-verify after plan fix.
    acceptance_criteria: |
      1. Deferred task can be retried by foreman
      2. Deferred task can be accepted via override
      3. --refresh-spec uses latest plan.yaml commands
      4. Downstream tasks unblock after deferred recovery
    claimed_paths:
      - src/cccc/daemon/foreman/workflow_orchestrator.py
      - src/cccc/daemon/foreman/assignment_deferrals.py
      - tests/test_deferred_recovery.py
