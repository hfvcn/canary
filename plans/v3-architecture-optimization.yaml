# ============================================================
# Critical Flows
# ============================================================

critical_flows:
  - id: canonical_state_transition
    description: "CLI/HTTP/IPC → WorkflowTaskOps → orchestrator → engine → ledger — 三条路径产生相同状态变更"
    entrypoints:
      - src/cccc/daemon/ops/workflow_task_ops.py
      - src/cccc/cli/workflow_cmds.py
      - src/cccc/ports/web/routes/workflow.py
      - src/cccc/daemon/ralph_ipc_handler.py
    required_verification_level: integration

  - id: prompt_assembly
    description: "workflow_guidance.md → prompt_files.py / system_prompt.py → 最终 prompt 包含完整工作流指导"
    entrypoints:
      - src/cccc/resources/workflow_guidance.md
      - src/cccc/kernel/prompt_files.py
      - src/cccc/kernel/system_prompt.py
    required_verification_level: integration

  - id: group_metadata_project_root
    description: "create_group → attach_scope → group.doc['project_root'] set → callers 读取元数据"
    entrypoints:
      - src/cccc/kernel/group.py
      - src/cccc/cli/workflow_cmds.py
    required_verification_level: integration

  - id: adapter_unification
    description: "CLI/HTTP 使用共享 helpers → daemon 请求格式一致 → 无 local fallback"
    entrypoints:
      - src/cccc/daemon/ops/adapter_helpers.py
      - src/cccc/cli/messaging_cmds.py
      - src/cccc/ports/web/routes/workflow.py
    required_verification_level: integration

  - id: worker_heartbeat_flow
    description: "worker heartbeat CLI → orchestrator.on_heartbeat → progress update → stall detection → foreman notify"
    entrypoints:
      - src/cccc/cli/workflow_cmds.py
      - src/cccc/daemon/foreman/workflow_orchestrator.py
      - src/cccc/daemon/foreman/progress_report.py
    required_verification_level: integration

  - id: contract_schema_check
    description: "plan.yaml provides/consumes schema_hint → ralph validate → W_CONTRACT_SCHEMA_MISMATCH warning"
    entrypoints:
      - src/cccc/ralph/validator.py
    required_verification_level: integration

  # 系统级 flows（Ralph 内置检查，由 E2E 覆盖）
  - id: daemon_startup
    description: "daemon 启动后所有 ops 模块可用，包括新增的 workflow_task_ops"
    entrypoints:
      - src/cccc/daemon/server.py
    required_verification_level: e2e

  - id: cli_workflow
    description: "CLI workflow 命令通过 daemon IPC 到达 canonical ops"
    entrypoints:
      - src/cccc/cli/main.py
    required_verification_level: e2e

# ============================================================
# Forbidden Flows
# ============================================================

forbidden_flows:
  - id: direct_state_mutation
    description: "CLI/HTTP/MCP 绝不可直接调用 orchestrator/engine 方法修改状态，必须通过 WorkflowTaskOps"
    required_verification_level: integration

  - id: cli_local_ledger_write
    description: "CLI send 在 daemon 不可用时绝不可 fallback 到直接写 ledger（违反单写者原则）"
    required_verification_level: integration

  - id: prompt_content_duplication
    description: "工作流指导内容绝不可在多个文件中重复，必须引用 workflow_guidance.md"
    required_verification_level: unit

