# Plan: RO-42 + RO-30 + RL-3 + RL-5 — 问题清单 v5 最终未解决项
#
# 来源：todo/问题清单-v5-ralph.md 所有未解决改进项（2026-05-03 快照）
# 工作流：findings.md § 〇 经验证的工作流程
#
# 待实施项：
#   RO-42 (P0): daemon 路径 challenge verification 缺失证据注入 → 假阳性
#   RO-30 (P2): todo/ralph-foreman-workflow.md 仍有 cccc_message_send 引用
#   RL-3:  shell 操作符验证命令被跳过无语义回退
#   RL-5:  W_INDIRECT_TEST_IMPORT 对高 import 文件警告爆炸
#
# 设计原则：
#   #2  按功能切片拆分，不按文件拆
#   #9  先跑通一条路径再扩展 — P0 > P1 > P2
#   #11 verification 必须真正跑命令
#   #13 结构校验 + 代码审查互补
#
# 关键发现（探索阶段）：
#   - RO-42: CLI 路径 (core.py:235-248) 已正确注入三类证据
#     (source_context, git_diff, verification_output)；
#     daemon 路径 (ralph_service.py:656-683) 完全未注入，且 challenge
#     模式 (ralph_service.py:589) 的 worker 结果也未传递给 agent。
#   - RO-30: 三个 stub 方法已移除；仅 todo/ralph-foreman-workflow.md:295
#     残留一处 cccc_message_send。
#   - RL-3: filesystem_validator.py:468 对含 shell 操作符的命令直接 return，
#     无 fallback，substring 匹配会误触发。
#   - RL-5: filesystem_validator.py:187-195 每个 (task_id, source_path)
#     生成一条 hint，无折叠。
#
# Codex 审查反馈（2026-05-03，verdict: needs-attention）：
#   M1: T1 challenge 路径需给 _verify_completion_with_agent() 增加
#       verification_output 可选参数，challenge 复用 worker_result 时
#       必须转为 CLI 格式 {"status":"passed","checks":[...]}
#   M2: T2 拆分必须做引号外顶层扫描，python -c "...;..." 不能被切碎
#   M3: T-int 的 && 命令在 T2 后会被拆分检查，改为分开两条 command
#   S1: T2/T3 都 claim filesystem_validator.py，Ralph 已自动串行化
#   S2: T4 验证命令改用 encoding="utf-8" 显式指定编码
