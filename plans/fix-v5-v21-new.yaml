# Plan: RO-51 ~ RO-54, RL-11 — v21 新发现问题修复
#
# 来源：todo/问题清单-v5-ralph.md § 一-A2 (v21 新发现) + § 一-E (RL-11)
# 工作流：findings.md § 〇 经验证的工作流程
# Codex 审查：2026-05-07，6 项反馈均已纳入
#
# Codex 审查修正：
#   - T2: degraded fallback 必须返回 _parse_agent_verification_payload() 兼容
#     的结构 {outcome, reason, checks}，而非 {passed, summary}。
#     claimed_paths 需补充 ralph_service.py（消费端）。
#   - T3: "以 set 开头则跳过" 改为 "已含 pipefail 则跳过"。
#   - T4: 删除 auto_dispatch_all/default_worker 新字段（无现有承载层）。
#     补充 ralph_ipc_handler.py 到 claimed_paths（auto_process 透传缺失）。
#   - T5: 当前代码已正确处理 suppress + stamp。T5 改为"补回归测试验证现有
#     行为正确"，不做新实现。
#   - T1: forbidden_flow 缩小到 "ralph_service + workflow_monitor 两个调用点"。
#     验证命令补跑现有 test_claimed_paths_overlap.py。
#
# 设计原则：
#   - #2  按功能切片拆分，不按文件拆
#   - #9  先跑通一条路径再扩展 — P1 > P2
#   - #11 verification 必须真正跑命令
#   - #13 结构校验 + 代码审查互补
#
# 根因分析：
#   RO-51: _build_scope_warnings() 和 workflow_monitor 的 scope 检查使用
#     task_ref.claimed_paths 时未调用 normalize_path()，导致 "backend/"
#     (带尾斜杠) 传入 paths_overlap() 后无法匹配 "backend/main.py"。
#     paths_overlap() 本身逻辑正确（前提是入参已 normalized）。
#   RO-52: _review_with_gemini() 对 GeminiResponseError 无 retry，
#     verify_task_completion() 同理。caller 直接 fail 整个任务。
#     消费端 (ralph_service.py:737, core.py:186) 期望返回
#     {outcome, reason, checks} 结构。
#   RO-53: _run_verification_check() 使用 bash -c 执行含管道的命令但
#     未设置 pipefail，导致 pytest|tail 中 pytest 失败被 tail 的 exit 0 掩盖。
#   RO-54: _resuggest_ready_tasks() 已实现 auto_dispatch 路径，但仅当
#     workflow_data["auto_dispatch"]=True 且 task 在 assignment_map 中才
#     自动分发。当 auto_dispatch=True 但 task 不在 map 中，应 fallback 到
#     process_batch_suggestion。同时 ralph_ipc_handler.py 提交链路未传
#     auto_process 到 workflow_data。
#   RL-11: cli.py:412-419 已有 suppress + stamp 处理。需补回归测试确认
#     正确性并防止将来退化。
#
# 批次预期：
#   Batch 1: T1, T2, T3, T4, T5  — 独立修复（无互相依赖）
#   Batch 2: T-int                — 集成验证（依赖全部修复）

schema_version: "1.0.0"

required_issues:
  - "RO-51"
  - "RO-52"
  - "RO-53"
  - "RO-54"
  - "RL-11"

semantic_mode: "off"
auto_infer: false

suppress_codes:
  - E_CRITICAL_ENTRYPOINT_UNOWNED
  - E_CRITICAL_FLOW_UNCOVERED
  - E_CRITICAL_FLOW_ENTRYPOINT_UNOWNED
  - E_AGENT_REVIEW_FAILED
  - W_AGENT_REVIEW_SKIPPED
  - W_UNCLAIMED_TEST_FOR_SOURCE
  - W_TEST_COVERAGE_GAP
  - W_VERIFICATION_TARGET_MISSING
  - W_VERIFICATION_NO_CHECKS
  - W_VERIFICATION_COMPLEX_SHELL_SKIPPED
  - W_CROSS_BOUNDARY_WITHOUT_GLUE
  - W_NO_FAILURE_PATH
  - W_PLAN_SCOPE_UNUSED
  - W_VERIFICATION_BEHAVIOR_MISMATCH

critical_entrypoints:
  - src/cccc/daemon/foreman/ralph_service.py
  - src/cccc/daemon/foreman/workflow_orchestrator.py
  - src/cccc/daemon/foreman/workflow_monitor.py
  - src/cccc/ralph/agent.py
  - src/cccc/ralph/cli.py
  - src/cccc/kernel/claimed_paths.py

critical_flows:
  - id: scope_check_directory_overlap
    description: >
      _build_scope_warnings() 在 ralph_service.py 和 detect_scope_violation()
      在 workflow_monitor.py 必须 normalize claimed_paths 和 changed_files
      后再调用 paths_overlap()，确保 "backend/" 匹配 "backend/main.py"。
    entrypoints:
      - src/cccc/daemon/foreman/ralph_service.py
      - src/cccc/daemon/foreman/workflow_monitor.py
    required_verification_level: unit

  - id: gemini_json_retry_fallback
    description: >
      当 Gemini API 返回无效 JSON 时，agent.py 应 retry 1 次。
      连续失败后 graceful degrade：validate 上下文 raise（由 cli.py 降级），
      verification 上下文返回 {outcome: "passed", reason: "...", checks: [],
      degraded: true}。
    entrypoints:
      - src/cccc/ralph/agent.py
    required_verification_level: unit

  - id: pipefail_verification_commands
    description: >
      _run_verification_check() 对含管道的命令设置 pipefail，确保
      上游命令失败不被下游管道命令的 exit 0 掩盖。
    entrypoints:
      - src/cccc/daemon/foreman/ralph_service.py
    required_verification_level: unit

  - id: dag_gate_auto_dispatch_downstream
    description: >
      当 DAG 门控解锁下游任务且 auto_dispatch=True 时，未映射的 task
      应 fallback 到 process_batch_suggestion 自动分发，而非仅通知 Foreman。
      同时确保 auto_process 从 IPC 提交链路正确透传到 workflow_data。
    entrypoints:
      - src/cccc/daemon/foreman/workflow_orchestrator.py
    required_verification_level: unit

forbidden_flows:
  - id: no_unnormalized_scope_check
    description: >
      _build_scope_warnings() 和 detect_scope_violation() 不得将未经
      normalize_path() 处理的 claimed_paths 或 changed_files 传入
      paths_overlap()。
    test_created_by:
      - T1
    required_verification_level: unit

tasks:
  # ---------------------------------------------------------------
  # T1: RO-51 — 目录型 claimed_paths scope 检查修复
  # ---------------------------------------------------------------
  - id: T1
    title: "Fix scope check to normalize paths before overlap comparison"
    type: backend
    role: leaf
    addresses:
      - "RO-51"
    depends_on: []
    claimed_paths:
      - src/cccc/daemon/foreman/ralph_service.py
      - src/cccc/daemon/foreman/workflow_monitor.py
      - tests/test_scope_check_directory.py
    goal_behavior: |
      1. _build_scope_warnings() 在 ralph_service.py:763 从 task_ref.claimed_paths
         取到的 claimed 列表必须经过 normalize_path() 处理后再传入 _paths_overlap()。
         同样，changed_files 中的每个路径也需 normalize_path()。
      2. workflow_monitor.py:214 的 detect_scope_violation() 同理：
         claimed_paths 和 changed_files 都需先 normalize。
      3. 修复后，claimed_paths=["backend/", "requirements.txt"] + changed_files
         =["backend/main.py"] 不再产生 W_WORKER_EXCEEDED_SCOPE。
      4. 新建 tests/test_scope_check_directory.py 包含：
         - 正向测试：目录型 claimed_paths 的子文件不报 scope 违规
         - 负向测试：确认未 normalize 时会产生 false positive（forbidden flow 覆盖）
         - 回归测试：真正超出 scope 的文件仍被正确检测
    acceptance_criteria: |
      - _build_scope_warnings(["backend/main.py"], task_with_claimed=["backend/"]) returns []
      - _build_scope_warnings(["other/file.py"], task_with_claimed=["backend/"]) returns non-empty
      - workflow_monitor scope check 对 "backend/" + "backend/main.py" 不产生 alert
      - 现有 tests/test_claimed_paths_overlap.py 无回归
    verification:
      level: unit
      command: "python -m pytest tests/test_scope_check_directory.py tests/test_claimed_paths_overlap.py -v"
      covers:
        flows:
          - scope_check_directory_overlap
    provides:
      - name: normalized_scope_check
        kind: artifact

  # ---------------------------------------------------------------
  # T2: RO-52 — Gemini challenge JSON retry + fallback
  # ---------------------------------------------------------------
  - id: T2
    title: "Add retry and graceful fallback for Gemini JSON errors"
    type: backend
    role: leaf
    addresses:
      - "RO-52"
    depends_on: []
    claimed_paths:
      - src/cccc/ralph/agent.py
      - src/cccc/daemon/foreman/ralph_service.py
      - tests/test_gemini_retry.py
    goal_behavior: |
      1. _review_with_gemini() 在 GeminiResponseError 时 retry 1 次（共 2 次尝试），
         两次间隔 2 秒。连续失败后 raise 原始异常（保持现有行为，
         由 cli.py except 捕获并降级为 W_AGENT_REVIEW_SKIPPED）。
      2. verify_task_completion() 同样在 GeminiResponseError 时 retry 1 次。
         连续失败后返回与 _parse_agent_verification_payload() 兼容的降级结构：
         {"outcome": "passed", "reason": "Challenge skipped: Gemini unavailable
         after retry", "checks": [], "degraded": true}。
      3. ralph_service.py 消费端 (line ~737) 读取 outcome/reason 时须兼容
         degraded=true：当 degraded 为 True 时向 Foreman 发送 warning 通知而非
         直接视为 passed。
      4. retry 期间记录 log.warning 信息。
    acceptance_criteria: |
      - 第一次 GeminiResponseError 触发 retry
      - 第二次成功时正常返回结果
      - 两次都失败时：review 上下文 raise，verification 返回 degraded 结构
      - degraded 结构包含 outcome="passed"、reason 非空、checks=[]
      - ralph_service.py 消费 degraded=true 时添加 warning 而非静默通过
      - retry 间隔 ~2s
    verification:
      level: unit
      command: "python -m pytest tests/test_gemini_retry.py -v"
      covers:
        flows:
          - gemini_json_retry_fallback

  # ---------------------------------------------------------------
  # T3: RO-53 — 验证命令管道 exit code 修复
  # ---------------------------------------------------------------
  - id: T3
    title: "Prepend pipefail to piped verification commands"
    type: backend
    role: leaf
    addresses:
      - "RO-53"
    depends_on: []
    claimed_paths:
      - src/cccc/daemon/foreman/ralph_service.py
      - tests/test_pipefail_verification.py
    goal_behavior: |
      1. _run_verification_check() 在 ralph_service.py:984-986 中，当 use_shell=True
         时，将命令改为 ["bash", "-c", f"set -o pipefail; {command}"]。
      2. 这确保 `pytest tests/ | tail -40` 中 pytest 的非零 exit code 不被
         tail 的 exit 0 掩盖。
      3. 仅当命令中已显式包含 "pipefail" 时跳过注入（避免重复设置）。
         "set -e; pytest | tail" 这种不含 pipefail 的命令仍需注入。
    acceptance_criteria: |
      - `false | true` 通过 _run_verification_check 返回 outcome="failed"
      - `true | true` 返回 outcome="passed"
      - 已含 "pipefail" 的命令不被 double-prepend
      - "set -e; false | true" 仍注入 pipefail 后返回 outcome="failed"
      - 现有不含管道的命令行为无变化（use_shell=False 路径不受影响）
    verification:
      level: unit
      command: "python -m pytest tests/test_pipefail_verification.py -v"
      covers:
        flows:
          - pipefail_verification_commands

  # ---------------------------------------------------------------
  # T4: RO-54 — DAG 门控解锁后自动分发下游任务
  # ---------------------------------------------------------------
  - id: T4
    title: "Auto-dispatch downstream tasks when DAG gate unlocks"
    type: backend
    role: leaf
    addresses:
      - "RO-54"
    depends_on: []
    claimed_paths:
      - src/cccc/daemon/foreman/workflow_orchestrator.py
      - src/cccc/daemon/ralph_ipc_handler.py
      - tests/test_dag_auto_dispatch.py
    goal_behavior: |
      1. 当 auto_dispatch=True 且 downstream task 不在 assignment_map 中时，
         _auto_dispatch_ready_tasks() 中 skipped_ids 分支不再仅 notify Foreman，
         而是 fallback 到 process_batch_suggestion（与 auto_process 逻辑相同）。
      2. ralph_ipc_handler.py 的 workflow submit 链路须将 auto_process=True
         透传到 orchestrator._active_workflows[workflow_id]，确保运行时
         _resuggest_ready_tasks() 能读到此设置。
      3. 具体修改：
         a. _auto_dispatch_ready_tasks(): 当 skipped_ids 非空时，构建包含
            skipped tasks 的 suggestion 并调用 process_batch_suggestion()。
         b. ralph_ipc_handler.py: register_and_suggest() 或 ensure_active_workflow()
            的调用方须从 IPC payload 提取 auto_process 并传入。
    acceptance_criteria: |
      - auto_dispatch=True + task in assignment_map → 自动分发（现有行为不变）
      - auto_dispatch=True + task NOT in assignment_map → 自动分发（新行为）
      - auto_dispatch=False → 仅通知 Foreman（现有行为不变）
      - IPC workflow submit 包含 auto_process 时被正确写入 workflow_data
    verification:
      level: unit
      command: "python -m pytest tests/test_dag_auto_dispatch.py -v"
      covers:
        flows:
          - dag_gate_auto_dispatch_downstream

  # ---------------------------------------------------------------
  # T5: RL-11 — Agent review failure 回归测试
  # ---------------------------------------------------------------
  - id: T5
    title: "Add regression test confirming agent review failure suppress works correctly"
    type: backend
    role: leaf
    addresses:
      - "RL-11"
    depends_on: []
    claimed_paths:
      - tests/test_agent_review_suppress.py
    goal_behavior: |
      当前代码 (cli.py:412-419) 已正确实现 suppress + stamp：
      - except 块创建 ValidationIssue，手动设置 issue_instance_id
      - 检查 issue.code in plan.suppress_codes → hints 或 warnings
      本 task 仅添加回归测试验证这个行为不退化：
      1. 测试 suppress_codes 包含 W_AGENT_REVIEW_SKIPPED 时 issue 进 hints
      2. 测试 suppress_codes 不包含时 issue 进 warnings
      3. 测试 issue_instance_id 被正确设置（非 None、非空）
    acceptance_criteria: |
      - plan.suppress_codes 包含 W_AGENT_REVIEW_SKIPPED 时 issue 不在 report.warnings
      - plan.suppress_codes 不包含 W_AGENT_REVIEW_SKIPPED 时 issue 在 report.warnings
      - issue.issue_instance_id 始终非空
    verification:
      level: unit
      command: "python -m pytest tests/test_agent_review_suppress.py -v"
      covers:
        tasks:
          - T5

  # ---------------------------------------------------------------
  # T-int: 集成验证
  # ---------------------------------------------------------------
  - id: T-int
    title: "Integration verification for all v21 fixes"
    type: backend
    role: integration
    addresses:
      - "RO-51"
      - "RO-52"
      - "RO-53"
      - "RO-54"
      - "RL-11"
    depends_on:
      - T1
      - T2
      - T3
      - T4
      - T5
    claimed_paths:
      - tests/test_v21_integration.py
    goal_behavior: |
      集成测试验证所有 5 个修复协同工作：
      1. Scope 检查 + 目录型路径不产生误报
      2. Gemini retry 机制在模拟失败后正确降级
      3. 含管道的验证命令正确传播 exit code
      4. DAG 门控解锁后下游任务自动分发（含 IPC 透传）
      5. Agent review 异常正确被 suppress
    acceptance_criteria: |
      - 全量 pytest 无新增失败
      - ralph validate 本计划 0 errors
    verification:
      level: integration
      command: "python -m pytest tests/test_v21_integration.py -v && python -m pytest tests/ -x --timeout=60 -q"
      covers:
        tasks:
          - T1
          - T2
          - T3
          - T4
          - T5
        flows:
          - scope_check_directory_overlap
          - gemini_json_retry_fallback
          - pipefail_verification_commands
          - dag_gate_auto_dispatch_downstream
        forbidden_flows:
          - no_unnormalized_scope_check
