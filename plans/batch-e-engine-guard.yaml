        kind: module
        schema_hint: "Engine pre-transition hooks + alert buffer + MonitorConfig persistence + TransitionRejected flow"
    addresses: ["ARCH-12", "ARCH-9"]

  # === T3: FIX-16 — Engine 级联 block ===

  - id: T3
    title: "Engine block_task 支持 cascade，返回结构化结果"
    role: leaf
    claimed_paths:
      - "src/cccc/kernel/workflow_state_engine.py"
    awareness_paths:
      - "src/cccc/kernel/workflow_state_types.py"
      - "src/cccc/daemon/foreman/workflow_orchestrator.py"
    depends_on: ["T2"]
    goal_behavior: >
      **新增内部方法：**
      1. _build_reverse_deps(self) -> Dict[str, List[str]]：
         - 遍历 self._tasks，对每个 task_state：
           for dep_id in task_state.task.depends_on:
               reverse[dep_id].append(task_state.task.id)
         - 返回 {upstream_task_id: [downstream_task_id, ...]}

      **修改 block_task 签名和实现（line 195-208）：**
      2. 新签名：block_task(self, task_id: str, reason: str, cascade: bool = False) -> List[Dict[str, Any]]
         - 原有逻辑不变（终态保护、幂等、_append、状态更新）
         - 新增：如果 cascade=True，在 block 成功后调用 _cascade_block_downstream
         - 返回值：结构化 cascaded 列表，每项为：
           {"task_id": str, "previous_status": str, "blocked_reason": str}
           （Codex C2: 包含 previous_status 以便 orchestrator 判断哪些原来在 RUNNING）
         - cascade=False 时返回空列表

      3. _cascade_block_downstream(self, blocked_task_id: str, reason: str) -> List[Dict[str, Any]]：
         - 构建反向依赖图 reverse_deps = self._build_reverse_deps()
         - visited: set[str] = {blocked_task_id}
         - cascaded: List[Dict[str, Any]] = []
         - BFS 遍历下游：
           queue = list(reverse_deps.get(blocked_task_id, []))
           while queue:
               tid = queue.pop(0)
               if tid in visited: continue
               visited.add(tid)
               prev = self._tasks.get(tid)
               if prev is None: continue
               # 终态保护：COMPLETED/ARCHIVED 不可覆盖
               if prev.status in {COMPLETED, ARCHIVED}: continue
               # 幂等：已 BLOCKED 跳过
               if prev.status == BLOCKED: continue
               previous_status = prev.status.value  # 记录 block 前状态
               cascade_reason = f"upstream {blocked_task_id} blocked: {reason}"
               self._append(kind=KIND_TASK_BLOCKED, data={
                   "workflow_id": prev.workflow_id, "task_id": tid, "reason": cascade_reason
               })
               self._tasks[tid] = replace(prev, status=BLOCKED, blocked_reason=cascade_reason)
               cascaded.append({
                   "task_id": tid,
                   "previous_status": previous_status,
                   "blocked_reason": cascade_reason,
               })
               # 继续向下游递归
               queue.extend(reverse_deps.get(tid, []))
         - 返回 cascaded

      **注意事项：**
      - _cascade_block_downstream 不调用 _run_pre_transition_hooks（级联是 engine 内部操作）
      - 级联中对每个 task 独立写 ledger 事件（与 Batch D 的 orchestrator cascade 一致）
      - previous_status 在 block 前捕获，可靠标识哪些 task 原来在 RUNNING
    acceptance_criteria: >
      block_task(cascade=False) 行为与之前完全一致，返回空列表；
      block_task(cascade=True) 返回 List[Dict] 且每项含 task_id、previous_status、blocked_reason；
      菱形 DAG 中 fan-in 节点只 block 一次（visited 去重）；
      COMPLETED/ARCHIVED 下游不被覆盖；
      已 BLOCKED 下游被跳过（幂等）；
      previous_status 正确反映 block 前状态（特别是 RUNNING）；
      ledger 中每个被级联 block 的 task 有且仅有一条 task_blocked 事件。
    verification:
      level: unit
      command: "python -m pytest tests/test_workflow_state.py -q --tb=short -k 'cascade or reverse_dep'"
      covers:
        tasks: ["T3"]
    consumes:
      - name: engine_hook_mechanism
        from: T2
    provides:
      - name: engine_cascade_block
        kind: module
        schema_hint: "block_task(cascade=True) returns structured results with previous_status"
    addresses: ["FIX-16"]

  # === T4: ARCH-12 + ARCH-9 — 不变量 pre-transition hooks 实现 ===

  - id: T4
    title: "三个不变量的 pre-transition hook 实现（mode-aware，不写 ledger）"
    role: leaf
    claimed_paths:
      - "src/cccc/daemon/foreman/workflow_monitor.py"
    awareness_paths:
      - "src/cccc/kernel/workflow_state_types.py"
      - "src/cccc/kernel/workflow_state_engine.py"
    depends_on: ["T2"]
    goal_behavior: >
      在 workflow_monitor.py 末尾新增以下工厂函数。

      **设计原则（Codex C3）：**
      - hooks 不直接写 ledger
      - BLOCK 模式: raise TransitionRejected（engine 写 rejection 事件）
      - OBSERVE 模式: 调用 engine.report_hook_alert(alert_data)（engine 在 transition 后 flush）
      - hooks 只做判定，所有 ledger 写入由 engine 控制

      **Hook 工厂：**
      1. create_completer_mismatch_hook() -> PreTransitionHook：
         ```python
         def hook(kind: str, data: dict, engine) -> None:
             if kind != KIND_TASK_REPORTED_COMPLETED:
                 return
             task_id = str(data.get("task_id") or "")
             task_state = engine.get_task(task_id)
             if not task_state:
                 return
             completing_agent = str((data.get("evidence") or {}).get("agent_id") or "")
             assigned_agent = task_state.agent_id
             alert = check_completer_mismatch(task_id, assigned_agent, completing_agent)
             if not alert:
                 return
             mode = engine.get_monitor_config().completer_mismatch
             if mode == MonitorMode.BLOCK:
                 raise TransitionRejected(
                     alert_type=alert.alert_type,
                     message=alert.message,
                     evidence=alert.evidence,
                 )
             # OBSERVE: report to engine buffer, don't write ledger
             engine.report_hook_alert({
                 "alert_type": alert.alert_type,
                 "severity": alert.severity,
                 "task_id": alert.task_id,
                 "message": alert.message,
                 "evidence": alert.evidence,
                 "mode": mode.value,
             })
         return hook
         ```

      2. create_file_overstepping_hook() -> PreTransitionHook：
         ```python
         def hook(kind: str, data: dict, engine) -> None:
             if kind != KIND_TASK_REPORTED_COMPLETED:
                 return
             task_id = str(data.get("task_id") or "")
             task_state = engine.get_task(task_id)
             if not task_state:
                 return
             changed_files = list((data.get("evidence") or {}).get("changed_files") or [])
             claimed_paths = list(task_state.task.claimed_paths or [])
             alert = check_file_overstepping(task_id, changed_files, claimed_paths)
             if not alert:
                 return
             mode = engine.get_monitor_config().file_overstepping
             if mode == MonitorMode.BLOCK:
                 raise TransitionRejected(
                     alert_type=alert.alert_type,
                     message=alert.message,
                     evidence=alert.evidence,
                 )
             engine.report_hook_alert({
                 "alert_type": alert.alert_type,
                 "severity": alert.severity,
                 "task_id": alert.task_id,
                 "message": alert.message,
                 "evidence": alert.evidence,
                 "mode": mode.value,
             })
         return hook
         ```

      3. create_unauthorized_subagent_hook(known_actors_fn: Callable[[], Set[str]]) -> PreTransitionHook：
         （Codex C1: 参数名改为 known_actors_fn，绑定持久化 actor registry 而非影子映射）
         ```python
         def hook(kind: str, data: dict, engine) -> None:
             if kind != KIND_TASK_STARTED:
                 return
             agent_id = str(data.get("agent_id") or "")
             known = known_actors_fn()
             alert = check_unauthorized_subagent(agent_id, known)
             if not alert:
                 return
             mode = engine.get_monitor_config().unauthorized_subagent
             if mode == MonitorMode.BLOCK:
                 raise TransitionRejected(
                     alert_type=alert.alert_type,
                     message=alert.message,
                     evidence=alert.evidence,
                 )
             engine.report_hook_alert({
                 "alert_type": alert.alert_type,
                 "severity": alert.severity,
                 "task_id": alert.task_id,
                 "message": alert.message,
                 "evidence": alert.evidence,
                 "mode": mode.value,
             })
         return hook
         ```

      **需要的 import：**
      - from cccc.kernel.workflow_state_types import (TransitionRejected, PreTransitionHook,
        KIND_TASK_STARTED, KIND_TASK_REPORTED_COMPLETED)
    acceptance_criteria: >
      create_completer_mismatch_hook 在 BLOCK 模式 + mismatch 时 raise TransitionRejected；
      create_completer_mismatch_hook 在 OBSERVE 模式 + mismatch 时调用 engine.report_hook_alert + return；
      hooks 不直接调用 append_event 或写 ledger；
      create_file_overstepping_hook 同理对 changed_files 检查；
      create_unauthorized_subagent_hook 通过 known_actors_fn 获取持久化 actor 列表；
      所有 hook 对不相关的 kind 直接 return（零开销）。
    verification:
      level: unit
      command: "python -m pytest tests/test_workflow_state.py tests/test_worker_collaboration_integration.py -q --tb=short -k 'hook'"
      covers:
        tasks: ["T4"]
    consumes:
      - name: engine_hook_mechanism
        from: T2
    provides:
      - name: invariant_hooks
        kind: module
        schema_hint: "Three mode-aware pre-transition hook factories, no direct ledger writes"
    addresses: ["ARCH-12", "ARCH-9"]

  # === T5: Orchestrator 集成 ===

