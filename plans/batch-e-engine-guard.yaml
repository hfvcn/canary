      - 删除 self._cascade_block() 调用
      - 构建 result dict 时 cascaded_task_ids = [e["task_id"] for e in cascaded]
      （Codex C2: previous_status 直接从 engine 结构化结果获取，无需 re-read engine state）

      **3. 标记 _cascade_block deprecated：**
      - 在方法开头加 logger.warning("_cascade_block is deprecated, use engine.block_task(cascade=True)")
      - 保留原有实现作为 fallback 直到 Batch F 清理

      **4. 处理 TransitionRejected（apply_task_event，line 1540-1708）：**
      在 engine.report_worker_started 和 engine.report_worker_completion 调用处
      包裹 try/except TransitionRejected：
      ```python
      try:
          self.engine.report_worker_completion(task_id, evidence_dict, attempt_id=event_attempt_id)
      except TransitionRejected as exc:
          logger.warning("Transition rejected: %s — %s", exc.alert_type, exc.message)
          result["accepted"] = False
          result["reason"] = f"transition_rejected:{exc.alert_type}"
          result["rejection_message"] = exc.message
          # 通知 Foreman
          self._notify_foreman_task_update(
              task_id=task_id,
              new_status="rejected",
              summary=f"Engine rejected transition: {exc.message}",
          )
          return result
      ```
      对 report_worker_started 同理处理。

      **5. 保留 on_task_completed 中的 WF-6 monitor checks（Codex C4）：**
      不删除 on_task_completed 中的 check_completer_mismatch / check_file_overstepping /
      check_unauthorized_subagent 调用及 record_verification_warning。
      原因：
      a. 这些 checks 是 WF-6 的验证证据——删除会导致现有测试回归
      b. pre-transition hooks 先于 on_task_completed 执行，在 BLOCK 模式下已拦截，
         on_task_completed 不会被到达
      c. 在 OBSERVE 模式下，hooks 缓存 alert + engine flush violation 后，
         on_task_completed 的 check 会重复记录——这是可接受的冗余，
         不如强行删除导致 WF-6 回归。Batch F 中统一清理。
      添加注释：# TODO: Batch F — deduplicate with engine pre-transition hooks
