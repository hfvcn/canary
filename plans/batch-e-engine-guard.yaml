         - transition 仍然成功（hook error 不阻塞）
         - （Codex C5: 验证 unexpected exception 处理路径）

      **模式切换验证：**
      7. test_monitor_mode_persists_via_ledger：
         - set_monitor_mode("completer_mismatch", MonitorMode.BLOCK)
         - 创建新 engine 对同一 group
         - replay_from_ledger
         - 断言 get_monitor_config().completer_mismatch == MonitorMode.BLOCK

      8. test_mode_switch_from_observe_to_block：
         - 初始 OBSERVE → mismatch 允许
         - 切到 BLOCK → mismatch 拒绝
         - 同一 engine 实例内两种行为

      **Engine cascade 验证：**
      9. test_engine_cascade_linear_dag：
         - DAG: T-A → T-B → T-C
         - block_task("T-A", "reason", cascade=True)
         - 断言 T-B, T-C 均 BLOCKED
         - 返回的 cascaded 列表长度 = 2

      10. test_engine_cascade_diamond_dag_dedup：
          - 菱形 DAG: T-A → T-B, T-A → T-C, T-B → T-D, T-C → T-D
          - block_task("T-A", ..., cascade=True)
          - 断言 T-B, T-C, T-D 各 BLOCKED 一次
          - ledger 中恰好 4 条 KIND_TASK_BLOCKED（T-A + T-B + T-C + T-D）

      11. test_engine_cascade_skips_completed：
