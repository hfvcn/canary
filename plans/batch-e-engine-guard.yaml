  - id: T2
    title: "Engine pre-transition hook 机制 + 监控模式持久化 + alert 缓存"
    role: leaf
    claimed_paths:
      - "src/cccc/kernel/workflow_state_engine.py"
    awareness_paths:
      - "src/cccc/kernel/workflow_state_types.py"
      - "src/cccc/daemon/foreman/workflow_monitor.py"
    depends_on: ["T1"]
    goal_behavior: >
      **新增 Engine 属性（__init__，line 17-20）：**
      1. self._pre_transition_hooks: List[PreTransitionHook] = []
      2. self._monitor_config: MonitorConfig = get_default_config()
         （import MonitorConfig, get_default_config, MonitorMode from workflow_monitor）
      3. self._pending_hook_alerts: List[Dict[str, Any]] = []
         （Codex C3: hooks 不直接写 ledger，通过此缓存，engine 统一 flush）

      **新增公开方法：**
      4. register_pre_transition_hook(self, hook: PreTransitionHook) -> None：
         - 追加到 self._pre_transition_hooks
      5. get_monitor_config(self) -> MonitorConfig：
         - 返回 self._monitor_config
      6. set_monitor_mode(self, invariant_id: str, mode: MonitorMode) -> None：
         - 校验 invariant_id 是有效的 MonitorConfig 字段名
           （"silent_agent", "path_deviation", "unauthorized_subagent",
            "completer_mismatch", "file_overstepping"）
         - 校验 mode 是有效的 MonitorMode 值
         - 更新 self._monitor_config 对应字段
         - 写 ledger 事件：self._append(kind=KIND_MONITOR_MODE_CHANGED,
           data={"invariant_id": invariant_id, "mode": mode.value})
      7. report_hook_alert(self, alert_data: Dict[str, Any]) -> None：
         - 将 alert_data 追加到 self._pending_hook_alerts
         - （Codex C3: hooks 调用此方法报告 observe-mode violations，不直接写 ledger）

      **新增内部方法：**
      8. _run_pre_transition_hooks(self, kind: str, data: Dict[str, Any]) -> None：
         - 清空 self._pending_hook_alerts
         - 遍历 self._pre_transition_hooks，逐个调用 hook(kind, data, self)
         - 如果 hook raise TransitionRejected：
           a. 记录 rejection 事件到 ledger：
              self._append(kind=KIND_TRANSITION_REJECTED, data={
                "original_kind": kind,
                "alert_type": exc.alert_type,
                "message": exc.message,
                "evidence": exc.evidence,
                "task_id": data.get("task_id", ""),
              })
           b. re-raise TransitionRejected（让调用方处理）
         - 如果 hook 抛出其他异常（非 TransitionRejected）：
           logger.warning("Pre-transition hook error: %s", exc, exc_info=True)
           （Codex C5: warning 而非 debug，提高可观测性。不阻塞转换但可被监控发现）

      9. _flush_pending_hook_alerts(self) -> None：
         - 遍历 self._pending_hook_alerts，对每个 alert_data：
           try:
               scope_key = str(self._group.doc.get("active_scope_key") or "").strip()
               from cccc.kernel.ledger import append_event
               from cccc.contracts.v1.event import MonitorViolationData
               append_event(self._group.ledger_path, kind=KIND_MONITOR_VIOLATION,
                 group_id=self._group.group_id, scope_key=scope_key, by="monitor",
                 data=MonitorViolationData(
                   alert_type=alert_data["alert_type"],
                   severity=alert_data.get("severity", "warning"),
                   task_id=alert_data.get("task_id", ""),
                   message=alert_data.get("message", ""),
                   evidence=alert_data.get("evidence", {}),
                   monitor_mode=alert_data.get("mode", "observe"),
                   invariant_id=alert_data.get("alert_type", ""),
                 ).model_dump())
           except Exception:
               logger.debug("Failed to flush hook alert", exc_info=True)
         - 清空 self._pending_hook_alerts
         （Codex C3: violation 事件在 transition 事件之后写入，保证 ledger 顺序正确）

      **修改现有方法——插入 hook 调用：**
      10. report_worker_started（line 81-91）：
          在 _append 调用之前插入：
          data_dict = {"workflow_id": prev.workflow_id, "task_id": tid, "agent_id": aid, "started_at": now}
          self._run_pre_transition_hooks(KIND_TASK_STARTED, data_dict)
          在 _append 和状态更新之后插入：
          self._flush_pending_hook_alerts()
      11. report_worker_completion（line 114-139）：
          在 _append 调用之前插入：
          data_dict = {"workflow_id": prev.workflow_id, "task_id": tid,
                        "idempotency_key": idem, "evidence": ev}
          self._run_pre_transition_hooks(KIND_TASK_REPORTED_COMPLETED, data_dict)
          在 _append 和状态更新之后插入：
          self._flush_pending_hook_alerts()

      **Replay handler：**
      12. _apply_monitor_mode_changed(self, data: Dict[str, Any]) -> None：
          - 读取 invariant_id 和 mode
          - 用 MonitorMode(mode) 构建枚举
          - 通过 setattr(self._monitor_config, invariant_id, enum_val) 更新
      13. _apply_transition_rejected(self, data: Dict[str, Any]) -> None：
          - 空实现（纯审计事件，不影响状态）
      14. 在 _apply_event() 的 handlers dict（line 273-292）中注册：
          - KIND_MONITOR_MODE_CHANGED → self._apply_monitor_mode_changed
          - KIND_TRANSITION_REJECTED → self._apply_transition_rejected
    acceptance_criteria: >
      register_pre_transition_hook 成功注册 hook；
      _run_pre_transition_hooks 在 report_worker_started 和 report_worker_completion 的 _append 之前被调用；
      hook raise TransitionRejected 时：rejection 事件写入 ledger、原始状态转换不写入 ledger、
      TransitionRejected 被 re-raise；
      hook 报告 observe-mode alert 时：transition 事件先写入，violation 事件后写入（顺序正确）；
      hook 抛出 unexpected 异常时：log.warning 记录，transition 照常进行；
      set_monitor_mode 更新 config 并写 ledger 事件；
      replay_from_ledger 后 monitor config 恢复正确模式；
      无 hook 注册时，现有行为完全不变。
    verification:
      level: unit
      command: "python -m pytest tests/test_workflow_state.py -q --tb=short -k 'hook or monitor_mode or transition_rejected'"
      covers:
        tasks: ["T1", "T2"]
    consumes:
      - name: transition_rejected_type
        from: T1
    provides:
