    depends_on: ["T5"]
    goal_behavior: >
      新建 tests/e2e/test_batch_e_engine_guard.py：

      **Hook 基础验证：**
      1. test_hook_blocks_completer_mismatch_in_block_mode：
         - 创建 engine + 注册 completer_mismatch hook
         - set_monitor_mode("completer_mismatch", MonitorMode.BLOCK)
         - 注册 task → register_batch → approve → start(agent_A) → RUNNING
         - 尝试 report_worker_completion(evidence={"agent_id": "agent_B", ...})
         - 断言 raise TransitionRejected
         - 断言 task 状态仍为 RUNNING（未被改变）
         - 断言 ledger 中有 KIND_TRANSITION_REJECTED 事件
         - 断言 ledger 中无 KIND_TASK_REPORTED_COMPLETED 事件

      2. test_hook_allows_completer_mismatch_in_observe_mode：
         - 同上，但 mode=OBSERVE
         - report_worker_completion 成功，task 状态变为 VERIFYING
         - 断言 ledger 中有 KIND_MONITOR_VIOLATION（engine flush 的 observe violation）
         - 断言 KIND_MONITOR_VIOLATION 在 KIND_TASK_REPORTED_COMPLETED 之后
           （Codex C3: 验证 ledger 事件顺序正确）

      3. test_hook_allows_matching_completer：
         - mode=BLOCK
         - agent_A start → agent_A complete
