# Batch E: 非法转换被 Engine 拦截
# 可验证结论: "非法状态变更被 Engine pre-transition hook 拒绝 + 拒绝记录在 ledger + block 级联从 engine 层触发"
#
# 对应问题清单: ARCH-12 (P1) + ARCH-9 observe→block (P0) + FIX-16 (P1)
# Finding 对照: #1(编译通过≠功能可用) #16(负向不变量) #17(失败必须暴露)
#
# 依赖: Batch D 已完成（ARCH-7/8/11, 6 tasks, 117 tests）
# 验证方法: 非法状态变更被 Engine 拒绝 + ledger 记录拒绝事件 + cascade 从 engine 层面触发
#
# 设计决策:
# 1. Pre-transition hooks 在 engine._append() 之前执行，拒绝时不产生任何副作用
# 2. 三个 invariant 适合做 pre-transition hook: unauthorized_subagent, completer_mismatch, file_overstepping
#    （silent_agent 是 timer-based 不是 transition；path_deviation 是事件关键词匹配非状态转换）
# 3. 监控模式存储在 engine 中，通过 ledger 事件持久化，replay 可恢复
# 4. cascade_block 下沉到 engine（engine 有 _tasks + depends_on 可建反向依赖图）
#    engine 只做纯状态级联，通知/shadow 仍由 orchestrator 处理
# 5. evidence dict 已含 agent_id + changed_files（apply_task_event line 1607-1612），hooks 可直接读取
#
# Codex 审查后修正（2026-04-06）：
# C1: unauthorized_subagent hook 改用 group 持久化 actor registry，不依赖 _task_to_agent 影子映射
# C2: cascade 返回结构化 List[Dict] 含 previous_status，orchestrator 可据此发取消通知
# C3: hook 不直接写 ledger；通过 engine.report_hook_alert() 缓存，engine 在 transition 后统一 flush
# C4: 保留 on_task_completed 中 WF-6 verification_warning 行为，不删除现有 monitor checks
# C5: hook unexpected exception 在 BLOCK 模式 invariant 下 log.warning（非 debug），提高可观测性

tasks:
  # === T1: ARCH-12 基础 — TransitionRejected 异常 + Hook 类型定义 ===

  - id: T1
    title: "TransitionRejected 异常 + pre-transition hook 类型 + 新事件常量"
    role: leaf
    claimed_paths:
      - "src/cccc/kernel/workflow_state_types.py"
    awareness_paths:
      - "src/cccc/daemon/foreman/workflow_monitor.py"
    depends_on: []
    goal_behavior: >
      1. 在 workflow_state_types.py 新增 TransitionRejected 异常类：
         ```python
         class TransitionRejected(Exception):
             """Engine pre-transition hook rejected a state transition."""
             def __init__(self, alert_type: str, message: str, evidence: Optional[Dict[str, Any]] = None):
                 self.alert_type = alert_type
                 self.message = message
                 self.evidence = evidence or {}
                 super().__init__(message)
         ```
      2. 新增事件常量：
         - KIND_TRANSITION_REJECTED = "workflow.transition_rejected"
         - KIND_MONITOR_MODE_CHANGED = "workflow.monitor_mode_changed"
      3. 新增类型别名（用于 engine hook 注册）：
         ```python
         from typing import Callable, TYPE_CHECKING
         if TYPE_CHECKING:
             from .workflow_state_engine import WorkflowEngine
         # Hook signature: (kind: str, data: dict, engine: WorkflowEngine) -> None
         # Raise TransitionRejected to block. Call engine.report_hook_alert() for observe.
         PreTransitionHook = Callable[[str, Dict[str, Any], "WorkflowEngine"], None]
         ```
      4. 所有新增放在文件末尾（TaskState 之后）。不修改现有类型。
    acceptance_criteria: >
      TransitionRejected 可被 import 并携带 alert_type/message/evidence；
      KIND_TRANSITION_REJECTED 和 KIND_MONITOR_MODE_CHANGED 常量存在；
      PreTransitionHook 类型可被 import 用于类型标注；
      现有 import 和测试不受影响。
    verification:
      level: unit
      command: "python -c \"from cccc.kernel.workflow_state_types import TransitionRejected, KIND_TRANSITION_REJECTED, KIND_MONITOR_MODE_CHANGED, PreTransitionHook; print('OK')\""
      covers:
