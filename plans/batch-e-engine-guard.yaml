    awareness_paths:
      - "src/cccc/kernel/workflow_state_engine.py"
      - "src/cccc/kernel/workflow_state_types.py"
      - "src/cccc/daemon/foreman/workflow_monitor.py"
      - "src/cccc/daemon/ops/workflow_task_ops.py"
    depends_on: ["T3", "T4"]
    goal_behavior: >
      **1. 注册 hooks（__init__ 或 engine 初始化后）：**
      在 self._monitor_config = get_default_config() 之后（line 187），新增：
      ```python
      from ..workflow_monitor import (
          create_completer_mismatch_hook,
          create_file_overstepping_hook,
          create_unauthorized_subagent_hook,
      )
      self.engine.register_pre_transition_hook(create_completer_mismatch_hook())
      self.engine.register_pre_transition_hook(create_file_overstepping_hook())
      # Codex C1: 使用 group 持久化 actor registry，不依赖 _task_to_agent 影子映射
      # self.group.actors 返回持久化的 actor 列表，daemon 重启后仍可用
      self.engine.register_pre_transition_hook(
