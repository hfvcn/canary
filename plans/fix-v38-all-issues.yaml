  - W_VERIFICATION_CROSS_SCOPE
  - W_VERIFICATION_TARGET_MISSING
  - W_AEGIS_FIX_NO_REPAIR_TRACK
  - W_AEGIS_COMPLEX_MISSING_BASELINE
  - W_TEST_COVERAGE_GAP
  - W_CROSS_BOUNDARY_WITHOUT_GLUE
  - W_NO_EARLY_INTEGRATION_CHECKPOINT
  - W_NO_FAILURE_PATH
