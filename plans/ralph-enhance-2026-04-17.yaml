  - id: W8d-ledger-schema-parity
    title: "#9 · Validation ledger event reconciliation (two kinds → unified schema)"
    role: leaf
    type: backend
    claimed_paths:
      - "src/cccc/ralph/cli.py"
      - "src/cccc/daemon/foreman/workflow_orchestrator.py"
      - "src/cccc/contracts/v1/event.py"
      - "src/cccc/contracts/v1/ralph_ipc.py"
      - "tests/test_ledger_schema_parity.py"
    awareness_paths:
      - "src/cccc/ralph/stats.py"
    depends_on: ["W8c-capability-manifest"]
    addresses: ["RA-ENHANCE-9"]
    goal_behavior: >
      Codex review structural tension #2 acknowledged: CLI today writes
      workflow.plan_validated (cli.py:182-195 area); orchestrator writes
      workflow.plan_validation_failed (ralph_ipc.py:53). These are NOT
      v0/v1 of the same event — they are two different kinds with
      different trigger semantics:
        - workflow.plan_validated: emitted from CLI for ANY validate run
          (pass OR fail), informational
        - workflow.plan_validation_failed: emitted from orchestrator only
          when validation blocks registration (error path)

      Reconciliation plan (Q4 still applies, but with explicit two-kind
      migration):
      (1) Keep BOTH kinds — do not alias. Rename migration target to
          "parity of SCHEMA fields within each kind", not "unify into
          one kind".
      (2) Canonical v1 field set (shared by both kinds, each carrying
          them where applicable):
            event_schema_version: 1
            valid: bool
            report_schema_version: str
            ruleset_digest: str
            errors / warnings / hints: list of {code, issue_instance_id,
              confidence, action_owner, worker_relevance, summary}
            counts: {errors, warnings, hints, semantic}
          plan_validation_failed adds `blocking_code: str` (which
          error triggered the block).
      (3) Writers: CLI single-writes v1 shape under workflow.plan_validated
          (pass path). Orchestrator single-writes v1 shape under
          workflow.plan_validation_failed (fail path). Both share the
          same renderer/serializer module.
      (4) Readers: dual-read both kinds across v0/v1 field sets; unknown
          version → log + treat as v0. Phase A only.
      (5) Emit debug ralph.schema_stats event per ledger session
          summarizing v0/v1 counts per kind (not aggregate).
      (6) Decision Q4's 90-day retirement window applies to the v0 field
          subset within each kind, NOT to the kinds themselves.
    acceptance_criteria: >
      pytest: (a) writer emits v1 schema exclusively; (b) reader accepts
      fixture v0 events (historical) AND v1 events; (c) ralph.schema_stats
      emitted with correct counts.
    verification:
      level: integration
      command: "pytest tests/test_ledger_schema_parity.py -v"
      covers:
        tasks: ["W8d-ledger-schema-parity"]
        flows: ["ledger_schema_compat"]
    provides:
