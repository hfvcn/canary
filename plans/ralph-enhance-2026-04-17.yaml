tasks:

  # ═══════════════════════════════════════════════════════════════════════
  # Wave 1 · provenance / robustness 基石
  # ═══════════════════════════════════════════════════════════════════════

  - id: W1-stub-guard
    title: "Guard: no wave verify passes on skip-only stub target"
    role: leaf
    type: backend
    claimed_paths:
      - "scripts/check_not_skip_only.py"
      - "tests/test_stub_guard.py"
    depends_on: []
    addresses: ["RA-ENHANCE-VERIFY-HARDENING"]
    goal_behavior: >
      Codex review finding #5 fix. Verification files seeded as
      @pytest.mark.skip stubs (per RVE-12 mitigation) must not be
      accepted as valid verification targets — task implementers could
      trivially make a narrow assertion and claim success while the
      production path stays untested.

      Create scripts/check_not_skip_only.py (AST-based). Codex round-2
      re-review called out that "block all-skip/zero-test" is still
      weak against "one trivial non-skip test". Guard implementation
      therefore layers three checks:

      Layer 1 — structure (blocks "all-skip / zero-test"):
        - Parse each path with ast.parse.
        - Fail (E_INTERNAL_STUB_ONLY) if every test_* function is
          decorated @pytest.mark.skip OR module-level calls pytest.skip.
        - Fail (E_INTERNAL_NO_TESTS) if no test_* functions.

      Layer 2 — assertion density (blocks "trivial non-skip test"):
        - Count ast.Assert nodes + pytest.raises/pytest.fail/pytest.xfail
          invocations across non-skipped test bodies.
        - Fail (E_INTERNAL_ZERO_ASSERTIONS) if count == 0.
        - Fail (E_INTERNAL_LOW_ASSERTIONS) if module declares >=2
          test functions but average assertions per non-skipped test < 1
          (guards against "many trivial tests to pad count").

      Layer 3 — production-path reference (blocks "test doesn't touch
      implementation"; round-3 tightened):
        - Each test module MUST import a specific submodule path
          `cccc.<submodule>` (NOT bare `import cccc`).
        - The imported symbol/alias MUST be referenced in at least one
          non-skipped test function body (not just module-top import).
        - Fail (E_INTERNAL_NO_PROD_IMPORT) if no qualifying import.
        - Fail (E_INTERNAL_UNUSED_PROD_IMPORT) if import exists but
          is never referenced in any test body.
        - This prevents the trivial bypass of `import cccc` at module
          top with nothing used (Codex round-3 finding).

      Exit 0 only when all layers pass. Emit one structured JSON line
      per failed file on stderr (matches W1-7 envelope style):
      {path, layer:"structure"|"assertion"|"prod_import", error_code,
       details}. These failures are NOT part of the plan's internal
      error envelope — guard lives outside Ralph CLI.

      Every wave verify task's verification.command MUST invoke this
      guard before pytest: "python scripts/check_not_skip_only.py
      <files> && pytest <files> -v" (see per-wave verify task
      commands below; all updated in this plan).
    acceptance_criteria: >
      pytest covers all 3 layers:
      Structure: (a) skip-only stub → non-zero; (b) module-level
      pytest.skip → non-zero; (c) zero test_* functions → non-zero.
      Assertion: (d) one non-skipped test with body `pass` → non-zero
      E_INTERNAL_ZERO_ASSERTIONS; (e) non-skipped test with one assert
      → exit zero; (f) five non-skipped tests averaging 0.2 asserts →
      non-zero E_INTERNAL_LOW_ASSERTIONS.
      Production-path: (g) test module with no `from cccc.` → non-zero
      E_INTERNAL_NO_PROD_IMPORT; (g2) bare `import cccc` without
      submodule → non-zero E_INTERNAL_NO_PROD_IMPORT (round-3);
      (g3) `from cccc.ralph.models import Plan` present but `Plan`
      not referenced in any test body → non-zero
      E_INTERNAL_UNUSED_PROD_IMPORT; (h) `from cccc.ralph.validator
      import validate_plan` referenced in test_validate() body →
      exit zero.
      Composite: (i) happy-path real test module passes all three
      layers silently.
    verification:
      level: unit
      command: "python scripts/check_not_skip_only.py tests/test_stub_guard.py && pytest tests/test_stub_guard.py -v"
      covers:
        tasks: ["W1-stub-guard"]
        flows: ["no_skip_stub_verification"]
    provides:
      - name: stub_guard_cli
        kind: runtime_capability
        schema_hint: "python scripts/check_not_skip_only.py <paths...>"

  - id: W1-r1-deterministic-sort
    title: "R-1 · Deterministic issue ordering (complete task_ids + canonical evidence)"
    role: leaf
    type: backend
    claimed_paths:
      - "src/cccc/ralph/validator.py"
      - "tests/test_validator_ordering.py"
    awareness_paths:
      - "src/cccc/ralph/models.py"
      - "src/cccc/ralph/rules_advisory.py"
    depends_on: []
    addresses: ["RA-ENHANCE-R1"]
    goal_behavior: >
      Introduce deterministic sort key for every ValidationIssue produced by
      validator.py and rules_advisory. Sort key = (severity_rank desc, code asc,
      tuple(task_ids sorted) asc, canonical_evidence_json asc). Canonical
      evidence is json.dumps with sort_keys=True and ensure_ascii=False.
      Four-part key is required (review consensus): task_ids[0] alone flaps when
      multi-task issues swap; raw str(evidence) flaps when dict iteration order
      changes.
    acceptance_criteria: >
      New test tests/test_validator_ordering.py runs validate on a fixture plan
      twice, asserts deepEqual of issue lists. A second fixture shuffles multi-
      task issues input order; output must be identical across runs.
    verification:
      level: unit
      command: "pytest tests/test_validator_ordering.py -v"
      covers:
        tasks: ["W1-r1-deterministic-sort"]
        flows: ["deterministic_report_output"]
    provides:
      - name: deterministic_issue_sort
        kind: runtime_capability
        schema_hint: "sort key = (severity, code, tuple(task_ids), canonical_evidence_json)"

  - id: W1-r4-mtime-cache
    title: "R-4 · Daemon cache keyed by (path, size, mtime_ns) not path alone"
    role: leaf
    type: backend
    claimed_paths:
      - "src/cccc/ralph/filesystem_validator.py"
      - "src/cccc/ralph/validator.py"
      - "tests/test_ralph_cache_invalidation.py"
    awareness_paths:
      - "src/cccc/daemon/foreman/ralph_service.py"
    depends_on: []
    addresses: ["RA-ENHANCE-R4"]
    goal_behavior: >
      Change _load_issue_file_map_cached and _scan_extra_forbid_models_cached
      in filesystem_validator.py and validator.py to key by
      (path, st_size, st_mtime_ns). Keep the in-process cache API identical;
      only the key changes. This is the review-consensus form — mtime alone can
      collide under fast edits, digest is too expensive per call.
    acceptance_criteria: >
      pytest asserts: (1) same-file same-mtime re-call returns cached value
      (no disk re-read); (2) mutating file (write + flush) invalidates next
      call; (3) replacing file to same size/content but different mtime_ns
      invalidates.
    verification:
      level: unit
      command: "pytest tests/test_ralph_cache_invalidation.py -v"
      covers:
        tasks: ["W1-r4-mtime-cache"]
        flows: ["daemon_fresh_rules"]
    provides:
      - name: mtime_keyed_ralph_cache
        kind: runtime_capability

  - id: W1-7-error-envelope
    title: "#7 · Structured Internal Failure Envelope (CLI + daemon + orchestrator)"
    role: leaf
    type: backend
    claimed_paths:
      - "src/cccc/ralph/cli.py"
      - "src/cccc/ralph/agent.py"
      - "src/cccc/daemon/foreman/ralph_service.py"
      - "src/cccc/daemon/foreman/workflow_orchestrator.py"
      - "src/cccc/daemon/ops/workflow_task_ops.py"
      - "tests/test_ralph_error_envelope.py"
    depends_on: []
    addresses: ["RA-ENHANCE-7"]
    goal_behavior: >
      Codex review note: the original scope (CLI only) would let later waves
      assume daemon-side errors also go through envelope — that assumption
      breaks. Expand envelope to three surfaces, with shared enum in agent.py.

      (1) CLI surface: wrap validator entry points (validate_with_project,
          semantic provider, regex/AST internal calls). Exit 2 for internal
          error, exit 1 for plan-level validation failure.
      (2) Daemon surface: ralph_service internal exceptions and IPC handler
          exceptions emit structured error dict to the IPC response envelope
          (not raise through the wire) — matches existing
          IpcValidationError shape. Add internal_error_code field.
      (3) Orchestrator surface: apply_task_event, on_task_completed, and
          register_and_suggest wrap internal failures and emit ledger event
          workflow.ralph_internal_error (new kind) with stage +
          internal_error_code + exception_type.

      Stable enum for stage ∈ {"load","validate","semantic","ipc","completion",
      "register","suggest","verify"} and internal_error_code (E_INTERNAL_*)
      documented in src/cccc/ralph/agent.py as a single RULE_ERROR_REGISTRY
      dict (not three copies).

      JSON output adds top-level "error" object: {stage, internal_error_code,
      exception_type, message, traceback_truncated (debug-only)}. Raw
      traceback NOT in stderr/ledger unless CCCC_DEBUG_TRACEBACK=1 set.
    acceptance_criteria: >
      tests/test_ralph_error_envelope.py covers: (a) CLI malformed YAML →
      exit 2 stage="load"; (b) simulated semantic provider crash via
      monkeypatch → exit 2 stage="semantic"; (c) regular validation
      failure → exit 1; (d) daemon handler with simulated internal
      exception → IPC response with structured error, no traceback
      leak; (e) orchestrator apply_task_event internal failure emits
      workflow.ralph_internal_error ledger event with stable fields.
    verification:
      level: integration
      command: "pytest tests/test_ralph_error_envelope.py -v"
      covers:
        tasks: ["W1-7-error-envelope"]
        flows: ["internal_failure_envelope"]
    provides:
      - name: internal_failure_envelope
        kind: api_endpoint
        schema_hint: "JSON/IPC/ledger: {error: {stage, internal_error_code, exception_type, message}}"

  - id: W1-verify
    title: "Wave 1 integration · deterministic sort + cache + error envelope"
    role: verification
    type: backend
    claimed_paths:
      - "tests/test_ralph_wave1_integration.py"
    depends_on:
      - "W1-stub-guard"
      - "W1-r1-deterministic-sort"
      - "W1-r4-mtime-cache"
      - "W1-7-error-envelope"
    addresses: ["RA-ENHANCE-R1", "RA-ENHANCE-R4", "RA-ENHANCE-7", "RA-ENHANCE-VERIFY-HARDENING"]
    goal_behavior: >
      Integration test that exercises all three Wave 1 capabilities in one
      session: load plan → run validate twice → assert byte-identical JSON;
      corrupt plan → assert structured error envelope; mutate fixture file
      mid-session → assert cache invalidates.
    acceptance_criteria: >
      pytest passes. No raw traceback leaks. Two subsequent validate runs of
      unchanged plan produce identical stdout.
    verification:
      level: integration
      command: "python scripts/check_not_skip_only.py tests/test_ralph_wave1_integration.py && pytest tests/test_ralph_wave1_integration.py -v"
      covers:
        tasks: ["W1-r1-deterministic-sort", "W1-r4-mtime-cache", "W1-7-error-envelope", "W1-verify"]
        flows: ["deterministic_report_output", "daemon_fresh_rules", "internal_failure_envelope"]
