    description: "No completion write succeeds on stale plan without --force-stale-complete override"
    required_verification_level: integration

  - id: unbounded_prompt_growth
    description: "_build_task_prompt must never exceed token budget silently — always emit omission_manifest"
    required_verification_level: integration

  - id: worker_prompt_omits_mandatory_minima
    description: "Mandatory minima sections (8) must never be truncated, only degraded with explicit marker"
    required_verification_level: integration

