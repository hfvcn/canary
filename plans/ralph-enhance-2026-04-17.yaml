  - id: W3-10-prompt-budgeter
    title: "#10 · Prompt Budgeter (token-aware, mandatory minima, omission manifest)"
    role: leaf
    type: backend
    claimed_paths:
      - "src/cccc/daemon/foreman/workflow_orchestrator.py"
      - "src/cccc/daemon/foreman/progress_report.py"
      - "tests/test_prompt_budgeter.py"
    awareness_paths:
      - "src/cccc/daemon/foreman/context_store.py"
      - "src/cccc/ralph/models.py"
    depends_on: ["W2-verify"]
    addresses: ["RA-ENHANCE-10"]
    goal_behavior: >
      Wrap _build_task_prompt with PromptBudget:
      (1) Unit: approximate tokens (tiktoken if available, else 4-char
          fallback). Default budget CCCC_PROMPT_TOKEN_BUDGET=12000,
          overridable per workflow.
      (2) Mandatory minima (never truncated): Task ID, Title, Goal Behavior,
          Acceptance Criteria, Verification Command, Do-Not-Ignore Issues,
          Recommended Tests, Forbidden Actions. Slots reserved upfront; if
          mandatory exceeds 40% of budget, raise E_PROMPT_MINIMA_OVERFLOW
          (internal error envelope, W1 #7).
      (3) Priority (gpp-8 derived): contract > blockers > verification_command
          > recommended_tests > condensed_semantic_focus > raw_semantic_context
          > context_store.
      (4) Degradation ladder: first condense (symbol signatures only), then
          truncate with [CONTEXT DEGRADED: <section>, <reason>] marker.
      (5) Omission manifest as JSON list of {section, original_tokens,
          included_tokens, strategy:"condensed"|"truncated"|"dropped"}.
          Attached to ledger event workflow.prompt_built and return value;
