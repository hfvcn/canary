      "modify_interface","rename") + highest_confidence.

      Secondary (hint): report.overall == "inconsistent" but all stale
      refs confidence == "best_effort" → hint only; upgrade to warning
      requires ledger-observed repetition (implemented by Wave 9 audit
      statistics, NOT here).

      Inconclusive: report.overall == "inconclusive" (opaque detected)
      → hint with "provider_degraded": true field in evidence. No warning.

      Consistent: report.overall == "consistent" → no issue.

      Taxonomy sanity: all code paths use existing exact/best_effort/opaque
      triad; semantic_metrics.py:16 CONFIDENCE_LEVELS untouched. Worker-
      facing wording is done in W4-2 prompt mapping layer (not here).
