    description: "Issue digest must not fall back to pure severity-first ordering — must honor action_owner + worker_relevance quota"
    required_verification_level: unit

  - id: char_based_truncation
    description: "Budgeter must never truncate by char count — must use token estimate + section-level degradation"
    required_verification_level: unit

  - id: cross_workflow_warning_emission
    description: "Must not emit W_CROSS_WORKFLOW_* validator code — cross-workflow pressure is scheduler lane event only"
    required_verification_level: integration

