  - id: W8b-suppress-lease
    title: "Suppression Lease + W_SUPPRESS_EXPIRED + W_ORPHANED_SUPPRESSION"
    role: leaf
    type: backend
    claimed_paths:
      - "src/cccc/ralph/models.py"
      - "src/cccc/ralph/validator.py"
      - "src/cccc/ralph/plan_io.py"
      - "tests/test_suppress_lease.py"
    depends_on: ["W8a-provenance-and-issue-id"]
    addresses: ["RA-ENHANCE-SUPPRESS-LEASE"]
    goal_behavior: >
      Decision Q5 v2 applied (identity = plan-fields, no `_provenance`).
      Phase A only in this PR; Phase B/C deferred to follow-up.

      Extend SuppressInstance (models.py; `reason` already exists at :232):
        owner: str = ""
        expiry: Optional[str] = None     # ISO date YYYY-MM-DD
        review_after: Optional[str] = None

      Identity rule (v2 + round-3 placeholder rejection): a suppress
      entry is "managed/new" iff all three of {owner, reason, expiry}
      are non-empty AND valid:
        - owner/reason: lowercased not in {todo, tbd, unknown, n/a,
          xxx, placeholder}
        - expiry: parseable ISO date YYYY-MM-DD, ≤ 2 years from
          declaration date (prevents "9999-12-31" permanent bypass)
      Three non-empty but ANY invalid → E_SUPPRESS_LEASE_INCOMPLETE
      (catches half-filled / placeholder states).
      Derived PURELY from plan file content — no PrivateAttr, no
      runtime hash set, no git history. Reload/restart safe.

      Rules:
      - Legacy suppress: silent load (Phase A).
      - "Half-managed" suppress (one or two of the three set): loaded but
        emit E_SUPPRESS_LEASE_INCOMPLETE — catches "user started adding
        lease metadata but didn't finish".
      - CLI `ralph suppress add` enforcement layer: refuses to write
        without all three (CLI-side validation, not load-time).
      - W_SUPPRESS_EXPIRED: suppress.expiry non-empty AND expiry < today.
      - W_ORPHANED_SUPPRESSION: suppress.task non-empty AND
        suppress.task ∈ state.completed_task_ids.

      DO NOT touch Plan._provenance. DO NOT introduce a load-time hash
      set for suppress identity.
    acceptance_criteria: >
      pytest covers: (a) fully legacy suppress (no lease fields) → silent
      load (Phase A); (b) half-managed (owner set but expiry empty) →
      E_SUPPRESS_LEASE_INCOMPLETE at load; (b2) owner="TODO",
      reason="TBD", expiry="9999-12-31" → E_SUPPRESS_LEASE_INCOMPLETE
      (placeholder rejection, round-3); (b3) expiry="2024-01-01"
      (parseable but past) → managed + W_SUPPRESS_EXPIRED (not rejected
      — past date is valid-but-expired, not placeholder);
      (c) fully managed with valid fields → silent load,
      W_SUPPRESS_EXPIRED fires if expiry past; (d) CLI
      `ralph suppress add` without one of the three fields → exit code 2
      refusing write (CLI-side); (e) W_ORPHANED_SUPPRESSION when
      suppress.task already in completed_task_ids; (f) reload-roundtrip:
      save → reload → state identical (proves identity persists).
    verification:
      level: integration
      command: "pytest tests/test_suppress_lease.py -v"
      covers:
        tasks: ["W8b-suppress-lease"]
        flows: ["stable_report_provenance"]
    provides:
      - name: suppress_lease_phase_a
        kind: runtime_capability
    consumes:
      - name: validation_provenance
        from: W8a-provenance-and-issue-id

