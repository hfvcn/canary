  # ═══════════════════════════════════════════════════════════════════════
  # Wave 2 · plan 完整性封口
  # ═══════════════════════════════════════════════════════════════════════

  - id: W2-1-pre-transition-digest-guard
    title: "#1 · W_REGISTERED_PLAN_STALE + pre-transition digest hook (engine-level)"
    role: leaf
    type: backend
    claimed_paths:
      - "src/cccc/kernel/workflow_state_engine.py"
      - "src/cccc/kernel/workflow_state_types.py"
      - "src/cccc/daemon/foreman/workflow_orchestrator.py"
      - "src/cccc/daemon/foreman/ralph_service.py"
      - "src/cccc/daemon/ops/workflow_task_ops.py"
      - "src/cccc/cli/workflow_cmds.py"
      - "src/cccc/ralph/validator.py"
      - "src/cccc/contracts/v1/event.py"
      - "tests/test_ralph_plan_digest_guard.py"
    awareness_paths:
      - "src/cccc/ralph/plan_io.py"
      - "tests/test_foreman_workflow.py"
    depends_on: ["W1-verify"]
    addresses: ["RA-ENHANCE-1"]
    goal_behavior: >
      Decision Q1 v2 (Codex review corrected). Original plan put guard at
      on_task_completed / _auto_sync_plan_state — both are too late: call
      chain apply_task_event → engine.report_worker_completion
      → record_verification_result fires FIRST, writing ledger and engine
      state; guard afterwards is post-hoc.

      (1) Primary guard: add new pre-transition hook
          create_plan_digest_freshness_hook(plan_context_ref) registered in
          orchestrator __init__ alongside the existing 3 hooks
          (workflow_orchestrator.py:202-204). Hook fires on ALL
          non-reversible transition kinds (Codex round-3):
            KIND_TASK_REPORTED_COMPLETED (workflow_state_types.py:17)
            KIND_VERIFICATION_PASSED (:19)
            KIND_VERIFICATION_FAILED (:21)
            KIND_VERIFICATION_SKIPPED (:20)
            KIND_TASK_FAILED (:18)
          IMPORTANT implementation detail (Codex final review confirmed):
          currently ONLY KIND_TASK_REPORTED_COMPLETED and KIND_TASK_STARTED
          go through _run_pre_transition_hooks() before _append()
          (workflow_state_engine.py:140,189). The other 4 kinds write
          ledger directly:
            - report_worker_failed() → _append at :203 (no hook)
            - record_verification_result() passed → _append at :216
            - record_verification_result() skipped → _append at :220
            - record_verification_result() failed → _append at :223
          THIS TASK MUST add _run_pre_transition_hooks() calls to
          EACH of these 4 entry points BEFORE their _append() call.
          Without this, registering the hook on 5 kinds has no effect
          on 4 of them — the hook never fires.
          On mismatch between current disk digest and
          plan_context.plan_digest → hook raises PreTransitionVetoed.
          Engine REFUSES the transition; the triggering ledger event
          is NOT written. Instead, engine
          writes new kind workflow.plan_digest_divergence carrying
          {registered_digest, current_digest, task_id, override_used}.
          New kind added to workflow_state_types.py and contracts/v1/event.py.
      (2) Override path: apply_task_event entry (workflow_orchestrator.py:2137
          and workflow_task_ops.py:142,185) accepts optional override flag
          from caller, injects into event.data as override_stale_digest=True.
          Hook reads flag; if True, allows transition but still writes
          workflow.plan_digest_divergence with override_used=true.
          CLI --force-stale-complete surface in cli/workflow_cmds.py.
      (3) Validate-side warning: plan_io / validator keep emitting
          W_REGISTERED_PLAN_STALE when disk digest differs from registered.
          Non-blocking — exists for early visibility at planning time.
      (4) Defense-in-depth: on_task_completed and _auto_sync_plan_state
          still compare digests; mismatch emits advisory
          workflow.plan_digest_divergence_post_hoc (hint, non-blocking) —
          should never fire if hook works.
      (5) Preservation: PlanContext.runtime_plan frozen-bytes behavior kept
          unchanged; tests/test_foreman_workflow.py:1688 must still pass
          byte-identical.
    acceptance_criteria: >
      pytest covers: (a) stale plan: task_reported_completed vetoed by
      pre-transition hook — engine state unchanged, only
      workflow.plan_digest_divergence in ledger; (a2) stale plan:
      verification_passed vetoed — same veto behavior; (a3)
      verification_failed vetoed; (a4) verification_skipped vetoed;
      (a5) task_failed vetoed — all 5 non-reversible kinds confirmed
      individually (each path has its own _run_pre_transition_hooks
      call before _append, added by this task);
      (b) --force-stale-complete
      passes through; ledger contains both workflow.plan_digest_divergence
      (override_used=true) AND the normal completion chain; (c)
      validate-side W_REGISTERED_PLAN_STALE emitted for drifted plan;
      (d) existing frozen-snapshot test
      tests/test_foreman_workflow.py:1688 passes unchanged; (e) post-hoc
      advisory never fires in normal runs (guaranteed via test fixture).
    verification:
      level: integration
      command: "pytest tests/test_ralph_plan_digest_guard.py tests/test_foreman_workflow.py -k registered_plan_frozen -v"
      covers:
        tasks: ["W2-1-pre-transition-digest-guard"]
        flows: ["plan_digest_freshness"]
    provides:
      - name: plan_digest_pre_transition_guard
        kind: runtime_capability
        schema_hint: "pre-transition hook on KIND_TASK_REPORTED_COMPLETED + workflow.plan_digest_divergence event"
    consumes:
      - name: internal_failure_envelope
        from: W1-7-error-envelope

  - id: W2-verify
    title: "Wave 2 verify · two-layer plan digest guard end-to-end"
    role: verification
    type: backend
    claimed_paths:
      - "tests/test_ralph_wave2_integration.py"
    depends_on: ["W2-1-pre-transition-digest-guard"]
    addresses: ["RA-ENHANCE-1"]
    goal_behavior: >
      End-to-end integration: register plan, run workflow, edit plan mid-
      workflow (add a task + a suppress), attempt task complete, assert hard-
      block. Re-run with --force-stale-complete, assert pass + ledger event.
      This is the reviewer's required scenario (dual-digest split-brain
      prevention).
    acceptance_criteria: >
      pytest passes. Ledger scan after test shows exactly one
      workflow.plan_digest_divergence event with override_used flag correct.
    verification:
      level: integration
      command: "python scripts/check_not_skip_only.py tests/test_ralph_wave2_integration.py && pytest tests/test_ralph_wave2_integration.py -v"
      covers:
        tasks: ["W2-1-pre-transition-digest-guard", "W2-verify"]
        flows: ["plan_digest_freshness", "silent_stale_plan_completion"]
    consumes:
      - name: plan_digest_pre_transition_guard
        from: W2-1-pre-transition-digest-guard

  # ═══════════════════════════════════════════════════════════════════════
  # Wave 3 · 预算器（worker-facing 改动前置）
