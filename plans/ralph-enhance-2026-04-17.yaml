        real defer is in _defer_batch_for_single_writer
        (workflow_orchestrator.py:687)

      v2 implementation uses only existing primitives:

      (1) Active-workflow signal (round-3 cold-start fix): reuse
          task.last_heartbeat AND task.started_at
          (workflow_state_engine.py:142,164,490; orchestrator:264,903).
          A workflow is "active" iff workflow state is NOT terminal
          (completed/failed/cancelled) AND any of its tasks has
          max(started_at, last_heartbeat) updated within last 300s.
          Using started_at (written by report_worker_started :142)
          closes the cold-start window between dispatch and first
          heartbeat — register_task/register_batch/approve_batch do
          NOT write last_heartbeat (:58-110). If dispatch→start gap
          also needs coverage, additionally check assigned_at
          (workflow_state_types.py:51,58).

      (2) Competing claim discovery: at scheduler decision time, query
          the engine for all other active workflows and their
          task.claimed_paths. Provide this snapshot as new optional
          parameter to _defer_batch_for_single_writer:
          external_competing_claims: Dict[path -> {workflow_id,
            task_id, heartbeat_age_ms}].
          Defer logic extends existing overlap check with this snapshot.

      (3) No new event kind. Reuse workflow.task_deferred
          (workflow_state_types.py:25 KIND_TASK_DEFERRED). Extend event
          payload (contracts/v1/event.py TaskDeferredEvent model) with:
            deferral_reason: Literal["internal_writer_conflict",
              "external_workflow_pressure"]
            competing_refs: List[{workflow_id, task_id,
              overlapping_paths, heartbeat_age_ms}]
          Existing consumers tolerate added fields (pydantic extra=ignore
          on those models — verify).

      (4) No lease primitive added. If long-running tasks need lock
          beyond heartbeat window, document as §4.6 follow-up.

      (5) No W_CROSS_WORKFLOW_* validator warning — per original
          consensus, this is scheduler truth, not plan truth.
    acceptance_criteria: >
      pytest covers: (a) two active workflows claim overlapping paths,
      one's task max(started_at, last_heartbeat) within 300s → pending task in the
      other workflow gets deferred with workflow.task_deferred event
      carrying deferral_reason="external_workflow_pressure" +
      competing_refs non-empty; (a2) cold-start: workflow just dispatched
      (started_at within 300s, no heartbeat yet) → still treated as
      active → defer fires (round-3 fix); (b) competing workflow's
      max(started_at, last_heartbeat) >300s → no defer;
      (c) competing workflow in terminal state → no defer;
      (d) no path overlap → no defer; (e) extend of
      TaskDeferredEvent is backward-compatible (old consumers without
      deferral_reason still parse).
    verification:
      level: integration
      command: "pytest tests/test_cross_workflow_pressure.py -v"
      covers:
        tasks: ["W10-cross-workflow-pressure"]
        flows: ["scheduler_defer_observable", "cross_workflow_warning_emission"]
    provides:
      - name: scheduler_lane_defer_event
        kind: api_endpoint
        schema_hint: "workflow.task_deferred_due_to_external_write_pressure"

  - id: W10-final-e2e
    title: "Final E2E · real daemon + Codex worker across whole enhancement surface"
    role: verification
    type: backend
    claimed_paths:
      - "tests/e2e/test_ralph_enhancement_e2e.py"
    depends_on: ["W10-cross-workflow-pressure"]
    addresses:
