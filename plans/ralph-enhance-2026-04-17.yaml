      - "src/cccc/ralph/filesystem_validator.py"
      - "src/cccc/ralph/semantic_metrics.py"
    depends_on: ["W3-verify"]
    addresses: ["RA-ENHANCE-FINDING-META"]
    goal_behavior: >
      Decision Q2 v2 (Codex review corrected) + structural tension #1 fix.
      Two changes:

      (1) Taxonomy sync: use EXISTING `exact|best_effort|opaque` triad
          (semantic_metrics.py:16 CONFIDENCE_LEVELS). Do NOT invent
          `heuristic/unknown` — would break gate_readiness statistics and
          audit consumers. All new issue metadata uses this triad only.

      (2) Closed slice: Codex flagged that W4-2 reads issues through
          IpcValidationError (contracts/v1/ralph_ipc.py:66-75) — a
          serialized form of ValidationIssue. If we only extend
          ValidationIssue, the serializer silently drops the new fields
          and W4-2 ends up stuffing metadata back into `evidence`. Fix:
          extend BOTH models and add a round-trip test.

      Extend ValidationIssue (models.py) AND IpcValidationError
      (contracts/v1/ralph_ipc.py) with (all default-empty):
        confidence: Literal["exact","best_effort","opaque"] = "opaque"
        source: str = ""            # module name e.g. "validator.py:CMP-1"
        action_owner: Literal["author","worker","shared","unknown"] = "unknown"
        worker_relevance: Literal["blocking","execution_risk","verification_risk","none"] = "none"
      Update _serialize_validation_issue in workflow_orchestrator.py
      (:307-312 area) to include the 4 new fields.

      Populate at issue-emission time:
        - CMP-* structural rules: action_owner="author", worker_relevance="none",
          confidence="exact" (regex/AST based)
        - S_* semantic: confidence = provider-reported (exact / best_effort /
          opaque per current ConsistencyReport semantics)
        - W_VERIFICATION_*: action_owner="shared", worker_relevance="verification_risk"

      DO NOT yet add report_schema_version / ruleset_digest / issue_instance_id
      (Wave 8 work).
    acceptance_criteria: >
      pytest covers: (a) all 3 confidence values produced by fixture plans
      using existing taxonomy; (b) rule family × action_owner matrix sensible;
      (c) ValidationIssue → IpcValidationError round-trip preserves all 4
      new fields with no stuffing into evidence; (d) semantic_metrics.py
      CONFIDENCE_LEVELS unchanged (no new enum values introduced).
    verification:
      level: unit
      command: "pytest tests/test_issue_metadata.py -v"
      covers:
        tasks: ["W4-finding-metadata"]
        flows: ["worker_sees_blockers"]
    provides:
      - name: finding_metadata_minimal
        kind: artifact
        schema_hint: "ValidationIssue.{confidence,source,action_owner,worker_relevance}"

  - id: W4-2-issue-digest
    title: "#2 · Prompt Task Issue Digest (actionability-first, action_owner filtered)"
    role: leaf
    type: backend
    claimed_paths:
      - "src/cccc/daemon/foreman/workflow_orchestrator.py"
      - "tests/test_prompt_issue_digest.py"
    awareness_paths:
      - "src/cccc/ralph/models.py"
    depends_on: ["W4-finding-metadata"]
    addresses: ["RA-ENHANCE-2"]
    goal_behavior: >
      Inject per-task issue digest into worker prompt via _build_task_prompt
      (mandatory-minima section "Do-Not-Ignore Issues").
      Inclusion policy (review consensus — actionability-first, not
      severity-first):
      (1) Filter by action_owner ∈ {"worker","shared"}; drop "author"
          (CMP-* structural issues do NOT reach worker).
      (2) Quota by worker_relevance: up to 1 blocking + 1 execution_risk +
          1 verification_risk (gp-8-h spec). If quota unfilled, top up by
          (severity desc, confidence desc, code asc).
      (3) Within category, prefer "changes execution strategy" signals
          (S_*, W_VERIFICATION_*, claimed_paths overlap) over organizational
          hints.
      (4) Each entry: 1 single-line action verb + brief evidence. Budgeter
          (W3) decides final space.
    acceptance_criteria: >
      pytest covers: (a) task with mixed CMP-* and S_* issues → only S_*
      reach prompt; (b) quota selection deterministic across runs; (c)
      emitted prompt lines match stable snapshot fixture.
    verification:
