  # ── T10: RA-2 — Beyond-scope checklist mechanism ────────────────────
  - id: T10
    title: "RA-2: Static beyond-scope checklist with beyond_scope flag in validate output"
    role: leaf
    type: backend
    claimed_paths:
      - src/cccc/ralph/models.py
      - src/cccc/ralph/validator.py
      - src/cccc/ralph/cli.py
      - .cccc/beyond_scope.yaml
      - tests/ralph/test_ra2_beyond_scope.py
    depends_on: ["T3"]
    addresses: ["RA-2"]
    goal_behavior: >
      [Codex F4 adopted: add cli.py to claimed_paths — goal requires
       modifying validate CLI output for beyond_scope display]

      1. Create .cccc/beyond_scope.yaml — a static configuration file listing
         known Ralph limitations that can be covered by an Agent. Initial
         content derived from 问题清单-v5-ralph.md §二 "🤖 Agent 可覆盖" items.
         Use explicit mapping schema with matches.issue_codes for stable
         runtime hit surface (Codex structural finding adopted):

         ```yaml
         beyond_scope_items:
           - id: RV-15
             description: "Ralph new rule bugs cannot self-check"
             category: structural_limit
             matches:
               issue_codes: []
           - id: RV-18
             description: "goal_behavior function name existence"
             category: semantic_gap
             matches:
               issue_codes: ["S_SYMBOL_TARGET_MISSING"]
           - id: RO-10n
             description: "Verification command semantic validity"
             category: runtime_semantic
             matches:
               issue_codes: ["W_VERIFICATION_BEHAVIOR_MISMATCH"]
           # ... all items marked 🤖 in §二
         ```

      2. In models.py, add `beyond_scope: bool = False` field to
         ValidationIssue. This marks issues that fall into known
         beyond-scope categories.

      3. In validator.py validate_with_project(): after collecting all
         issues, load .cccc/beyond_scope.yaml (if exists). For issues
         whose code matches a beyond_scope_item pattern (configurable
         mapping from issue codes to beyond_scope item IDs), set
         beyond_scope=True on the issue.

      4. In CLI output (cli.py validate): for issues with beyond_scope=True,
         append " [beyond scope — agent review recommended]" to the message.
    acceptance_criteria: >
      1. .cccc/beyond_scope.yaml loads without error.
      2. validate output marks matching issues with beyond_scope=True.
      3. Missing .cccc/beyond_scope.yaml is not an error (empty list).
      4. JSON output includes beyond_scope field.
      5. beyond_scope items appear in validate summary count.
    failure_path: >
      If the mapping from issue codes to beyond_scope IDs is too rigid,
      use a pattern-based approach (e.g. "any W_* with 'semantic' in
      the code name").
    verification:
      level: unit
      command: "pytest tests/ralph/test_ra2_beyond_scope.py -q"
      checks:
        - name: beyond_scope_loaded
          command: "pytest tests/ralph/test_ra2_beyond_scope.py -q -k test_config_loads"
          required: true
        - name: issue_marked
          command: "pytest tests/ralph/test_ra2_beyond_scope.py -q -k test_issue_marked_beyond_scope"
          required: true
        - name: missing_config_ok
          command: "pytest tests/ralph/test_ra2_beyond_scope.py -q -k test_missing_config_no_error"
          required: true
      covers:
        tasks: ["T10"]
        paths:
          - src/cccc/ralph/models.py
          - src/cccc/ralph/validator.py
          - .cccc/beyond_scope.yaml
    provides:
      - name: beyond_scope_checklist
        kind: runtime_capability
        schema_hint: "beyond_scope.yaml config + ValidationIssue.beyond_scope flag"

  # ── T11: RA-3 — verification_mode field ─────────────────────────────
  - id: T11
    title: "RA-3: Add verification_mode field to TaskSpec with agent_pending outcome"
    role: leaf
    type: backend
    claimed_paths:
      - src/cccc/ralph/models.py
      - src/cccc/ralph/core.py
      - src/cccc/ralph/cli.py
      - src/cccc/contracts/v1/ralph_ipc.py
      - tests/ralph/test_ra3_verification_mode.py
    awareness_paths:
      - src/cccc/daemon/foreman/ralph_service.py
    depends_on: ["T3"]
    addresses: ["RA-3"]
    goal_behavior: >
      [Codex F1+F2 adopted: (1) claim IPC contract file since BatchResult
       and VerificationOutcome need updating; (2) do NOT return "skipped" for
       agent mode — add "agent_pending" as a real outcome that complete can accept]

      1. In models.py TaskSpec, add:
         verification_mode: Literal["ralph", "agent"] = "ralph"
         Default is "ralph" for backward compatibility.

      2. In contracts/v1/ralph_ipc.py VerificationOutcome, add:
         "agent_pending" as a valid outcome value.

      3. In core.py verify(): when task.verification_mode == "agent",
         return outcome="agent_pending" (NOT "skipped"). This is a valid
         completion state meaning "awaiting external agent verification".

      4. In core.py/cli.py complete path: accept "agent_pending" as a
         completable outcome (alongside "passed"). The task can be marked
         complete with a note that agent verification is pending.

      5. In core.py suggest(): include verification_mode per task in
         BatchResult metadata. Add task_metadata dict to BatchResult:
         {task_id: {"verification_mode": "ralph"|"agent"}}.

      6. In contracts/v1/ralph_ipc.py: add verification_mode to TaskRef
         so it propagates through IPC to Foreman.

      7. Plan loading: verification_mode is optional, defaults to "ralph".
         Unknown values fail validation with clear error.
    acceptance_criteria: >
      1. Plan with verification_mode: ralph works exactly as before.
      2. Plan with verification_mode: agent returns agent_pending from verify().
      3. agent_pending outcome allows complete to succeed.
      4. Plan without verification_mode defaults to "ralph".
      5. Invalid verification_mode value fails plan loading with error.
      6. suggest() output includes verification_mode per task.
      7. TaskRef includes verification_mode for IPC transmission.
      8. Existing tests pass unchanged.
    failure_path: >
      If agent_pending creates ambiguity in downstream consumers, add a
      separate agent_verified outcome for when agent review completes.
    verification:
      level: unit
      command: "pytest tests/ralph/test_ra3_verification_mode.py -q"
      checks:
        - name: ralph_mode_unchanged
          command: "pytest tests/ralph/test_ra3_verification_mode.py -q -k test_ralph_mode_default"
          required: true
        - name: agent_pending_outcome
          command: "pytest tests/ralph/test_ra3_verification_mode.py -q -k test_agent_mode_returns_agent_pending"
          required: true
        - name: agent_pending_completable
          command: "pytest tests/ralph/test_ra3_verification_mode.py -q -k test_agent_pending_allows_complete"
          required: true
        - name: suggest_includes_mode
          command: "pytest tests/ralph/test_ra3_verification_mode.py -q -k test_suggest_includes_mode"
          required: true
        - name: taskref_has_mode
          command: "pytest tests/ralph/test_ra3_verification_mode.py -q -k test_taskref_includes_verification_mode"
          required: true
      covers:
        tasks: ["T11"]
        paths:
          - src/cccc/ralph/models.py
          - src/cccc/ralph/core.py
          - src/cccc/contracts/v1/ralph_ipc.py
    provides:
      - name: verification_mode_routing
        kind: runtime_capability
        schema_hint: "TaskSpec.verification_mode: ralph|agent + agent_pending outcome"

  # ── T12: RA-1 — Ralph Agent layer ──────────────────────────────────
  - id: T12
    title: "RA-1: Ralph Agent layer — beyond-scope semantic review via LLM"
    role: leaf
    type: backend
    claimed_paths:
      - src/cccc/ralph/agent.py
      - src/cccc/ralph/cli.py
      - tests/ralph/test_ra1_agent.py
    awareness_paths:
      - src/cccc/ralph/validator.py
      - src/cccc/ralph/models.py
      - .cccc/beyond_scope.yaml
    depends_on: ["T10"]
    addresses: ["RA-1"]
    goal_behavior: >
      Create src/cccc/ralph/agent.py — the Ralph Agent module.

      Architecture:
      1. RalphAgent class with:
         - __init__(workflow_id, plan, beyond_scope_items, api_key=None)
         - review(issues: List[ValidationIssue]) -> List[AgentFinding]
         - Each AgentFinding has: issue_ref, assessment, confidence, advisory_only=True

      2. The agent:
         - Receives only beyond_scope=True issues from validate output
         - For each issue, constructs a prompt with:
           * The issue description and code
           * The relevant task's goal_behavior and acceptance_criteria
           * The plan's overall context (title, scope)
         - Does NOT read source code (only plan text + Ralph output)
         - Calls an LLM API (configurable: Gemini Flash, Claude Haiku, etc.)
         - Returns findings labeled "advisory only — no decision authority"

      3. Configuration:
         - API provider/model configurable via .cccc/ralph.yaml:
           agent.provider: "google" | "anthropic" | "openai"
           agent.model: "gemini-2.0-flash" (default)
           agent.api_key_env: "GOOGLE_API_KEY" (env var name)
         - Disabled with --no-agent CLI flag

      4. CLI integration (cli.py):
         - `ralph validate` with agent: after structural validation,
           if beyond_scope issues exist and agent is enabled, run agent
           review and append findings to output
         - `ralph validate --no-agent`: skip agent, pure static mode
         - Agent findings shown in separate section: "Agent Review (advisory)"

      5. Error handling:
         - API failure → log warning, continue without agent
         - Timeout (30s per issue) → skip that issue
         - No API key → warn and skip agent gracefully
    acceptance_criteria: >
      1. RalphAgent can be instantiated and review() returns findings.
      2. --no-agent flag disables agent entirely.
      3. Missing API key logs warning but doesn't fail validation.
      4. Agent findings are clearly labeled "advisory only".
      5. Agent receives only beyond_scope issues, not all issues.
      6. Existing validate behavior unchanged when agent is disabled.
    failure_path: >
      If LLM API integration is too complex for initial implementation,
      create the agent framework with a mock/stub provider that returns
      placeholder findings. Real LLM integration can follow.
    verification:
      level: unit
      command: "pytest tests/ralph/test_ra1_agent.py -q"
      checks:
        - name: agent_creates
          command: "pytest tests/ralph/test_ra1_agent.py -q -k test_agent_init"
          required: true
        - name: no_agent_flag
          command: "pytest tests/ralph/test_ra1_agent.py -q -k test_no_agent_skips"
          required: true
        - name: missing_key_graceful
          command: "pytest tests/ralph/test_ra1_agent.py -q -k test_missing_api_key_graceful"
          required: true
      covers:
        tasks: ["T12"]
        paths: ["src/cccc/ralph/agent.py", "src/cccc/ralph/cli.py"]
    consumes:
      - name: beyond_scope_checklist
        kind: runtime_capability
        from: T10
    provides:
      - name: ralph_agent_layer
        kind: runtime_capability
        schema_hint: "RalphAgent class with review() → List[AgentFinding]"

  # ── T13: RA-4 — Two-phase split alignment ──────────────────────────
  - id: T13
    title: "RA-4: Align suggest() with two-phase split (task batches + module split)"
    role: leaf
    type: backend
    claimed_paths:
      - src/cccc/ralph/core.py
      - src/cccc/daemon/foreman/ralph_service.py
      - src/cccc/contracts/v1/ralph_ipc.py
      - tests/ralph/test_ra4_two_phase.py
    awareness_paths:
      - src/cccc/ralph/models.py
      - src/cccc/daemon/foreman/workflow_orchestrator.py
    depends_on: ["T11", "T12"]
    addresses: ["RA-4"]
    goal_behavior: >
      Align Ralph suggest() output with the two-phase decomposition model
      from 工作流蓝图.md §4.1:

      Phase 1 (Ralph): suggest() outputs task batches respecting:
      - _unlock_score() for prioritization
      - _write_sets_conflict() for parallel safety
      - _dependency_block_reasons() for dependency ordering
      - Batch completion triggers re-suggest for next batch

      Phase 2 (Foreman): module-level splitting per task
      - RalphService exposes suggest_batch() that returns
        ReadyBatchSuggestion with per-task metadata
      - Each task includes verification_mode so Foreman knows routing
      - Batch boundary: wait for all tasks in batch to complete/fail
        before re-suggesting

      [Codex structural finding adopted: Ralph should output batch grouping
       metadata, not own the batch ID. The authoritative batch_id stays with
       orchestrator/engine (ReadyBatchSuggestion.suggestion_id). Ralph adds
       batch_sequence (monotonic) and batch_boundary as advisory metadata.]

      Changes needed:
      1. core.py suggest(): add batch_sequence (int, monotonic) and
         batch_boundary (bool) to BatchResult as advisory metadata.
         batch_sequence increments each time suggest() is called after
         completions. batch_boundary=True means "complete this set before
         re-suggesting". These are advisory — orchestrator may override.
      2. ralph_service.py: pass batch_sequence and batch_boundary through
         to ReadyBatchSuggestion alongside existing suggestion_id (which
         remains the authoritative batch identifier).
      3. contracts/v1/ralph_ipc.py: add batch_sequence and batch_boundary
         fields to ReadyBatchSuggestion.
    acceptance_criteria: >
      1. suggest() returns batch_sequence in result.
      2. After completing a batch, re-suggest returns incremented batch_sequence.
      3. Existing suggest behavior preserved (new fields are additive).
      4. RalphService passes batch metadata through to suggestions.
      5. verification_mode included in per-task suggestion data.
      6. orchestrator's suggestion_id remains the authoritative batch ID.
    failure_path: >
      If batch boundary semantics are too restrictive (some tasks could
      start early), make batch_boundary optional/advisory.
    verification:
      level: unit
      command: "pytest tests/ralph/test_ra4_two_phase.py -q"
      checks:
        - name: batch_id_present
          command: "pytest tests/ralph/test_ra4_two_phase.py -q -k test_suggest_has_batch_id"
          required: true
        - name: batch_increments
          command: "pytest tests/ralph/test_ra4_two_phase.py -q -k test_batch_id_increments"
          required: true
      covers:
        tasks: ["T13"]
        paths: ["src/cccc/ralph/core.py", "src/cccc/daemon/foreman/ralph_service.py"]
    consumes:
      - name: verification_mode_routing
        kind: runtime_capability
        from: T11
      - name: ralph_agent_layer
        kind: runtime_capability
        from: T12

