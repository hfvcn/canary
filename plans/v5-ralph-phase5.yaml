# Plan: v5-ralph-phase5 — 问题清单 v5 全部未解决项
# Source: todo/问题清单-v5-ralph.md (RVE-1~9, RA-1~4, RAC-1~2)
# Date: 2026-04-17
# Scope: 9 pure static rules (RVE-*), 4 Agent infrastructure items (RA-*),
#         2 Agent coverage candidates (RAC-*), plus integration test
# Blueprint: todo/工作流蓝图.md v0.3

# Suppress pre-existing critical flow errors — this plan only modifies Ralph internals,
# not the daemon startup or CLI workflow entrypoints.
suppress_codes:
  - E_CRITICAL_FLOW_UNCOVERED
  - E_CRITICAL_FLOW_ENTRYPOINT_UNOWNED
  - E_CRITICAL_ENTRYPOINT_UNOWNED

tasks:
  # ═══════════════════════════════════════════════════════════════════════
  # P1 — HIGH PRIORITY
  # ═══════════════════════════════════════════════════════════════════════

  # ── T1: RVE-7 — W_INTEGRATION_TASK_SHALLOW_VERIFICATION ──────────────
  - id: T1
    title: "RVE-7: Warn when integration tasks have only grep/compile checks"
    role: leaf
    type: backend
    claimed_paths:
      - src/cccc/ralph/validator.py
      - tests/ralph/test_rve7_shallow_verification.py
    awareness_paths:
      - src/cccc/ralph/models.py
    depends_on: []
    addresses: ["RVE-7"]
    goal_behavior: >
      Add _check_integration_shallow_verification() to validator.py.
      Called from _collect_structural_issues().

      For each task where role == "integration" or role == "verification",
      inspect verification.checks[]. A check is "shallow" if its command
      matches only grep/rg/ag patterns, python -c with only import/hasattr,
      or py_compile. If ALL checks are shallow and verification.level
      is "integration" or "e2e", emit W_INTEGRATION_TASK_SHALLOW_VERIFICATION:
      "task '{id}' has role={role} but all verification checks are shallow
      (grep/compile only) — consider adding behavioral checks that verify
      actual output or state changes".

      Detection heuristics for "shallow" commands:
      - Starts with grep/rg/ag/egrep/fgrep
      - Is `python -m py_compile`
      - Is `python -c` where the payload only contains import/hasattr/isinstance
        (no assert on return values, no function calls with arguments)
      - Starts with `test -f` or `[ -f`

      Do NOT flag tasks where:
      - role == "leaf" (leaf tasks may legitimately have simple checks)
      - verification.checks is empty (already caught by W_VERIFICATION_NO_CHECKS)
      - At least one check is non-shallow (behavioral)
    acceptance_criteria: >
      1. Plan with integration task having only `grep -q "def foo"` checks
         triggers W_INTEGRATION_TASK_SHALLOW_VERIFICATION.
      2. Same plan with one additional `pytest` check does NOT trigger.
      3. Leaf task with only grep checks does NOT trigger.
      4. Integration task with `python -c "import X; assert X.func(1)==2"` is
         NOT flagged (has behavioral assertion).
      5. Integration task with `python -c "import X"` IS flagged (import-only).
    failure_path: >
      If heuristic produces too many false positives, narrow the shallow
      detection to only exact-match patterns (grep/py_compile) and skip
      the python -c analysis.
    verification:
      level: unit
      command: "pytest tests/ralph/test_rve7_shallow_verification.py -q"
      checks:
        - name: shallow_grep_flagged
          command: "pytest tests/ralph/test_rve7_shallow_verification.py -q -k test_integration_grep_only_flagged"
          required: true
        - name: behavioral_check_not_flagged
          command: "pytest tests/ralph/test_rve7_shallow_verification.py -q -k test_integration_with_behavioral_not_flagged"
          required: true
        - name: leaf_not_flagged
          command: "pytest tests/ralph/test_rve7_shallow_verification.py -q -k test_leaf_shallow_not_flagged"
          required: true
      covers:
        tasks: ["T1"]
        paths: ["src/cccc/ralph/validator.py"]
    provides:
      - name: shallow_verification_detection
        kind: runtime_capability
        schema_hint: "W_INTEGRATION_TASK_SHALLOW_VERIFICATION rule"

  # ═══════════════════════════════════════════════════════════════════════
  # P2 — MEDIUM PRIORITY
  # ═══════════════════════════════════════════════════════════════════════

  # ── T2: RVE-1 — E_VERIFICATION_TARGET_MISSING_FILE ───────────────────
  - id: T2
    title: "RVE-1: Check verification.command file path tokens exist on disk"
    role: leaf
    type: backend
    claimed_paths:
      - src/cccc/ralph/filesystem_validator.py
      - tests/ralph/test_rve1_missing_file.py
    awareness_paths:
      - src/cccc/ralph/workspace_index.py
    depends_on: []
    addresses: ["RVE-1"]
    goal_behavior: >
      In filesystem_validator.py, add a new check within validate_filesystem()
      (or as a helper called from it).

      For each task's verification.command and each verification.checks[].command:
      1. Extract file path tokens using regex:
         `(?:tests|scripts|src|bin|tools)(?:/[\w.\-]+)+\.py`
      2. For each extracted token, check (project_root / token).exists()
         via workspace.path_exists(token).
      3. If the file does not exist, emit E_VERIFICATION_TARGET_MISSING_FILE
         (error level): "task '{id}' verification references '{token}' but
         the file does not exist in the project".

      This is distinct from the existing W_VERIFICATION_TARGET_MISSING which
      only checks if a task's own claimed_paths are verified. This new rule
      checks literal file paths in command strings against the filesystem.

      Edge cases:
      - Paths inside quoted strings in python -c payloads should be extracted
      - Paths with glob wildcards (*.py) should be skipped (not literal)
      - pytest -k "expression" arguments are not file paths, skip them
    acceptance_criteria: >
      1. Command referencing `tests/cli/test_nonexistent.py` triggers
         E_VERIFICATION_TARGET_MISSING_FILE.
      2. Command referencing an existing test file does NOT trigger.
      3. Glob patterns like `tests/*.py` are NOT flagged.
      4. pytest -k "test_name" is NOT treated as a file path.
      5. Paths in checks[].command are also validated, not just top-level command.
    failure_path: >
      If regex produces false positives on complex shell commands, restrict
      extraction to the first token after pytest/python that looks like a path.
    verification:
      level: unit
      command: "pytest tests/ralph/test_rve1_missing_file.py -q"
      checks:
        - name: missing_file_detected
          command: "pytest tests/ralph/test_rve1_missing_file.py -q -k test_missing_file_error"
          required: true
        - name: existing_file_ok
          command: "pytest tests/ralph/test_rve1_missing_file.py -q -k test_existing_file_no_error"
          required: true
        - name: glob_not_flagged
          command: "pytest tests/ralph/test_rve1_missing_file.py -q -k test_glob_pattern_skipped"
          required: true
      covers:
        tasks: ["T2"]
        paths: ["src/cccc/ralph/filesystem_validator.py"]

  # ── T3: RVE-2 — suppress_flows field support ─────────────────────────
  - id: T3
    title: "RVE-2: Add suppress_flows for per-flow suppression of critical flow errors"
    role: leaf
    type: backend
    claimed_paths:
      - src/cccc/ralph/models.py
      - src/cccc/ralph/validator.py
      - tests/ralph/test_rve2_suppress_flows.py
    awareness_paths:
      - src/cccc/ralph/plan_io.py
    depends_on: []
    addresses: ["RVE-2"]
    goal_behavior: >
      1. In models.py Plan class, add field:
         suppress_flows: List[str] = Field(default_factory=list)
         This lists flow IDs whose E_CRITICAL_FLOW_UNCOVERED and
         E_CRITICAL_FLOW_ENTRYPOINT_UNOWNED errors should be suppressed.

      2. In validator.py _check_critical_coverage(): before emitting
         E_CRITICAL_FLOW_UNCOVERED for a flow, check if flow.id is in
         plan.suppress_flows. If so, skip (or demote to hint with
         "[suppress_flows] " prefix).

      3. Same for _check_critical_flow_entrypoint_ownership() or wherever
         E_CRITICAL_FLOW_ENTRYPOINT_UNOWNED is emitted for a specific flow.

      4. Validation: if suppress_flows contains an id that doesn't match
         any critical_flow (including repo defaults), emit
         W_SUPPRESS_FLOWS_UNKNOWN: "suppress_flows references unknown
         flow '{id}'".

      This allows plan authors to suppress irrelevant flows (e.g.
      daemon_startup when the plan only touches Ralph internals) while
      keeping detection active for the plan's own flows.
    acceptance_criteria: >
      1. Plan with suppress_flows: [daemon_startup] does NOT get
         E_CRITICAL_FLOW_UNCOVERED for daemon_startup.
      2. Same plan still gets E_CRITICAL_FLOW_UNCOVERED for other
         uncovered flows (e.g. cli_workflow if not suppressed).
      3. Plan's own declared flows are NOT affected by suppress_flows
         unless explicitly listed.
      4. Unknown flow ID in suppress_flows triggers W_SUPPRESS_FLOWS_UNKNOWN.
      5. Empty suppress_flows has no effect (backward compatible).
      6. Existing suppress_codes behavior unchanged.
    failure_path: >
      If the interaction between suppress_flows and suppress_codes is
      confusing, document precedence: suppress_codes takes effect first
      (global), suppress_flows is per-flow refinement.
    verification:
      level: unit
      command: "pytest tests/ralph/test_rve2_suppress_flows.py -q"
      checks:
        - name: flow_suppressed
          command: "pytest tests/ralph/test_rve2_suppress_flows.py -q -k test_suppress_specific_flow"
          required: true
        - name: other_flows_active
          command: "pytest tests/ralph/test_rve2_suppress_flows.py -q -k test_unsuppressed_flow_still_reported"
          required: true
        - name: unknown_flow_warning
          command: "pytest tests/ralph/test_rve2_suppress_flows.py -q -k test_unknown_flow_warning"
          required: true
      covers:
        tasks: ["T3"]
        paths: ["src/cccc/ralph/models.py", "src/cccc/ralph/validator.py"]
    provides:
      - name: suppress_flows_mechanism
        kind: runtime_capability
        schema_hint: "Plan.suppress_flows: List[str] — per-flow suppression"

  # ── T4: RVE-4 — W_COVERS_NOT_EXERCISED ──────────────────────────────
  - id: T4
    title: "RVE-4: Cross-check covers.tasks with actual check content"
    role: leaf
    type: backend
    claimed_paths:
      - src/cccc/ralph/validator.py
      - tests/ralph/test_rve4_covers_exercised.py
    awareness_paths:
      - src/cccc/ralph/models.py
    depends_on: []
    addresses: ["RVE-4"]
    goal_behavior: >
      Add _check_covers_exercised() to validator.py, called from
      _collect_structural_issues().

      For each task T that declares covers.tasks: [T_X, ...]:
      1. Look up T_X in the plan to get its claimed_paths and provides[].name.
      2. Scan T's checks[].command and goal_behavior text for references to
         T_X's claimed_paths (file path substrings) or provides[].name
         (symbol/artifact name substrings).
      3. If NONE of T_X's claimed_paths or provides names appear in any of
         T's checks or goal_behavior, emit W_COVERS_NOT_EXERCISED:
         "task '{T.id}' declares covers.tasks: ['{T_X}'] but its checks
         don't reference any of {T_X}'s claimed_paths or provides — the
         coverage claim may be unfounded".

      String matching: case-sensitive, substring match. For claimed_paths,
      match the filename portion (e.g. "validator.py" matches
      "src/cccc/ralph/validator.py"). For provides names, exact substring.
    acceptance_criteria: >
      1. T2 covers T1, T2's checks import T1's module name → no warning.
      2. T2 covers T1, T2's checks don't mention any of T1's files or
         provides → W_COVERS_NOT_EXERCISED.
      3. Matching on filename portion works (not just full path).
      4. Multiple covers.tasks — warning only for the unexercised ones.
      5. Empty provides on T_X — only check claimed_paths.
    failure_path: >
      If substring matching produces false positives (e.g. common filenames
      like "utils.py"), require at least the last two path segments to match.
    verification:
      level: unit
      command: "pytest tests/ralph/test_rve4_covers_exercised.py -q"
      checks:
        - name: unexercised_flagged
          command: "pytest tests/ralph/test_rve4_covers_exercised.py -q -k test_covers_no_reference_flagged"
          required: true
        - name: exercised_ok
          command: "pytest tests/ralph/test_rve4_covers_exercised.py -q -k test_covers_with_reference_ok"
          required: true
      covers:
        tasks: ["T4"]
        paths: ["src/cccc/ralph/validator.py"]

  # ── T5: RVE-8 — W_GOAL_HARDCODED_WITHOUT_AWARENESS ──────────────────
  - id: T5
    title: "RVE-8: Detect hardcoded values in goal_behavior without awareness_paths backing"
    role: leaf
    type: backend
    claimed_paths:
      - src/cccc/ralph/rules_advisory.py
      - tests/ralph/test_rve8_hardcoded_awareness.py
    awareness_paths:
      - src/cccc/ralph/workspace_index.py
    depends_on: []
    addresses: ["RVE-8"]
    goal_behavior: >
      Add check_goal_hardcoded_awareness(plan, workspace) to rules_advisory.py.
      Export it in __all__ and call it from validate_with_project() in
      validator.py (add the call alongside existing advisory rule calls).

      Detection logic:
      1. For each task with non-empty awareness_paths, scan goal_behavior for
         hardcoded patterns:
         - Hex literals: `0x[0-9A-Fa-f]{2,}`
         - Byte arrays: `\[0x[0-9A-Fa-f]+(?:\s*,\s*0x[0-9A-Fa-f]+)+\]`
         - Magic numbers: standalone integers > 255 (not line numbers)
         - API signatures with specific argument lists: `funcName(arg1, arg2, ...)`
      2. For each detected hardcoded value, scan the content of files listed
         in awareness_paths (via workspace) for the same value.
      3. If the value is NOT found in any awareness_paths file, emit
         W_GOAL_HARDCODED_WITHOUT_AWARENESS: "task '{id}' goal_behavior
         contains hardcoded value '{value}' not found in awareness_paths
         files — consider adding the source file to awareness_paths".

      The workspace_index should provide file content reading. If it doesn't
      already, use (project_root / path).read_text() with error handling.

      Noise control: skip values that appear in claimed_paths files (the task
      may be defining them). Only flag when awareness_paths is non-empty
      (tasks without awareness_paths have a different problem).
    acceptance_criteria: >
      1. goal_behavior with `writes [0xAB]`, awareness_paths files don't
         contain 0xAB → W_GOAL_HARDCODED_WITHOUT_AWARENESS.
      2. Same but awareness_paths file contains `0xAB` definition → no warning.
      3. Task with empty awareness_paths → no warning (different issue).
      4. Hardcoded value appears in claimed_paths file → no warning.
      5. Simple integers like line numbers (e.g. "line 42") not flagged.
    failure_path: >
      If reading awareness_paths files is too slow, limit to first 500 lines
      of each file. If false positive rate is high, restrict to hex/byte
      patterns only and skip magic numbers.
    verification:
      level: unit
      command: "pytest tests/ralph/test_rve8_hardcoded_awareness.py -q"
      checks:
        - name: hardcoded_not_in_awareness
          command: "pytest tests/ralph/test_rve8_hardcoded_awareness.py -q -k test_hex_not_in_awareness_flagged"
          required: true
        - name: hardcoded_in_awareness_ok
          command: "pytest tests/ralph/test_rve8_hardcoded_awareness.py -q -k test_hex_in_awareness_ok"
          required: true
      covers:
        tasks: ["T5"]
        paths: ["src/cccc/ralph/rules_advisory.py"]

  # ── T6: RVE-9 — W_AWARENESS_COVERAGE_GAP (semantic) ─────────────────
  - id: T6
    title: "RVE-9: Detect goal_behavior symbol references outside awareness_paths scope"
    role: leaf
    type: backend
    claimed_paths:
      - src/cccc/ralph/semantic_validator.py
      - tests/ralph/test_rve9_awareness_gap.py
    awareness_paths:
      - src/cccc/ralph/semantic_provider.py
      - src/cccc/ralph/models.py
    depends_on: []
    addresses: ["RVE-9"]
    goal_behavior: >
      Add awareness coverage check to semantic_validator.py, within
      validate_semantic() or as a separate function called from it.

      Logic (requires SemanticProvider):
      1. For each task, extract symbol-like references from goal_behavior:
         regex for PascalCase names (class names), snake_case with module
         prefix (e.g. `calc.add`), and explicit function references
         (e.g. `_sendControlCommand`).
      2. For each candidate symbol, use provider.find_symbol() or
         provider.symbol_exists() to locate its definition file.
      3. Check if the definition file is in the task's claimed_paths ∪
         awareness_paths.
      4. If not, emit W_AWARENESS_COVERAGE_GAP: "task '{id}' goal_behavior
         references '{symbol}' defined in '{file}' which is not in
         claimed_paths or awareness_paths".

      This only runs when --semantic is active (SemanticProvider available).
      Findings are severity "warning".

      Noise control:
      - Skip stdlib/third-party symbols (provider returns None for these)
      - Skip symbols already flagged by S_SYMBOL_TARGET_MISSING
      - Skip very common names (< 4 chars) to avoid false matches
    acceptance_criteria: >
      1. goal_behavior references `_sendControlCommand`, symbol is in
         ble_manager.dart not in awareness_paths → W_AWARENESS_COVERAGE_GAP.
      2. Symbol is in claimed_paths → no warning.
      3. Symbol is in awareness_paths → no warning.
      4. Symbol not found by provider (third-party) → no warning.
      5. Only triggers with --semantic flag.
    failure_path: >
      If symbol extraction from natural language text produces too many
      false positives, restrict to backtick-quoted identifiers only
      (e.g. `_sendControlCommand`).
    verification:
      level: unit
      command: "pytest tests/ralph/test_rve9_awareness_gap.py -q"
      checks:
        - name: gap_detected
          command: "pytest tests/ralph/test_rve9_awareness_gap.py -q -k test_symbol_outside_awareness_flagged"
          required: true
        - name: covered_symbol_ok
          command: "pytest tests/ralph/test_rve9_awareness_gap.py -q -k test_symbol_in_awareness_ok"
          required: true
      covers:
        tasks: ["T6"]
        paths: ["src/cccc/ralph/semantic_validator.py"]

  # ═══════════════════════════════════════════════════════════════════════
  # P3 — LOWER PRIORITY
  # ═══════════════════════════════════════════════════════════════════════

  # ── T7: RVE-3 — H_VERIFICATION_COMMAND_DEAD ─────────────────────────
  - id: T7
    title: "RVE-3: Hint when verification.command is dead weight alongside complete checks"
    role: leaf
    type: backend
    claimed_paths:
      - src/cccc/ralph/validator.py
      - tests/ralph/test_rve3_dead_command.py
    depends_on: []
    addresses: ["RVE-3"]
    goal_behavior: >
      Add logic to _collect_structural_issues() in validator.py (or a new
      helper _check_dead_verification_command()).

      For each task where:
      (a) verification.command is non-empty AND was skipped (complex shell,
          detected by presence of W_VERIFICATION_COMPLEX_SHELL_SKIPPED in
          existing checks — or re-detect: command contains && || ; | pipes)
      (b) verification.checks is non-empty and has at least one required check

      Emit H_VERIFICATION_COMMAND_DEAD (hint level): "task '{id}' has a
      complex verification.command that is skipped, but checks[] provides
      sufficient coverage — consider removing the dead command or moving
      its logic into a check".

      This is a hint, not a warning — purely advisory for plan hygiene.
    acceptance_criteria: >
      1. Task with `command: "cd x && pytest y && grep z"` plus 2 checks →
         H_VERIFICATION_COMMAND_DEAD.
      2. Task with simple command plus checks → no hint (command is usable).
      3. Task with complex command but NO checks → no hint (command is the
         only verification, already warned by other rules).
      4. Task with empty command → no hint.
    failure_path: >
      If "complex shell" detection overlaps badly with existing
      W_VERIFICATION_COMPLEX_SHELL_SKIPPED, reuse the same detection
      logic instead of re-implementing.
    verification:
      level: unit
      command: "pytest tests/ralph/test_rve3_dead_command.py -q"
      checks:
        - name: dead_command_hint
          command: "pytest tests/ralph/test_rve3_dead_command.py -q -k test_complex_command_with_checks_hints"
          required: true
        - name: simple_command_no_hint
          command: "pytest tests/ralph/test_rve3_dead_command.py -q -k test_simple_command_no_hint"
          required: true
      covers:
        tasks: ["T7"]
        paths: ["src/cccc/ralph/validator.py"]

  # ── T8: RVE-5 — H_INLINE_ASSERTIONS ─────────────────────────────────
  - id: T8
    title: "RVE-5: Hint when checks use python -c with inline assertions"
    role: leaf
    type: backend
    claimed_paths:
      - src/cccc/ralph/rules_advisory.py
      - tests/ralph/test_rve5_inline_assertions.py
    depends_on: []
    addresses: ["RVE-5"]
    goal_behavior: >
      Add check_inline_assertions(plan) to rules_advisory.py.
      Export in __all__ and call from validate_with_project() in validator.py.

      For each task's checks[].command, if the command matches pattern:
      `python\s+-c\s+["'].*assert.*["']` (case-insensitive), emit
      H_INLINE_ASSERTIONS (hint level): "task '{id}' check '{check.name}'
      uses inline python -c assertions — consider moving to a test file
      under tests/ for better visibility to coverage and AST tools".

      Only flag checks that contain `assert` in the python -c payload.
      Do NOT flag:
      - python -c with only imports (no assert)
      - pytest commands
      - shell assert (bash `test` / `[`)
    acceptance_criteria: >
      1. Check with `python -c "import calc; assert calc.add(2,3)==5"` →
         H_INLINE_ASSERTIONS.
      2. Check with `python -c "import calc"` → no hint.
      3. Check with `pytest tests/test_calc.py` → no hint.
      4. Multiple checks in one task, only the assert ones flagged.
    failure_path: >
      If regex matching is unreliable with nested quotes, use shlex.split()
      to extract the -c payload first, then check for assert.
    verification:
      level: unit
      command: "pytest tests/ralph/test_rve5_inline_assertions.py -q"
      checks:
        - name: inline_assert_flagged
          command: "pytest tests/ralph/test_rve5_inline_assertions.py -q -k test_python_c_assert_flagged"
          required: true
        - name: import_only_ok
          command: "pytest tests/ralph/test_rve5_inline_assertions.py -q -k test_python_c_import_only_ok"
          required: true
      covers:
        tasks: ["T8"]
        paths: ["src/cccc/ralph/rules_advisory.py"]

  # ── T9: RVE-6 — semantic mode recommendation ────────────────────────
  - id: T9
    title: "RVE-6: Show unchecked symbol count when --semantic is not used"
    role: leaf
    type: backend
    claimed_paths:
      - src/cccc/ralph/validator.py
      - src/cccc/ralph/cli.py
      - tests/ralph/test_rve6_semantic_recommendation.py
    awareness_paths:
      - src/cccc/ralph/models.py
    depends_on: []
    addresses: ["RVE-6"]
    goal_behavior: >
      Enhance the validate output when --semantic is NOT active but the
      plan has tasks with provides[] or goal_behavior containing symbol
      references.

      1. In validator.py validate_with_project(): when semantic_provider
         is None, count tasks that have provides[] with kind != "artifact"
         or goal_behavior containing backtick-quoted identifiers.
      2. If count > 0, add a hint H_SEMANTIC_UNCHECKED_SYMBOLS:
         "{count} tasks reference {symbol_count} symbols in goal_behavior
         or provides that were not semantically verified — run with
         --semantic to check symbol existence and references".
      3. In cli.py validate command output: show this hint prominently
         in the summary section (after errors/warnings count).

      This replaces the generic "run with --semantic" tip with specific,
      actionable information about what was missed.
    acceptance_criteria: >
      1. Plan with provides[kind=runtime_capability] task, no --semantic →
         H_SEMANTIC_UNCHECKED_SYMBOLS with correct count.
      2. Plan with no provides and no symbol refs → no hint.
      3. With --semantic → hint not emitted (symbols are being checked).
      4. Hint message includes specific task and symbol counts.
    failure_path: >
      If symbol extraction from goal_behavior is unreliable, fall back
      to only counting tasks with provides[] entries.
    verification:
      level: unit
      command: "pytest tests/ralph/test_rve6_semantic_recommendation.py -q"
      checks:
