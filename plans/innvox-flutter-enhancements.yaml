# Plan: INNVOX Flutter — Questionnaire + Voice Status + BLE Audio + Data Management
#
# Context: The INNVOX Flutter app needs four interconnected enhancements:
#   1. Questionnaire persistence + name input
#   2. Post-training voice status dialog (paired with pre-training Q4)
#   3. BLE raw audio recording during pre/post sampling phases → WAV
#   4. Training data management: store sessions (WAV+CSV+metadata), browse/delete/share as ZIP
#
# Project root: /Users/vfch/Documents/project/INNVOX-flutter
#
# These are additive features. Audio recording is best-effort — must never block training.
#
# Implementation order: 1A → 1B → 2A+2B (parallel) → 2C → 2D → 3A+3B (parallel)
#   → 3C → 3D → 3E → 4A → 4B+4C+4D (parallel) → 4E
#
# Codex review applied (2026-04-16):
#   - T2B: reset() EXISTS and must include new fields (plan incorrectly said "no reset")
#   - T2C: onFinish is VoidCallback, not async — need wrapper approach
#   - T2D: postVoiceStatus not available at save time (dialog is after save) — split into
#     initial save + post-dialog update. Also must be nullable for backward compat.
#     Added warmup_practice_new.dart to claimed_paths (goal_behavior modifies it).
#   - T3B: StreamControllers close in dispose() not _cleanup() (singleton lifecycle).
#     Added capture-mode gating flag to prevent 0xA2 collision with VoiceBlePacket.
#   - T3D: _finishSampling() is shared pre/post — pre audio stop must be in non-post branch only
#   - T4C: DataManagementPage has extensive dual-tab hardcoding beyond TabController length

plan_scope:
  - "lib/"
  - "INNVOX-debug/lib/"

critical_flows:
  - id: questionnaire-name-persistence
    description: >
      First launch → name input page → Q1–Q4 → relaunch → name page skipped,
      answers preserved. QuestionnaireService persists name and answers via
      SharedPreferences.
    entrypoints:
      - "lib/core/settings/questionnaire_service.dart"
      - "lib/pages/questionnaire_page.dart"
    required_verification_level: unit

  - id: training-voice-status-pair
    description: >
      Pre-training voice status read from Q4 → training runs → post-training
      dialog shown → both statuses saved to session record and detail JSON.
    entrypoints:
      - "lib/pages/training_v4/warmup_practice_new.dart"
      - "lib/core/warmup/warmup_session_service.dart"
      - "lib/core/history/warmup_training_history_store.dart"
    required_verification_level: integration

  - id: ble-audio-capture-lifecycle
    description: >
      Pre-sampling start → BLE 0x10 → audio chunks accumulate → BLE 0x11 →
      hardware sends 0x92 → WAV built. Same for post-sampling. Graceful
      degradation if hardware doesn't support audio.
    entrypoints:
      - "lib/core/bluetooth/bluetooth_service.dart"
      - "lib/pages/training_v4/warmup_practice_new.dart"
    required_verification_level: integration

  - id: session-save-and-share
    description: >
      After training completes: WAVs + CSV + metadata.json saved to session
      directory → DataManagementPage lists sessions → user selects → share as ZIP.
    entrypoints:
      - "lib/pages/training_v4/warmup_practice_new.dart"
      - "lib/pages/data_management_page.dart"
    required_verification_level: integration

forbidden_flows:
  - id: audio-failure-blocks-training
    description: >
      Audio capture failure must NEVER block or interrupt the training flow.
      All audio operations must be try/catch wrapped and best-effort.
    required_verification_level: unit

  - id: frame-type-collision-0xA0
    description: >
      A normal 58-byte VoiceBlePacket must NEVER be misidentified as a control
      event frame (0xA0). The 0xA0 dispatch must include a length==2 guard.
    required_verification_level: unit

  - id: frame-type-collision-0xA2
    description: >
      When audio capture is NOT active, a VoiceBlePacket whose first byte
      happens to be 0xA2 must NOT be routed to the audio stream. Frame dispatch
      for 0xA2 must be gated by a _isAudioCaptureActive flag.
    required_verification_level: unit

suppress_codes:
  - "E_CLAIMED_PATH_MISSING"      # New files don't exist yet (lib/core/audio/*, lib/widgets/*, lib/core/services/*)
  - "E_CRITICAL_FLOW_UNCOVERED"   # daemon_startup and cli_workflow are CCCC-specific default flows, not applicable to this Flutter project

finding_refs:
  - id: finding-1
    mitigation: "Verification commands test actual behavior, not just compilation"
    enforced_by: ["T3D-wire-audio", "T2C-wire-voice-status", "T4E-register-route"]
  - id: finding-2
    mitigation: "Tasks split by functional slice (not by file), integration tasks wire pieces together"
    enforced_by: ["T2C-wire-voice-status", "T3D-wire-audio", "T3E-session-csv"]
  - id: finding-9
    mitigation: "Phase 1 (questionnaire) is independently testable before Phase 2–4 build on it"
    enforced_by: ["T1A-questionnaire-name", "T1B-name-input-page"]
  - id: finding-6
    mitigation: "Verification at each task, not just final E2E"
    enforced_by: ["T1A-questionnaire-name", "T2A-voice-dialog", "T3A-audio-capture-infra", "T3C-training-audio-service"]

