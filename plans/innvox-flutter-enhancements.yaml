      (b) Move the voice dialog to fire BEFORE _finishPostSampling() saves,
          which requires restructuring the post-sampling flow.
      Option (a) is less invasive — T2C's onFinish handler calls an update
      method after the dialog returns.
      In warmup_practice_new.dart: update _saveSessionDetail() to include
      preTrainingVoiceStatus in saved JSON. Update _addWarmupHistoryRecord()
      to pass preVoiceStatus. Add post-dialog update for postVoiceStatus.
    acceptance_criteria: >
      WarmupTrainingSessionRecord includes nullable preVoiceStatus/postVoiceStatus
