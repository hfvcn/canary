  - id: T3B-ble-audio-frames
    title: "Extend bluetooth_service for audio frame dispatch + commands"
    role: leaf
    claimed_paths:
      - "lib/core/bluetooth/bluetooth_service.dart"
    depends_on: []
    goal_behavior: >
      Add constants: startRawAudioCommand=0x10, stopRawAudioCommand=0x11,
      mainDataControlEventFrameType=0xA0, rawAudioFrameType=0xA2.
      Add StreamControllers: _rawAudioController → rawAudioStream (List<int>),
      _audioControlEventController → audioControlEventStream (int).
      Modify _dataSubscription handler (~line 412): BEFORE the existing
      `if (value.length >= 45)` VoiceBlePacket parsing, add frame-type dispatch:
        if (value.length == 2 && value[0] == 0xA0) → _audioControlEventController.add(value[1])
        else if (value.length > 1 && value[0] == 0xA2) → _rawAudioController.add(value.sublist(1))
        else if (value.length >= 45) → existing VoiceBlePacket parsing
      CRITICAL: The length==2 check on 0xA0 prevents collision with normal
      58-byte packets whose first float byte might be 0xA0.
      Add methods: startAudioCapture() writes [0x10] to control characteristic,
      stopAudioCapture() writes [0x11] to control characteristic.
      LIFECYCLE: existing BLE service puts StreamController.close() in dispose()
      (line 498-504), NOT _cleanup(). _cleanup() is called on every disconnect
      and only cancels subscriptions. If new audio controllers are closed in
      _cleanup(), reconnection will fail because controllers can't be reopened.
      New audio StreamControllers MUST be closed in dispose() to match existing
      pattern. In _cleanup(): only cancel audio-related _subscriptions_ (not
      close controllers).
      0xA2 COLLISION RISK: The 0xA2 frame-type guard `value.length > 1 &&
      value[0] == 0xA2` could match a normal VoiceBlePacket if the first byte
      happens to be 0xA2. Add a capture-mode gating flag: only route to audio
      stream when _isAudioCaptureActive is true. When not capturing, fall
      through to normal packet parsing. This eliminates false dispatch.
    acceptance_criteria: >
      rawAudioStream and audioControlEventStream are publicly accessible.
      Frame dispatch correctly routes 0xA0 (len==2) to control events,
      0xA2 to audio chunks, and 45+ byte packets to VoiceBlePacket.
      startAudioCapture/stopAudioCapture write correct bytes to control char.
    verification:
      level: unit
      checks:
        - name: streams-exist
          command: >
            grep -q "rawAudioStream" lib/core/bluetooth/bluetooth_service.dart &&
            grep -q "audioControlEventStream" lib/core/bluetooth/bluetooth_service.dart
          required: true
        - name: frame-dispatch
          command: >
            grep -q "0xA0" lib/core/bluetooth/bluetooth_service.dart &&
            grep -q "0xA2" lib/core/bluetooth/bluetooth_service.dart &&
            grep -q "length == 2" lib/core/bluetooth/bluetooth_service.dart
          required: true
        - name: audio-commands
          command: >
            grep -q "startAudioCapture" lib/core/bluetooth/bluetooth_service.dart &&
            grep -q "stopAudioCapture" lib/core/bluetooth/bluetooth_service.dart &&
            grep -q "0x10" lib/core/bluetooth/bluetooth_service.dart &&
            grep -q "0x11" lib/core/bluetooth/bluetooth_service.dart
          required: true
        - name: capture-mode-gate
          command: >
            grep -q "_isAudioCaptureActive\|_audioCapturing\|_captureMode" lib/core/bluetooth/bluetooth_service.dart
          required: true
        - name: controllers-in-dispose-not-cleanup
          command: >
            cd /Users/vfch/Documents/project/INNVOX-flutter &&
            sed -n '/void dispose/,/^  [^ ]/p' lib/core/bluetooth/bluetooth_service.dart |
            grep -q "rawAudio\|audioControl"
          required: true
        - name: compile-check
          command: "cd /Users/vfch/Documents/project/INNVOX-flutter && dart analyze lib/core/bluetooth/bluetooth_service.dart --no-fatal-infos"
          required: true
      covers:
        flows: ["frame-type-collision-0xA0"]
    provides:
      - name: ble_audio_streams
        kind: runtime_capability
        schema_hint: "rawAudioStream: Stream<List<int>>, audioControlEventStream: Stream<int>, startAudioCapture(), stopAudioCapture()"

  - id: T3C-training-audio-service
    title: "Create TrainingAudioService (capture lifecycle manager)"
    role: leaf
    claimed_paths:
      - "lib/core/audio/training_audio_service.dart"
    depends_on:
      - "T3A-audio-capture-infra"
      - "T3B-ble-audio-frames"
    consumes:
      - name: wav_builder
        from: T3A-audio-capture-infra
      - name: ble_audio_streams
        from: T3B-ble-audio-frames
    goal_behavior: >
      Singleton that manages audio capture lifecycle. startCapture(): creates
      BleAudioCaptureBuffer, subscribes to rawAudioStream (append chunks) and
      audioControlEventStream (listen for 0x92 transferCompleted), calls
      startAudioCapture() on BLE service.
      stopAndGetWav(timeout: 10s): calls stopAudioCapture(), waits for 0x92
      event via Completer, then builds WAV. On timeout: builds WAV from
      available data (best-effort). On error: returns null.
      _cleanup(): cancel subscriptions, null out fields, reset state.
      All operations are best-effort — failures return null, never throw.
    acceptance_criteria: >
      TrainingAudioService().startCapture() begins capture.
      stopAndGetWav() returns Uint8List? WAV data. Timeout fallback works.
      Cleanup is thorough (no dangling subscriptions).
    verification:
      level: unit
      checks:
        - name: lifecycle-api
          command: >
            grep -q "startCapture" lib/core/audio/training_audio_service.dart &&
            grep -q "stopAndGetWav" lib/core/audio/training_audio_service.dart &&
            grep -q "Completer" lib/core/audio/training_audio_service.dart &&
            grep -q "_cleanup" lib/core/audio/training_audio_service.dart
          required: true
        - name: timeout-fallback
          command: >
            grep -q "timeout" lib/core/audio/training_audio_service.dart &&
            grep -q "hasData" lib/core/audio/training_audio_service.dart
          required: true
        - name: compile-check
          command: "cd /Users/vfch/Documents/project/INNVOX-flutter && dart analyze lib/core/audio/training_audio_service.dart --no-fatal-infos"
          required: true
    provides:
      - name: training_audio_lifecycle
        kind: runtime_capability
        schema_hint: "startCapture() → Future<void>, stopAndGetWav({Duration timeout}) → Future<Uint8List?>"

  - id: T3D-wire-audio
    title: "Wire audio capture into training pre/post sampling"
    role: integration
    claimed_paths:
      - "lib/pages/training_v4/warmup_practice_new.dart"
    awareness_paths:
