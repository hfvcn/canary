      5. UX-6: FlowEngine start+next cycle for solve flow

      Also run full pytest regression suite.
    acceptance_criteria: |
      1. All integration scenarios pass
      2. Full pytest run: 0 failures
    verification:
      level: integration
      checks:
        - name: test_v33_integration
          command: "python -m pytest tests/test_v33_integration.py -v"
