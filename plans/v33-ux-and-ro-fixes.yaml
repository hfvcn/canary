  # ── T5: UX-5 — ralph guide auto-generation ────────────────────────
  - id: T5
    title: "UX-5: Add ralph guide subcommand for auto-generating capability guide"
    role: leaf
    addresses: ["UX-5"]
    claimed_paths:
      - src/cccc/ralph/guide_generator.py
      - src/cccc/ralph/cli.py
      - tests/ralph/test_guide_generator.py
    depends_on: ["T3"]
    goal_behavior: |
      Create src/cccc/ralph/guide_generator.py with a generate_guide()
      function that:
      1. Extracts all fields from Plan, TaskSpec, Verification, ModuleSpec,
         CheckSpec, Contract, CriticalFlow, ForbiddenFlow Pydantic models
         using model_fields (field name, type, default, description)
      2. Collects all validation rule codes (W_*, E_*, H_*) from
         validation_rules/*.py and filesystem_validator.py by scanning
         for code= string literals in ValidationIssue constructions
      3. Extracts CLI subcommands and flags from cli.py main() by
         inspecting the argparse parser
      4. Formats all of this into a structured Markdown document with
         sections: "Plan Schema Fields", "Validation Rules Reference",
         "CLI Commands Reference"

      In cli.py, add "guide" subparser after sync-state (line 316):
        p_guide = sub.add_parser("guide", help="Auto-generate capability guide")
        p_guide.add_argument("--output", type=Path, default=None)

      Add dispatch in main() before the audit block (line 324), alongside
      other no-plan-file commands:
        if args.command == "guide":
            try:
                return _cmd_guide(args)
            except Exception as exc:
                _emit_error_envelope("guide", exc)
                return _EXIT_INTERNAL_ERROR

      _cmd_guide() calls generate_guide() and writes to --output or stdout.

      Reference: _cmd_show_schema() (line ~400) already extracts some model
      fields — reuse that approach but be comprehensive.
    acceptance_criteria: |
      1. ralph guide outputs Markdown with all Plan schema fields
      2. Output includes all W_*/E_* validation rule codes with descriptions
      3. Output includes all CLI subcommands and their flags
      4. ralph guide --output file.md writes to file
      5. Output matches current code state (no stale/missing fields)
      6. ModuleSpec, batch_e2e_command, provides/consumes all documented
    verification:
      level: unit
