          - src/cccc/ralph/cli.py

  # ══════════════════════════════════════════════════════════════════════
  # Batch 3 — ralph flow (largest feature, depends on batch 2)
  # ══════════════════════════════════════════════════════════════════════

  # ── T6: UX-6 core — flow engine + solve flow ─────────────────────
  - id: T6
    title: "UX-6 core: ralph flow engine with state management + solve flow"
    role: leaf
    addresses: ["UX-6"]
    claimed_paths:
      - src/cccc/ralph/flow_engine.py
      - tests/ralph/test_flow_engine.py
    depends_on: ["T5"]
    goal_behavior: |
      Create src/cccc/ralph/flow_engine.py implementing the progressive
      workflow guidance system described in UX-6 of the issue tracker.

      Core classes and functions:

      1. FlowState dataclass: flow_type, workspace, started_at,
         current_step, params (dict), steps_completed (list),
         steps_failed (dict). Serialize to/from .ralph-flow/state.json.

      2. StepSpec dataclass: number, name, description, instruction_text,
         check_fn (callable returning CheckResult).

      3. CheckResult dataclass: passed (bool), details (list of
         {check: str, passed: bool, message: str}).

      4. FlowEngine class:
         - __init__(workspace: Path)
         - start(flow_type: str, **params) → creates .ralph-flow/ dir,
           state.json, step output dirs. Returns step 1 instruction.
         - next() → loads state, runs check_fn for current step. If
           passed, advance current_step, return next instruction. If
           failed, return current step instruction + failure details.
         - state property → current FlowState

      5. SOLVE_STEPS: list of 7 StepSpec for the solve flow:
         Step 1 (understand): always pass (no checkable output)
         Step 2 (plan): check plan.yaml exists + ralph validate 0 errors
         Step 3 (codex-review): scan .ralph-flow/step-3-review/ for
           Codex JSON (SESSION_ID + agent_messages > 200 chars)
         Step 4 (gap-record): git diff on --tracker file has new lines
         Step 5 (codex-execute): scan .ralph-flow/step-5-execute/ for
           Codex JSON count ≥ ralph suggest batch task count
         Step 6 (verify): run --test-cmd, exit code = 0
         Step 7 (guide): --guide-output file exists + mtime > start +
           size > 1KB

      6. validate_codex_output(dir_path, min_content_length=200):
         shared validation for steps 3 and 5. Scans *.json files for
         SESSION_ID (valid UUID) + success=True + agent_messages length.

      Tests: test start creates state.json, test next advances on pass,
      test next stays on fail, test codex validation rejects non-codex
      output, test solve flow completes 7 steps.
    acceptance_criteria: |
      1. FlowEngine.start("solve") creates .ralph-flow/state.json
      2. FlowEngine.next() runs check for current step
      3. Step passes → advance and show next instruction
      4. Step fails → show current step instruction + failure details
      5. Codex steps reject output without SESSION_ID
      6. Optional params (tracker, guide_output) skip corresponding steps
      7. State persists across FlowEngine instances
    verification:
      level: unit
      checks:
        - name: test_flow_engine
          command: "python -m pytest tests/ralph/test_flow_engine.py -v"
          required: true
      covers:
        tasks: ["T6"]
        paths:
          - src/cccc/ralph/flow_engine.py

  # ── T7: UX-6 e2e — flow e2e steps + CLI wiring ───────────────────
  - id: T7
    title: "UX-6 e2e: E2E flow steps + ralph flow CLI subcommands"
    role: leaf
    addresses: ["UX-6"]
    claimed_paths:
      - src/cccc/ralph/flow_steps_e2e.py
      - src/cccc/ralph/cli.py
      - tests/ralph/test_flow_e2e.py
    depends_on: ["T6"]
    goal_behavior: |
      1. Create src/cccc/ralph/flow_steps_e2e.py with E2E_STEPS list
         (7 StepSpec for the e2e flow):
         Step 0 (code-verify): run pytest, check "0 failed"; ralph validate smoke
         Step 1 (env-prepare): workspace exists + docs/ files exist +
           cccc daemon status=running + cccc actor list has planner
         Step 2 (task-submit): cccc tail has chat.message to planner
         Step 3 (monitor-wait): cccc workflow status tasks.completed=total
         Step 4 (codex-review): .ralph-flow/step-4-review/ has ≥2 codex
           outputs + WORKFLOW_EVALUATION.md exists and >500 bytes
         Step 5 (report-synthesize): e2e report file exists with
           "评分摘要" and "交叉验证" strings
         Step 6 (improvement-register): git diff shows changes in both
           问题清单 short and full versions + 版本历史评分 has new line

      2. Wire CLI in cli.py. Add "flow" subparser alongside existing
         no-plan commands (guide, audit, sync-state). Place the subparser
         after the guide subparser added by T5:

         p_flow = sub.add_parser("flow", help="Progressive workflow guidance")
         flow_sub = p_flow.add_subparsers(dest="flow_command")
         p_flow_start = flow_sub.add_parser("start")
         p_flow_start.add_argument("flow_type", choices=["solve", "e2e"])
         p_flow_start.add_argument("--workspace", type=Path, required=True)
         p_flow_start.add_argument("--test-cmd", default="pytest")
         p_flow_start.add_argument("--tracker", type=Path, default=None)
         p_flow_start.add_argument("--guide-output", type=Path, default=None)
         p_flow_start.add_argument("--group", type=str, default=None)
         p_flow_start.add_argument("--cccc-root", type=Path, default=None)
         p_flow_start.add_argument("--version", type=str, default=None)
         p_flow_next = flow_sub.add_parser("next")
         p_flow_next.add_argument("--workspace", type=Path, default=Path("."))

         Add dispatch in main() alongside guide/audit/sync-state (all are
         no-plan-file commands):
           if args.command == "flow":
               try:
                   return _cmd_flow(args)
               except Exception as exc:
                   _emit_error_envelope("flow", exc)
                   return _EXIT_INTERNAL_ERROR

         _cmd_flow() creates FlowEngine(workspace) and dispatches to
         start() or next() based on flow_command.
    acceptance_criteria: |
      1. ralph flow start e2e --workspace /tmp/test creates state.json
      2. E2E flow has 7 steps (0-6) with correct validation logic
      3. CLI subcommands parse correctly
      4. ralph flow next works for both solve and e2e flow types
      5. E2E step 4 requires ≥2 Codex outputs (result + process review)
      6. Flow state persists across invocations
    verification:
      level: unit
      checks:
        - name: test_flow_e2e
          command: "python -m pytest tests/ralph/test_flow_e2e.py -v"
          required: true
        - name: test_flow_cli_parse
          command: "ralph flow --help 2>&1 | head -3"
          required: true
      covers:
        tasks: ["T7"]
        paths:
          - src/cccc/ralph/flow_steps_e2e.py
          - src/cccc/ralph/cli.py

