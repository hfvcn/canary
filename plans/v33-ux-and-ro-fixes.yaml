    title: "Integration: full regression + new feature verification"
    role: integration
    addresses: ["RO-80", "RO-81", "UX-1", "UX-2", "UX-4", "UX-5", "UX-6"]
    claimed_paths:
      - tests/test_v33_integration.py
    depends_on: ["T1", "T2", "T3", "T4", "T5", "T6", "T7"]
