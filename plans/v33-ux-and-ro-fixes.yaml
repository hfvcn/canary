          - challenge_fail_closed
          - multi_upstream_io_contract
          - hint_deduplication
          - guide_auto_generation
          - flow_progressive_guidance

# ── Critical flows ─────────────────────────────────────────────────────
critical_flows:
  - id: challenge_fail_closed
    description: >
      Challenge mode + agent infrastructure failure → overall_outcome="failed"
      instead of degrading to worker-only "passed".
    entrypoints:
      - src/cccc/daemon/foreman/ralph_service.py::_verify_completion_with_challenge
    required_verification_level: unit

  - id: multi_upstream_io_contract
    description: >
      Task C depends on A+B, both provide expected_output keys that
      collectively satisfy C's expected_input → no false W_CROSS_TASK_IO_MISMATCH.
    entrypoints:
      - src/cccc/ralph/validation_rules/contracts.py::_check_cross_task_io_contracts
    required_verification_level: unit

  - id: hint_deduplication
    description: >
      Same-code hints appearing >3 times → grouped into single summary line
      with count and affected task list.
    entrypoints:
      - src/cccc/ralph/cli.py::_print_validation_text
    required_verification_level: unit

  - id: guide_auto_generation
    description: >
      ralph guide → generates complete capability guide from Pydantic
      models, validation rules, and CLI parser.
    entrypoints:
      - src/cccc/ralph/guide_generator.py::generate_guide
      - src/cccc/ralph/cli.py::main
    required_verification_level: unit

  - id: flow_progressive_guidance
    description: >
      ralph flow start solve → creates state → ralph flow next checks
      step output → advances or fails with details.
    entrypoints:
      - src/cccc/ralph/flow_engine.py::FlowEngine
      - src/cccc/ralph/cli.py::main
    required_verification_level: unit

# ── Forbidden flows ────────────────────────────────────────────────────
forbidden_flows:
  - id: challenge_fail_open
    description: >
      Challenge mode must NOT return "passed" when agent infrastructure is
      unavailable. The RO-80 gap is the forbidden pattern.
    test_created_by: ["T1"]
    required_verification_level: unit

  - id: multi_upstream_false_positive
    description: >
      Cross-task IO validation must NOT report W_CROSS_TASK_IO_MISMATCH when
      multiple upstream tasks collectively provide all required keys.
    test_created_by: ["T2"]
    required_verification_level: unit

# ── State ──────────────────────────────────────────────────────────────
state:
  completed_task_ids:
    - T-int
    - T7
    - T6
    - T5
    - T4
    - T3
    - T2
    - T1
  running_tasks: []
  failed_task_ids: []
