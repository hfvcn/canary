tasks:
  # ══════════════════════════════════════════════════════════════════════
  # Batch 1 — independent leaf fixes (all parallelizable)
  # ══════════════════════════════════════════════════════════════════════

  # ── T1: RO-80 — challenge verification fail-closed ────────────────
  - id: T1
    title: "RO-80: Challenge mode returns failed when agent infrastructure is unavailable"
    role: leaf
    addresses: ["RO-80"]
    claimed_paths:
      - src/cccc/daemon/foreman/ralph_service.py
      - tests/test_challenge_degradation.py
    depends_on: []
    goal_behavior: |
      In ralph_service.py _verify_completion_with_challenge() (line 797),
      when _agent_dependency_error_detail(agent_result) returns non-None
      (lines 822-828), the code currently returns worker_result (passed)
      with a W_CHALLENGE_DEGRADED warning appended. This is fail-open.

      Fix: change lines 822-828 so that instead of returning
      worker_result.model_copy(update={"warnings": warnings}), it returns
      a new VerificationResult with overall_outcome="failed" and a summary
      indicating infrastructure failure. Keep the W_CHALLENGE_DEGRADED
      warning in the warnings list. Also preserve challenge_outcome="" to
      indicate the agent didn't produce a judgment.

      The existing _failed_agent_verification() method (line 1147) already
      returns outcome="failed" for agent mode exceptions — challenge mode
      should have consistent behavior.

      Update test_challenge_degradation.py:
      - test_challenge_degrades_on_gemini_network_error (line 48):
        change assert from overall_outcome == "passed" to "failed".
        Also assert challenge_outcome="" and checks still contain
        worker-check only (agent checks not available).
      - test_challenge_degradation_warning_is_in_verification_result (line 97):
        verify warning is still present when outcome is "failed"
      - Add test_challenge_infrastructure_failure_is_fail_closed: verify
        RuntimeError, OSError, TimeoutExpired all produce "failed"
    acceptance_criteria: |
      1. Challenge mode returns overall_outcome="failed" when Gemini is unavailable
      2. W_CHALLENGE_DEGRADED warning is still present in result.warnings
      3. challenge_outcome="" when agent didn't produce a judgment
      4. Agent mode behavior unchanged (already fails correctly)
      5. Genuine agent judgment failures still produce "failed" (unchanged)
      6. Worker-only verification still works when verification_mode="ralph"
    verification:
      level: unit
      checks:
        - name: test_challenge_degradation
          command: "python -m pytest tests/test_challenge_degradation.py -v"
          required: true
      covers:
        tasks: ["T1"]
        paths:
          - src/cccc/daemon/foreman/ralph_service.py

  # ── T2: RO-81 — cross-task IO contracts multi-upstream fix ────────
  - id: T2
    title: "RO-81: Collect union of upstream expected_output keys before comparison"
    role: leaf
    addresses: ["RO-81"]
    claimed_paths:
      - src/cccc/ralph/validation_rules/contracts.py
      - tests/ralph/test_contract_schema_validation.py
    depends_on: []
    goal_behavior: |
      In contracts.py _check_cross_task_io_contracts() (lines 301-331),
      the current logic iterates over each dep_id and individually compares
      input_keys - output_keys. When task C depends on both A and B, and
      C's expected_input requires keys from both A and B, the function
      falsely reports W_CROSS_TASK_IO_MISMATCH for each dep that doesn't
      provide ALL keys.

      Fix: restructure the loop to first collect the union of all upstream
      expected_output keys, then compare once:

        upstream_keys = set()
        has_any_upstream_output = False
        for dep_id in task.depends_on:
            dep = task_map.get(dep_id)
            if dep and dep.expected_output:
                has_any_upstream_output = True
                upstream_keys.update(dep.expected_output.keys())
        if not has_any_upstream_output:
            continue
        missing = input_keys - upstream_keys
        if missing:
            issues.append(...)  # single warning with all missing keys

      Add tests in test_contract_schema_validation.py:
      - test_cross_task_io_multi_upstream_collective: C depends on A+B,
        A provides key_a, B provides key_b, C expects both → no warning
      - test_cross_task_io_multi_upstream_missing: C expects key_c not in
        A or B → warning with missing key_c
      - test_cross_task_io_single_upstream: existing 1:1 behavior preserved
    acceptance_criteria: |
      1. No W_CROSS_TASK_IO_MISMATCH when multiple upstreams collectively
         provide all expected_input keys
      2. W_CROSS_TASK_IO_MISMATCH still emitted when keys are genuinely missing
         across all upstreams
      3. Single-dependency behavior unchanged
      4. Warning message includes all missing keys and the consumer task ID
    verification:
      level: unit
      checks:
        - name: test_cross_task_io
          command: "python -m pytest tests/ralph/test_contract_schema_validation.py -v -k 'cross_task_io'"
          required: true
      covers:
        tasks: ["T2"]
        paths:
          - src/cccc/ralph/validation_rules/contracts.py

  # ── T3: UX-2 — hint deduplication in validation output ────────────
  - id: T3
    title: "UX-2: Group repeated same-code hints in validation output"
    role: leaf
    addresses: ["UX-2"]
    claimed_paths:
      - src/cccc/ralph/cli.py
      - tests/ralph/test_ralph_standalone.py
    depends_on: []
    goal_behavior: |
      In cli.py _print_validation_text() (lines 1173-1233), the non-compact
      mode prints every hint individually (lines 1224-1227). When a plan has
      many tasks with unrecognized verification shapes, W_VERIFICATION_SHAPE_UNKNOWN
      appears 12+ times, drowning out actionable items.

      Fix: add a _group_repeated_issues() helper that groups issues sharing
      the same code when count > 3. For grouped issues, print one summary
      line: "  W_VERIFICATION_SHAPE_UNKNOWN (×12): verification shape not
      recognized for static precheck [T1, T2, T3, ...]" instead of 12
      individual lines.

      Apply this grouping to the hints section in _print_validation_text().
      Do NOT apply to errors (always show individually). Optionally apply
      to warnings if count > 5.

      Implementation in _print_validation_text() around line 1224:
        grouped_hints = _group_repeated_issues(report.hints, threshold=3)
        print(f"\nHints ({len(report.hints)}):")
        for entry in grouped_hints:
            if entry.is_group:
                _print_grouped_issue(entry)
            else:
                _print_issue(entry.issue)

      Add test named test_group_hint_deduplication_in_validation_text:
      create a ValidationReport with 10 hints all having code
      W_VERIFICATION_SHAPE_UNKNOWN, call _print_validation_text, capture
      stdout and verify ≤2 W_VERIFICATION_SHAPE_UNKNOWN lines appear
      (1 grouped line + possibly 1 count line).
    acceptance_criteria: |
      1. Hints with same code appearing >3 times are grouped into one summary line
      2. Summary line shows count and affected task IDs
      3. Hints appearing ≤3 times still show individually
      4. Errors always show individually (never grouped)
      5. JSON format output unchanged (grouping is display-only)
      6. --compact mode unchanged
    verification:
      level: unit
      checks:
        - name: test_hint_grouping
          command: "python -m pytest tests/ralph/test_ralph_standalone.py -v -k 'group_hint_deduplication'"
          required: true
      covers:
        tasks: ["T3"]
        paths:
          - src/cccc/ralph/cli.py

  # ── T4: UX-1+UX-4 — template + capability guide documentation ────
  - id: T4
    title: "UX-1+UX-4: Full-field plan template + capability guide alignment"
    role: leaf
    addresses: ["UX-1", "UX-4"]
    claimed_paths:
      - plans/_template.yaml
      - docs/foreman-capability-guide.md
    depends_on: []
    goal_behavior: |
      Two documentation improvements (zero code risk):

      1. Update plans/_template.yaml:
         The template already has good field documentation in comments.
         Add UNCOMMENTED examples for:
         - batch_e2e_command (top-level, string, shell command)
         - batch_e2e_timeout (top-level, int, default 300)
         - provides with full {name, kind, schema_hint} format (not string)
         - consumes with {name, from, kind} format
         - module_spec (modules field on TaskSpec with id, description,
           input_spec, output_spec, internal_depends_on)
         - expected_input / expected_output (Dict[str, Any])
         - suppress_instances with code/owner/expiry/review_after
         - verification.checks with multiple CheckSpec entries
         Make it clear which format is required vs optional.

      2. Update docs/foreman-capability-guide.md:
         - Add "Plan Schema Quick Reference" section pointing to template
         - Add provides/consumes complete examples matching the schema
           (must use {name, kind} object format, NOT string format)
         - Add batch_e2e_command explanation and example
         - Add module_spec explanation
         - Fix any references to "mode" that should be "level" in
           verification context
         - Add suppress_codes common list with one-line explanations
    acceptance_criteria: |
      1. plans/_template.yaml includes all Plan schema fields with examples
      2. docs/foreman-capability-guide.md provides/consumes examples match schema
      3. batch_e2e_command documented in both template and guide
      4. No "mode" vs "level" inconsistency in verification context
      5. Template is valid YAML parseable by PyYAML
    verification:
      level: compile
      checks:
        - name: template-parseable
          command: "python -c \"from pathlib import Path; import yaml; yaml.safe_load(Path('plans/_template.yaml').read_text(encoding='utf-8')); print('parse ok')\""
          required: true
        - name: guide-exists
          command: "test -s docs/foreman-capability-guide.md"
          required: true

  # ══════════════════════════════════════════════════════════════════════
