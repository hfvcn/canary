      Integration test covering all v33 features:
      1. RO-80: challenge mode + OSError → overall_outcome="failed"
      2. RO-81: plan with 3 tasks, C depends on A+B, A provides key_a,
         B provides key_b, C expects both → 0 W_CROSS_TASK_IO_MISMATCH
