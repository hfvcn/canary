# ============================================================================
# Plan-level full-field examples（未注释，可按需改值或删除）
# ============================================================================

# --- 批次完成后的计划级 E2E 验证 ---
batch_e2e_command: "python -m pytest tests/e2e/test_workflow.py -v"
batch_e2e_timeout: 300

# --- 带 lease 的精细抑制；优先用于需要 owner/expiry/review_after 的抑制 ---
suppress_instances:
  - code: W_AGENT_REVIEW_SKIPPED
    owner: "foreman-docs"
    expiry: "2026-12-31"
    review_after: "2026-06-30"
