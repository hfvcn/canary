  # ════════════════════════════════════════════
  # Wave 3 — daemon plumbing (depends T0a, T0b)
  # ════════════════════════════════════════════

  - id: T3-plan-context-threading
    title: "Daemon: thread plan_path through orchestrator + RalphService PlanContext (no caching)"
    role: leaf
    depends_on: [T0a-engine-projection, T0b-handler-contract, T1b-plan-loader-ux]
    addresses: [RARCH-3, RBOUND-1]
    claimed_paths:
      - src/cccc/daemon/foreman/ralph_service.py
      - src/cccc/daemon/foreman/workflow_orchestrator.py
      - src/cccc/daemon/ralph_ipc_handler.py
      - src/cccc/ralph/plan_io.py
    awareness_paths:
      - src/cccc/cli/workflow_cmds.py
      - src/cccc/contracts/v1/ralph_ipc.py
      - src/cccc/ralph/serena_adapter.py
      - src/cccc/ralph/models.py
      - src/cccc/daemon/foreman/runtime_plan.py
    semantic:
      mode: strict
      targets:
        - path: src/cccc/daemon/foreman/ralph_service.py
          symbol: RalphService
          op: modify_interface
        - path: src/cccc/daemon/foreman/workflow_orchestrator.py
          symbol: register_and_suggest
          op: modify_body
    goal_behavior: |
      Codex F2 / ST1 + Codex v2 ST-new-2 (live disk drift): v1 cached the loaded
      Plan inside PlanContext (drift). v2 reloaded from disk every call (live
      drift / partial-write race). v3 splits the difference: PlanContext PINS
      the plan source bytes at register time, then re-parses from those bytes
      on each call. The disk file is read exactly once at register; subsequent
      runtime_plan() calls operate on the pinned source. This:
        - eliminates engine ↔ disk race conditions during a workflow
        - guarantees reproducibility of semantic decisions for a given workflow
        - explicitly REJECTS hot-reload of plan files mid-workflow (caller must
          re-register if they want to update)

      Required changes:

      1. RalphService gains a PlanContext registry:

           @dataclass
           class PlanContext:
               plan_path: Path                       # absolute, for audit only
               plan_source: bytes                    # immutable snapshot at register
               plan_digest: str                      # sha256 of plan_source
               registered_at: float                  # epoch seconds
               semantic_provider: SemanticProvider | None
               semantic_failure_reason: str | None   # set when provider init fails
               workflow_id: str

               def runtime_plan(self, engine) -> Plan:
                   """Re-parse the pinned source + apply engine projection.

                   MUST use the canonical loader (load_plan_from_bytes) so that
                   _merge_repo_defaults() applies .cccc/ralph.yaml constraints
                   identically to the initial smoke-test load. Using raw
                   yaml.safe_load + model_validate would produce a weaker Plan
                   that silently drops critical_flows, critical_entrypoints, and
                   registration_invariants from repo defaults — causing verify /
                   suggest to operate on a different constraint set than the
                   one that passed validation.
                   """
                   from cccc.ralph.plan_io import load_plan_from_bytes
                   from cccc.daemon.foreman.runtime_plan import project_engine_state
                   plan = load_plan_from_bytes(self.plan_source, source_path=self.plan_path)
                   return project_engine_state(plan, list(engine.list_tasks()), self.workflow_id)

         T3 must ADD `load_plan_from_bytes(source: bytes, source_path: Path) -> Plan`
         to src/cccc/ralph/plan_io.py. This function must reuse the full load_plan
         pipeline (including _tag_initial_plan_provenance + _merge_repo_defaults)
         but read from a bytes buffer rather than disk. Implementation sketch:

           def load_plan_from_bytes(source: bytes, source_path: Path) -> Plan:
               import io, yaml
               raw = yaml.safe_load(io.BytesIO(source)) or {}
               plan = Plan.model_validate(raw)
               _tag_initial_plan_provenance(plan, source_path)
               _merge_repo_defaults(plan, source_path.parent)
               return plan

         If _tag_initial_plan_provenance or _merge_repo_defaults are private and
         cannot be reused directly, refactor them to accept a Plan + root_path
         so both load_plan and load_plan_from_bytes share the same logic.

         RalphService methods:
           self._plan_contexts: Dict[str, PlanContext] = {}   # workflow_id -> ctx

           register_plan_context(workflow_id, plan_path: Path | str) -> None
             - Resolves plan_path to absolute, asserts file exists.
             - Reads the file bytes ONCE (open(plan_path, 'rb').read()).
             - Computes sha256 digest.
             - Calls plan_io.load_plan(plan_path) once eagerly as a fail-fast
               smoke test (the loaded Plan is DISCARDED — verification only).
             - Best-effort builds a SemanticProvider via the same pattern
               ralph/cli.py uses.
             - Stores PlanContext(plan_path=..., plan_source=..., plan_digest=...,
               registered_at=time(), semantic_provider=..., workflow_id=workflow_id).

           get_plan_context(workflow_id) -> PlanContext | None
             Returns stored context or None.

         CRITICAL Codex v2 ST-new-1 (host consistency): runtime_plan is a method
         of PlanContext, NOT RalphService. Callers in T4 / T5 always do:
           ctx = self.ralph.get_plan_context(workflow_id)
           if ctx is not None:
               runtime = ctx.runtime_plan(self.engine)
         Never `self.ralph.runtime_plan(workflow_id, engine)` — that signature
         does NOT exist. T3 must NOT add a duplicate runtime_plan on RalphService.

         CRITICAL Codex F2: there is NO Plan instance caching. Plan source bytes
         are pinned but the Plan object is reconstructed on every call so engine
         state projection is fresh. Mutating the plan file on disk after register
         does NOT affect runtime_plan() output (pinning semantic). Caller must
         call register_plan_context again to refresh.

      2. WorkflowOrchestrator.register_and_suggest:
         Already accepts plan_path kwarg. After storing in workflow_data, ALSO
         call self.ralph.register_plan_context(workflow_id, plan_path).
         This task does NOT change suggest_ready_batch or verify_completion
         behavior — only adds the registration call.

      3. ralph_ipc_handler.handle_ralph_register_and_suggest (Codex v2 F-new-1):
         Already passes plan_path to orchestrator.register_and_suggest. ALSO must
         forward validation_errors / validation_warnings / validation_hints from
         the orchestrator return value into DaemonResponse.result. Today the
         handler explicitly constructs result with only
         {workflow_id, registered_count, submitted_count, ready_task_ids}; T3
         must extend that dict construction to include the new fields when
         orchestrator returns them. The fields default to empty lists for
         backward compat (callers that don't read them are unaffected).

         Pseudocode (Codex v3 F-v3-1 — typed validation at the boundary):
           from cccc.contracts.v1.ralph_ipc import RalphRegisterResponse, IpcValidationError
           orch_result = orchestrator.register_and_suggest(...)
           # Convert raw issue dicts to typed IpcValidationError instances first.
           # Any shape drift here raises ValidationError instead of passing through.
           typed_errors = [IpcValidationError(**i) for i in orch_result.get("validation_errors", [])]
           typed_warnings = [IpcValidationError(**i) for i in orch_result.get("validation_warnings", [])]
           typed_hints = [IpcValidationError(**i) for i in orch_result.get("validation_hints", [])]
           response = RalphRegisterResponse(
               workflow_id=str(args["workflow_id"]),
               registered_count=int(orch_result["registered"]),
               submitted_count=int(orch_result["submitted"]),
               ready_task_ids=list(orch_result["ready_task_ids"]),
               validation_errors=typed_errors,
               validation_warnings=typed_warnings,
               validation_hints=typed_hints,
               plan_validation_failed_event_emitted=bool(
                   orch_result.get("plan_validation_failed_event_emitted", False)),
           )
           return DaemonResponse(ok=True, result=response.model_dump())

         Note: T5 is the PRODUCER of these fields (it runs validate at register
         time and stuffs the lists into orchestrator's return dict). T3 only
         plumbs the field forwarding so the producer has somewhere to put them.
         The forwarding default of [] keeps T3's backward-compat invariant.

      Backward compat:
        - When workflow submit --tasks is used (no plan_path), register_plan_context
          is not called; runtime_plan() returns None; legacy paths run unchanged.
        - All existing tests that monkeypatch suggest_ready_batch / verify_completion
          continue to work because we are NOT yet changing those methods.
    acceptance_criteria: |
      RalphService has register_plan_context(workflow_id, plan_path) and
      get_plan_context(workflow_id) methods. RalphService does NOT have a
      runtime_plan method (host consistency — Codex v2 ST-new-1).
      PlanContext is a dataclass with plan_path, plan_source (bytes),
      plan_digest, registered_at, semantic_provider, workflow_id, and a
      runtime_plan(engine) method.
      register_plan_context reads the plan file bytes ONCE, computes sha256,
      runs load_plan once for fail-fast validation (then discards the Plan
      object), and stores the bytes.
      ctx.runtime_plan(engine) calls plan_io.load_plan_from_bytes (NOT yaml.safe_load
      directly) so repo defaults from .cccc/ralph.yaml are applied identically to
      the initial smoke-test load. The Plan object is fresh on every call;
      the source bytes are pinned.
      plan_io.load_plan_from_bytes exists and applies _merge_repo_defaults.
      Mutating the plan file on disk AFTER register does NOT affect
      ctx.runtime_plan() output (pinning semantic — Codex v2 ST-new-2).
      WorkflowOrchestrator.register_and_suggest, when called with plan_path,
      invokes RalphService.register_plan_context exactly once.
      RalphService.suggest_ready_batch and RalphService.verify_completion
      behavior is byte-identical to before (no change in this task).
      ralph_ipc_handler.handle_ralph_register_and_suggest forwards
      validation_errors / validation_warnings / validation_hints from the
      orchestrator return value into DaemonResponse.result (defaults to []).
      Existing tests/test_foreman_workflow.py tests pass without modification.
    verification:
      level: integration
      checks:
        - name: import-and-attrs
          command: 'python -c "from cccc.daemon.foreman.ralph_service import RalphService; assert hasattr(RalphService, ''register_plan_context''); assert hasattr(RalphService, ''get_plan_context''); assert not hasattr(RalphService, ''runtime_plan''), ''runtime_plan must live on PlanContext, not RalphService''; print(''PASS'')"'
          required: true
        - name: pinned-source-not-cached-plan
          command: "python -m pytest tests/test_foreman_workflow.py -k plan_context -v --tb=short"
          required: true
        - name: regression-tests
          command: "python -m pytest tests/test_foreman_workflow.py tests/test_workflow_state.py -v --tb=short -x"
          required: true
      covers:
        tasks: [T3-plan-context-threading]
        flows: [no-stripped-semantic-data, no-cached-plan-instance]
    consumes:
      - name: engine_to_plan_projection
        kind: artifact
      - name: ipc_validation_error_contract
        kind: artifact
    provides:
      - name: ralph_plan_context
        kind: artifact
    failure_path: |
      If Serena adapter cannot be imported in daemon context (different deps):
        - If plan.semantic_mode is NOT "strict" (or plan has no semantic targets):
          log a warning and store PlanContext with semantic_provider=None.
          Downstream T4/T5 handle the None case gracefully (T5 will skip pre-state
          capture and auto-label per the GUARD in section F).
        - If plan.semantic_mode == "strict": register_plan_context MUST store
          PlanContext with semantic_provider=None AND set
          semantic_failure_reason: str on PlanContext (e.g. "SerenaAdapterImportError").
          T5's register_and_suggest detects this via ctx.semantic_failure_reason
          and adds an IpcValidationError(code="E_SEMANTIC_PROVIDER_UNAVAILABLE",
          severity="error", message=...) to validation_errors — this triggers the
          fatal-code hard-fail path (Fix 3), preventing the workflow from silently
          proceeding with all Phase 4 capabilities offline.

      This prevents the scenario where plan.semantic_mode="strict" workflows appear
      to succeed while gate/prompt/consistency/metrics have all silently failed.

  # ════════════════════════════════════════════
  # Wave 4 — service delegation (depends T2 + T3)
  # ════════════════════════════════════════════

  - id: T4-service-delegate
    title: "RalphService.suggest/verify delegate to ralph.core via runtime_plan; emit consistency_report + recommended_tests"
    role: integration
    depends_on: [T2-validator-cleanup, T3-plan-context-threading]
    addresses: [RARCH-1, RARCH-2, RARCH-4]
    claimed_paths:
      - src/cccc/daemon/foreman/ralph_service.py
      - src/cccc/contracts/v1/ralph_ipc.py
    awareness_paths:
      - src/cccc/ralph/core.py
      - src/cccc/ralph/semantic_validator.py
      - src/cccc/ralph/models.py
      - src/cccc/daemon/foreman/runtime_plan.py
      # semantic_metrics.py intentionally NOT in awareness_paths to avoid
      # spurious flow ownership; T4 reads compute_gate_readiness via the
      # public API only.
    semantic:
      mode: strict
      targets:
        - path: src/cccc/daemon/foreman/ralph_service.py
          symbol: suggest_ready_batch
          op: modify_body
        - path: src/cccc/daemon/foreman/ralph_service.py
          symbol: verify_completion
          op: modify_body
        - path: src/cccc/contracts/v1/ralph_ipc.py
          symbol: VerificationResult
          op: modify_interface
    goal_behavior: |
      Codex F1 fix: now that T0a's projection contract exists and T3's PlanContext
      provides ctx.runtime_plan(engine), T4 can safely delegate.

      Codex v2 F-new-2 fix: VerificationResult is extra="forbid" so consistency_report
      and recommended_tests have nowhere to land. T4 extends VerificationResult.

      Codex v2 ST-new-3 fix (semantic-gate liveness): T4 commits to wiring
      _resolve_auto_gate now — no follow-up.

      RARCH-1 — suggest delegation:
        ctx = self.get_plan_context(workflow_id)
        if ctx is None:
            return self._legacy_suggest_ready_batch(tasks, ...)   # rename current body

        runtime = ctx.runtime_plan(self.workflow_engine)
        # runtime is a fresh Plan with state correctly projected per T0a contract.
        # ASSIGNED/BLOCKED/DEFERRED tasks are in failed_task_ids or running_tasks.

        gate = self._resolve_auto_gate(ctx)
        result: BatchResult = ralph_core.suggest(
            runtime,
            semantic_provider=ctx.semantic_provider,
            semantic_gate=gate,
        )
        # Map result.ready (TaskSpec ids) back to TaskRef for IPC.
        ready_specs = [t for t in runtime.tasks if t.id in result.ready]
        return ReadyBatchSuggestion(
            suggestion_id=...,
            workflow_id=workflow_id,
            tasks=[s.to_task_ref() for s in ready_specs],
            rationale=f"Ralph: core.suggest -> {len(ready_specs)} ready, "
                      f"{len(result.blocked_by_semantic)} blocked by semantic",
            estimated_parallelism=len(ready_specs),
        )

        Legacy method preserved as _legacy_suggest_ready_batch for the no-plan path.

      RARCH-4 — verify delegation + consistency_report + recommended_tests:
        ctx = self.get_plan_context(workflow_id)
        if ctx is None:
            return self._legacy_verify_completion(task_id, changed_files, ...)

        runtime = ctx.runtime_plan(self.workflow_engine)
        task_spec = next((t for t in runtime.tasks if t.id == task_id), None)
        if task_spec is None:
            return self._legacy_verify_completion(...)

        core_result = ralph_core.verify(
            task_spec,
            changed_files=changed_files,
            project_root=self.project_root,
            plan=runtime,
            semantic_provider=ctx.semantic_provider,
        )
        # core_result already includes consistency_report when provider is given.

        # Codex F3 fix: also produce recommended_tests if provider available.
        # core.verify does NOT call recommend_tests by default (CLI-only).
        if ctx.semantic_provider is not None:
            from cccc.ralph.semantic_validator import recommend_tests
            from dataclasses import asdict
            try:
                rec = recommend_tests(task_spec, ctx.semantic_provider)
                core_result["recommended_tests"] = asdict(rec)
            except Exception as e:
                self._log(f"recommend_tests failed for {task_id}: {e}")

        return self._coerce_core_verify_to_ipc(core_result, task_id, workflow_id)

      VerificationResult extension (Codex v2 F-new-2):
        Add a new optional field to VerificationResult in
        src/cccc/contracts/v1/ralph_ipc.py:

          class VerificationResult(BaseModel):
              ... existing fields ...
              # T4 (Phase 4 remediation): semantic verification details surfaced
              # by ralph.core.verify when a SemanticProvider is available.
              semantic_details: Optional[Dict[str, Any]] = None

        semantic_details carries:
          {
              "consistency_report": {...},   # from core.verify
              "recommended_tests": {...},    # from semantic_validator.recommend_tests
          }

        Default None preserves backward compat. record_verification_result in
        workflow_state_engine.py uses model_dump(); the new field will appear in
        the engine ledger automatically.

      _resolve_auto_gate(ctx) helper (RARCH-2 commitment, Codex v2 ST-new-3):
        Returns "off" / "advisory" / "hard" based on metrics gate readiness.
        Implementation:
          if ctx.semantic_provider is None:
              return "off"
          from cccc.ralph.semantic_metrics import compute_gate_readiness
          # Use S_SUGGEST_CONFLICT exact-confidence gate; fall back to advisory
          # if metrics file is empty or gate not ready.
          readiness = compute_gate_readiness(
              "S_SUGGEST_CONFLICT", 0.05,
              confidence_filter="exact",
              project_root=self.project_root,
          )
          if readiness.gate_ready:
              return "hard"
          return "advisory"
        Cached per (workflow_id, ctx.semantic_provider) — recompute when ctx
        changes (e.g., on every register_plan_context).

      Forbidden flow no-silent-fallback-to-legacy: when ctx is NOT None and
      ralph_core.suggest / ralph_core.verify raises, the daemon MUST surface the
      error (raise or return an error VerificationResult). Silent fallback to
      legacy is forbidden in the ctx-present case. Only the ctx-is-None case
      uses legacy intentionally.

      Engine projection guarantee (Codex F1): all tests must verify that ASSIGNED,
      BLOCKED, DEFERRED tasks NEVER appear in suggest_ready_batch's result when
      a plan_context is registered.
    acceptance_criteria: |
      With a registered plan_context, RalphService.suggest_ready_batch returns
      tasks consistent with what ralph_core.suggest(runtime_plan) would return,
      where runtime_plan is built via T0a projection.
      ASSIGNED/BLOCKED/DEFERRED tasks NEVER appear in the ready set when a
      plan_context is registered (Codex F1 invariant).
      With no plan_context, legacy behavior is byte-identical to before (existing
      raw --tasks tests still pass).
      RalphService.verify_completion result, for plans with semantic blocks and
      Serena available, contains BOTH a consistency_report dict AND a
      recommended_tests dict (carried via the existing IPC type or workflow_data).
      A test asserts that monkeypatching ralph_core.suggest to raise causes the
      ctx-present path to surface the error.
      All existing tests pass.
    verification:
      level: integration
      checks:
        - name: import-and-attrs
          command: 'python -c "from cccc.daemon.foreman.ralph_service import RalphService; assert hasattr(RalphService, ''_legacy_suggest_ready_batch'') or hasattr(RalphService, ''_legacy_verify_completion''); print(''PASS'')"'
          required: true
        - name: regression-no-plan
