          required: true
      covers:
        tasks: [T4-service-delegate, T3-plan-context-threading, T0a-engine-projection]
        flows:
          - no-silent-fallback-to-legacy
          - no-cli-only-phase4
          - plan-backed-suggest
          - plan-backed-verify
          - worker-semantic-context
    consumes:
