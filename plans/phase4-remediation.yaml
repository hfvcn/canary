          - assert workflow proceeds (suggest still runs)

        test_register_validation_errors_event_emitted
          - plan with validation errors
          - assert WORKFLOW_PLAN_VALIDATION_FAILED event in ledger
          - assert workflow_data["validation"]["errors"] populated

        test_build_task_prompt_includes_semantic_section
          - call _build_task_prompt with workflow_id of a registered plan_context
          - assert "[Semantic Context]" in returned prompt

        test_build_task_prompt_callsite_passes_workflow_id
          - AST check on workflow_orchestrator.py source: confirm the production
            call site (around process_batch_suggestion's prompt build) passes
            workflow_id keyword arg

        test_auto_label_skips_when_no_evidence
          - validator emits S_SYMBOL_TARGET_MISSING for symbol "Foo" in "src/foo.py"
          - simulate task completion with changed_files=["other.py"]
          - assert no metrics record written

        test_auto_label_writes_true_positive_with_state_delta_and_file_overlap
          - same setup, pre_state shows symbol does not exist
          - changed_files=["src/foo.py"], post-state symbol exists
          - assert metrics record with actual_outcome="true_positive" and
            evidence containing changed_files=["src/foo.py"]

        test_auto_label_writes_false_positive_when_task_didnt_create
          - pre symbol absent, changed_files=["src/foo.py"], post still absent
          - assert metrics record actual_outcome="false_positive"
    acceptance_criteria: |
      register_and_suggest, when called with plan_path, runs validate_with_project
      and ATTACHES validation_errors/warnings/hints to the response payload.
      For non-fatal validation issues, register_and_suggest does NOT halt the
