      The new e2e file does NOT call monkeypatch.setattr(orchestrator.ralph,
      "suggest_ready_batch", ...) or monkeypatch.setattr(orchestrator.ralph,
      "verify_completion", ...) anywhere. (Library-level monkeypatch of
      ralph_core.suggest in E9 is allowed.)
      tests/test_ralph_semantic.py contains the new 4 assertions covering
      RBUG-1/2/3 + RDEAD-1.
      Existing tests/test_foreman_workflow.py and tests/test_workflow_state.py
      are NOT modified by this task (Codex F7 — leave seam-level tests alone).
      All tests across tests/ continue to pass.
    verification:
      level: e2e
      checks:
        - name: e2e-file-exists
          command: "test -f tests/e2e/test_phase4_remediation_e2e.py && echo PASS"
          required: true
        - name: no-production-monkeypatch-ast-check
          command: 'python -c "import ast, pathlib; src = pathlib.Path(''tests/e2e/test_phase4_remediation_e2e.py'').read_text(); tree = ast.parse(src); banned = {''suggest_ready_batch'', ''verify_completion''}; hits = [(n.lineno, getattr(a, ''value'', getattr(a, ''s'', None))) for n in ast.walk(tree) if isinstance(n, ast.Call) for a in n.args if (isinstance(a, ast.Constant) and a.value in banned) or (isinstance(a, ast.Str) and a.s in banned)]; assert not hits, ''production main path monkeypatched: '' + str(hits); print(''PASS'')"'
          required: true
        - name: e2e-tests-pass
          command: "python -m pytest tests/e2e/test_phase4_remediation_e2e.py -v --tb=short"
          required: true
        - name: full-test-suite
          command: "python -m pytest tests/ -x --tb=short -q"
          required: true
      covers:
        tasks: [T6-real-e2e-tests, T5-daemon-phase4-wiring, T4-service-delegate, T3-plan-context-threading, T2-validator-cleanup, T1c-metrics-path, T1b-plan-loader-ux, T1a-semvalidator-fixes, T0a-engine-projection, T0b-handler-contract]
        flows:
          - plan-backed-suggest
          - plan-backed-verify
          - worker-semantic-context
          - auto-label-cycle
          - no-stripped-semantic-data
          - no-cwd-anchored-metrics
          - no-cli-only-phase4
          - no-monkeypatched-production-path
          - no-silent-fallback-to-legacy
          - no-cached-plan-instance
          - no-unevidenced-auto-label
          - daemon_startup
          - cli_workflow

# ════════════════════════════════════════════
# Critical flows
# ════════════════════════════════════════════

critical_flows:
  - id: plan-backed-suggest
    description: "workflow submit --plan -> register_and_suggest -> RalphService.suggest_ready_batch -> runtime_plan -> ralph.core.suggest -> ReadyBatchSuggestion"
    entrypoints:
      - src/cccc/cli/workflow_cmds.py
      - src/cccc/daemon/foreman/workflow_orchestrator.py
      - src/cccc/daemon/foreman/ralph_service.py
      - src/cccc/daemon/foreman/runtime_plan.py
      - src/cccc/ralph/core.py
    required_verification_level: e2e

  - id: plan-backed-verify
    description: "task completion -> on_task_completed -> RalphService.verify_completion -> runtime_plan -> ralph.core.verify -> consistency_report + recommended_tests stored"
    entrypoints:
      - src/cccc/daemon/foreman/workflow_orchestrator.py
      - src/cccc/daemon/foreman/ralph_service.py
      - src/cccc/daemon/foreman/runtime_plan.py
      - src/cccc/ralph/core.py
    required_verification_level: e2e

  - id: worker-semantic-context
    description: "task assignment -> _build_task_prompt -> runtime_plan -> format_semantic_context -> worker prompt body"
    entrypoints:
      - src/cccc/daemon/foreman/workflow_orchestrator.py
      - src/cccc/daemon/foreman/runtime_plan.py
      - src/cccc/ralph/semantic_validator.py
    required_verification_level: integration

  - id: auto-label-cycle
    description: "task verify result -> evidence check (changed_files) -> _auto_label_semantic_outcomes -> record_semantic_outcome -> <project_root>/.ralph/semantic_metrics.jsonl"
    entrypoints:
      - src/cccc/daemon/foreman/workflow_orchestrator.py
      - src/cccc/ralph/semantic_metrics.py
    required_verification_level: integration

# ════════════════════════════════════════════
# Forbidden flows — negative invariants (findings §十六 + Codex review additions)
# ════════════════════════════════════════════

forbidden_flows:
  - id: no-stripped-semantic-data
    description: "TaskSpec.semantic data MUST remain reachable via ctx.runtime_plan(engine).tasks where ctx = RalphService.get_plan_context(workflow_id); the IPC TaskRef strip is intentional but the daemon-side PlanContext re-parse preserves the semantic block"
    required_verification_level: integration

  - id: no-cwd-anchored-metrics
    description: "semantic_metrics MUST resolve its file path relative to project_root (or env override), never the process cwd; CLI / daemon / tests must see the same file when given the same project_root"
    required_verification_level: unit

  - id: no-cli-only-phase4
    description: "every Phase 4 capability (suggest-deps, auto-infer, semantic-gate, consistency-check, recommended-tests, semantic-weight) MUST be reachable from the daemon production path; manual CLI invocation by Foreman AI MUST NOT be the only activation channel"
    required_verification_level: integration

  - id: no-monkeypatched-production-path
    description: "tests/e2e/test_phase4_remediation_e2e.py MUST NOT monkeypatch RalphService.suggest_ready_batch or RalphService.verify_completion; these are the production main path. Library-level monkeypatch of ralph.core.suggest IS allowed (it tests the daemon's response to library failures). Existing tests/test_foreman_workflow.py and tests/test_workflow_state.py are out of scope for this rule — their seam-level tests have legitimate reasons (Codex F7)."
    required_verification_level: integration

  - id: no-silent-fallback-to-legacy
    description: "when ralph.core.suggest or ralph.core.verify raises an error AND a plan_context is registered, the daemon MUST surface the error to the caller; silent fallback to the pre-T4 legacy path is forbidden in the ctx-present case (it hides bugs introduced in the new path — finding 17). The ctx-is-None case uses legacy intentionally and is NOT covered by this rule."
    required_verification_level: unit

  - id: no-cached-plan-instance
    description: "RalphService PlanContext MUST NOT cache the loaded Plan instance; ctx.runtime_plan(engine) MUST re-parse from pinned source bytes + apply T0a engine projection on every call. The plan source is pinned at register_plan_context time (Codex v2 ST-new-2) so engine + pinned source cannot drift via concurrent disk edits."
    required_verification_level: integration

  - id: no-unevidenced-auto-label
    description: "_auto_label_semantic_outcomes MUST NOT write a metrics record without task-local runtime evidence; specifically, S_SYMBOL_TARGET_MISSING and S_DELETE_STILL_REFERENCED labels require changed_files to contain the target path (Codex F5)"
    required_verification_level: integration

# ════════════════════════════════════════════
# Suppress codes — reasoning inline
# ════════════════════════════════════════════

suppress_codes:
  # This plan touches files outside src/cccc/ralph/ (daemon, tests). plan_scope
  # widens checks, but some critical_entrypoint coverage rules will still fire
  # for daemon files we own across multiple tasks.
  - E_CRITICAL_FLOW_ENTRYPOINT_UNOWNED

state:
  completed_task_ids:
    - T6-real-e2e-tests
    - T5-daemon-phase4-wiring
    - T4-service-delegate
    - T3-plan-context-threading
    - T2-validator-cleanup
    - T1c-metrics-path
    - T1b-plan-loader-ux
    - T1a-semvalidator-fixes
    - T0b-handler-contract
    - T0a-engine-projection
