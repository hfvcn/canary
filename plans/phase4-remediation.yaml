  - id: T0a-engine-projection
    title: "Define engine TaskState → Plan.state projection contract (new module)"
    role: leaf
    depends_on: []
    addresses: [RARCH-3, RBOUND-1]
    claimed_paths:
      - src/cccc/daemon/foreman/runtime_plan.py
      - tests/test_runtime_plan_projection.py
    awareness_paths:
      - src/cccc/kernel/workflow_state_types.py
      - src/cccc/kernel/workflow_state_engine.py
      - src/cccc/ralph/models.py
      - src/cccc/ralph/core.py
      - src/cccc/daemon/foreman/workflow_orchestrator.py
    goal_behavior: |
      Codex F1 root-cause: T4 cannot safely call ralph.core.suggest(plan) until we
      decide how every engine TaskState maps into Plan.state, because core.suggest
      treats anything not in completed/running/failed as a candidate. Today
      _resuggest_ready_tasks (workflow_orchestrator.py:1271-1292) explicitly drops
      ASSIGNED/BLOCKED/DEFERRED from the candidate list — this implicit projection
      must be made explicit before delegation.

      Create a new module `src/cccc/daemon/foreman/runtime_plan.py` with:

        from cccc.ralph.models import Plan, PlanState, RunningTask
        from cccc.kernel.workflow_state_types import WorkflowTaskStatus, TaskState
        from typing import Iterable

        def project_engine_state(
            base_plan: Plan,
            engine_tasks: Iterable[TaskState],
            workflow_id: str,
        ) -> Plan:
            """Return a fresh Plan with state synthesised from engine task states.

            base_plan is NEVER mutated. The returned Plan is a model_copy with a
            replaced PlanState. Use this immediately before calling core.suggest
            or core.verify so semantic decisions see runtime truth.

            Mapping (every WorkflowTaskStatus is handled explicitly):
              COMPLETED, ARCHIVED  -> completed_task_ids
              RUNNING, VERIFYING   -> running_tasks (carries claimed_paths)
              ASSIGNED             -> running_tasks (worker may already be writing)
              FAILED               -> failed_task_ids
              BLOCKED              -> failed_task_ids (not schedulable; equivalent to
                                       "this task is currently a no-go")
              DEFERRED             -> failed_task_ids (deferred = batch backoff,
                                       same effect: do not propose)
              PLANNED, READY       -> no bucket (default candidate)

            Filter engine_tasks to workflow_id == workflow_id before mapping.

            For tasks present in engine but NOT in base_plan.tasks:
              - RUNNING, VERIFYING, ASSIGNED: their claimed_paths ARE added to
                running_tasks of the returned Plan (write-set conflict detection
                must see concurrent ad-hoc writes). They are excluded from the
                candidate pool because core.suggest only proposes tasks in
                base_plan.tasks.
              - All other statuses for non-plan tasks: fully ignored.
            This preserves the no-plan / ad-hoc test path while ensuring
            concurrent ad-hoc write sets are never invisible to scheduler.

            Codex F-new-ad-hoc: the previous spec said "ignored" for all non-plan
            tasks. This was a latent bug: switching to plan-backed suggest would
            have silently dropped write-set protection for manual / ad-hoc tasks
            running concurrently in the same workflow.
            """
            ...

      Also export:
        def derive_running_write_sets(engine_tasks, workflow_id) -> List[List[str]]
          For RalphService.suggest_ready_batch's existing API where running_write_sets
          is passed separately. Returns ALL write sets for RUNNING/VERIFYING/ASSIGNED
          tasks in the workflow, regardless of whether they appear in base_plan.tasks.
          T3/T4 callers can use either projection or this helper depending on whether
          they call core.suggest(plan) or the legacy API.

      Tests (tests/test_runtime_plan_projection.py): one test per WorkflowTaskStatus
      asserting the mapping. One test that BLOCKED tasks NEVER appear as candidates
      after projection. One test that base_plan is not mutated. One test that a
      RUNNING engine task not present in base_plan.tasks still contributes its
      claimed_paths to running_tasks of the projected Plan (write-set protection
      for ad-hoc tasks running concurrently).
    acceptance_criteria: |
      runtime_plan.py exposes project_engine_state() and derive_running_write_sets().
      project_engine_state(base, [task with each of the 10 statuses], wf) returns a
      Plan whose state buckets match the documented mapping for every status.
      base_plan.state is unchanged after the call (deep equality with the input).
      A task in BLOCKED/DEFERRED status is in failed_task_ids of the returned Plan
      (consequence: core.suggest will not propose it).
      ASSIGNED tasks contribute their claimed_paths to running_tasks of the returned
      Plan (consequence: core.suggest will see the write-set conflict).
      A RUNNING/ASSIGNED engine task that is NOT in base_plan.tasks still appears
      in running_tasks of the returned Plan with its claimed_paths (write-set
      protection — core.suggest cannot propose a plan task that conflicts with it).
      tests/test_runtime_plan_projection.py exists and all tests pass.
    verification:
      level: integration
      checks:
        - name: import-and-signature
          command: 'python -c "import inspect; from cccc.daemon.foreman.runtime_plan import project_engine_state, derive_running_write_sets; assert ''base_plan'' in inspect.signature(project_engine_state).parameters; print(''PASS'')"'
          required: true
        - name: pytest
          command: "python -m pytest tests/test_runtime_plan_projection.py -v --tb=short"
          required: true
      covers:
        tasks: [T0a-engine-projection]
        flows: []
    provides:
      - name: engine_to_plan_projection
        kind: artifact

  - id: T0b-handler-contract
    title: "Extend IPC + DaemonResponse with structured validation fields"
    role: leaf
    depends_on: []
    addresses: [RARCH-2, RBOUND-1]
    claimed_paths:
      - src/cccc/contracts/v1/ralph_ipc.py
      - src/cccc/contracts/v1/ipc.py
      - tests/test_ralph_ipc_validation_errors.py
      - tests/test_ralph_ipc.py  # backward-compat additions for new field defaults
    awareness_paths:
      - src/cccc/daemon/ralph_ipc_handler.py
      - src/cccc/ralph/models.py
    goal_behavior: |
      Codex v2 F-new-1 fix: v2 only added validation_errors to ralph_ipc.py, but
      ralph_register_and_suggest actually returns DaemonResponse.result (defined in
      contracts/v1/ipc.py), not a Ralph typed message. handle_ralph_register_and_suggest
      currently only puts {workflow_id, registered_count, submitted_count, ready_task_ids}
      into the result dict, dropping anything orchestrator passes alongside. T5 cannot
      surface validation errors without this contract layer being extended.

      v3 changes:

      1. Add to `src/cccc/contracts/v1/ralph_ipc.py`:

        class IpcValidationError(BaseModel):
            """One validation issue surfaced through the IPC boundary."""
            code: str
            severity: Literal["error", "warning", "hint"]
            message: str
            task_ids: List[str] = Field(default_factory=list)
            evidence: Dict[str, Any] = Field(default_factory=dict)

        # Extend the existing register-and-suggest response model. If there is
        # already a typed model (e.g., RegisterAndSuggestResponse), add the field;
        # otherwise extend the model used by handle_ralph_register_and_suggest.
        # The field MUST be optional and default to empty list so existing
        # callers/tests are unaffected.
        validation_errors: List[IpcValidationError] = Field(default_factory=list)
        validation_warnings: List[IpcValidationError] = Field(default_factory=list)
        validation_hints: List[IpcValidationError] = Field(default_factory=list)

      Also add string constants:
        WORKFLOW_PLAN_VALIDATION_FAILED = "workflow.plan_validation_failed"

        # Fatal structural codes recognized by T5's hard-fail guard.
        # These must be defined in ralph_ipc.py (or imported from validator) so
        # T5 can reference them without importing the validator directly.
        FATAL_IPC_VALIDATION_CODES = frozenset({
            "E_DUPLICATE_TASK_ID",
            "E_DEP_UNKNOWN",
            "E_DEP_SELF",
            "E_DEP_CYCLE",
            "E_SEMANTIC_PROVIDER_UNAVAILABLE",  # strict-mode provider failure (T3)
        })

      2. Codex v3 F-v3-1 / ST-v3-1 fix: introduce a typed response model
         (NOT documented-by-convention). Add `RalphRegisterResponse(BaseModel)`
         to ralph_ipc.py:

           class RalphRegisterResponse(BaseModel):
               workflow_id: str
               registered_count: int
               submitted_count: int
               ready_task_ids: List[str] = Field(default_factory=list)
               validation_errors: List[IpcValidationError] = Field(default_factory=list)
               validation_warnings: List[IpcValidationError] = Field(default_factory=list)
               validation_hints: List[IpcValidationError] = Field(default_factory=list)
               plan_validation_failed_event_emitted: bool = False

         contracts/v1/ipc.py changes: NO DaemonResponse schema change. The
         documented invariant is: when handle_ralph_register_and_suggest succeeds,
         DaemonResponse.result == RalphRegisterResponse(...).model_dump(). This
         is a runtime guarantee enforced by T3's handler implementation
         (handler must call RalphRegisterResponse.model_validate(...) before
         dumping into result, so any drift in field types raises immediately
         instead of passing through silently).

         T3 must validate the orchestrator return value through this model
         before assigning to DaemonResponse.result. T5 producers must construct
         instances of IpcValidationError, not raw dicts.

      3. T0b does NOT modify ralph_ipc_handler.py — that is T3's responsibility
         (T3 already claims the handler for register_plan_context, and per-call
         field forwarding goes there as part of the same write). T0b just provides
         the contract types.

      Tests: round-trip serialise/deserialise an IpcValidationError; assert defaults
      are empty; assert backward compat (old payloads without validation_errors
      still parse).
    acceptance_criteria: |
      contracts/v1/ralph_ipc.py defines IpcValidationError with the listed fields.
      The register-and-suggest response model has validation_errors,
      validation_warnings, validation_hints fields all defaulting to empty list.
      WORKFLOW_PLAN_VALIDATION_FAILED constant is defined and importable.
      Old IPC payloads without these fields parse without error (backward compat).
      tests/test_ralph_ipc_validation_errors.py covers serialise/deserialise +
      defaults + backward compat.
    verification:
      level: integration
      checks:
        - name: import
          command: 'python -c "from cccc.contracts.v1.ralph_ipc import IpcValidationError; e = IpcValidationError(code=''X'', severity=''error'', message=''m''); assert e.code == ''X''; print(''PASS'')"'
          required: true
        - name: backward-compat
          command: 'python -c "from cccc.contracts.v1.ralph_ipc import TaskRef; t = TaskRef.model_validate({''id'': ''T1''}); assert t.id == ''T1''; print(''PASS'')"'
          required: true
        - name: pytest-new
          command: "python -m pytest tests/test_ralph_ipc_validation_errors.py -v --tb=short"
          required: true
        - name: pytest-existing-ipc
          command: "python -m pytest tests/test_ralph_ipc.py -v --tb=short"
          required: true
      covers:
        tasks: [T0b-handler-contract]
        paths:
          - src/cccc/contracts/v1/ralph_ipc.py
          - src/cccc/contracts/v1/ipc.py
          - tests/test_ralph_ipc.py
        flows: []
    provides:
      - name: ipc_validation_error_contract
        kind: artifact

  - id: T1a-semvalidator-fixes
    title: "Semantic validator: return effective_plan, fix scope direction, delete dead field"
    role: leaf
    depends_on: []
    addresses: [RBUG-1, RBUG-3, RDEAD-1]
    claimed_paths:
      - src/cccc/ralph/semantic_validator.py
      - src/cccc/ralph/models.py
    awareness_paths:
      - src/cccc/ralph/validator.py
      - src/cccc/ralph/graph_utils.py
    semantic:
      mode: strict
      targets:
        - path: src/cccc/ralph/semantic_validator.py
          symbol: validate_semantic
          op: modify_interface
        - path: src/cccc/ralph/semantic_validator.py
          symbol: _compute_task_scope
          op: modify_body
        - path: src/cccc/ralph/models.py
          symbol: ValidationReport
          op: modify_interface
    goal_behavior: |
      RBUG-1: validate_semantic must return effective tasks alongside issues so the
      caller (validator.validate_with_project) can compute fingerprints from the
      same input. Today the auto-infer code path mutates a copy of `task` for
      issue emission, but fingerprints are still computed from the original plan.

      Required signature change:
        def validate_semantic(
            plan: Plan,
            provider: SemanticProvider,
            suggest_deps: bool = False,
        ) -> tuple[List[ValidationIssue], Dict[str, List[str]], List[TaskSpec]]:

      Third element is the effective tasks list in plan.tasks order. When auto_infer
      is disabled, the elements are identity-equal to plan.tasks. _prepare_tasks_for_validation
      already produces this list internally; just propagate it.

      RBUG-3: _compute_task_scope() comment claims "downstream" but the implementation
      uses `transitive_deps()` which returns upstream. The intended semantic for
      S_INTERFACE_REFS_OUTSIDE_SCOPE / S_MASSIVE_REFACTOR is downstream — "what code
      my changes can affect". Build a reverse-edge transitive closure helper (add
      `transitive_dependents` to graph_utils.py if missing — but graph_utils.py is
      NOT in this task's claimed_paths, so import-only) and use it. Update the
      docstring/comment to match.

      If transitive_dependents does not exist in graph_utils.py and we cannot add
      it (out of scope), implement the closure inline in semantic_validator.py and
      add a TODO referencing a follow-up to move it to graph_utils.py.

      RDEAD-1: ValidationReport.consistency_reports field (models.py:350) is defined
      but never populated and never read by any production code path. Codex review
      v1 confirmed populating it would require circular work in T4. Decision:
      delete the field. Existing semantic tests reference the default value via
      model defaults — search for `consistency_reports` callers and update; the
      field is referenced in tests/test_ralph_semantic.py:171 (default value
      assertion) — that test must be updated to remove the assertion.
    acceptance_criteria: |
      validate_semantic returns 3-tuple (issues, suggested_deps, effective_tasks).
      effective_tasks has the same length as plan.tasks.
      _compute_task_scope returns the union of task.claimed_paths AND every
      transitively dependent (downstream) task's claimed_paths.
      ValidationReport no longer has consistency_reports field; no code in
      src/cccc/ralph/ references it; tests have been updated.
      All existing semantic tests still pass after fixture updates for the scope
      direction change and the deleted field.
    verification:
      level: integration
      checks:
        - name: signature
          command: 'python -c "import inspect; from cccc.ralph.semantic_validator import validate_semantic; sig = inspect.signature(validate_semantic); print(sig); assert ''effective'' in str(sig.return_annotation).lower() or ''Tuple'' in str(sig.return_annotation); print(''PASS'')"'
          required: true
        - name: scope-direction
          command: 'python -c "from cccc.ralph.semantic_validator import _compute_task_scope; from cccc.ralph.models import TaskSpec; t1 = TaskSpec(id=''T1'', claimed_paths=[''a.py'']); t2 = TaskSpec(id=''T2'', claimed_paths=[''b.py''], depends_on=[''T1'']); t3 = TaskSpec(id=''T3'', claimed_paths=[''c.py''], depends_on=[''T2'']); m = {''T1'': t1, ''T2'': t2, ''T3'': t3}; scope = _compute_task_scope(t1, m); assert ''a.py'' in scope and ''b.py'' in scope and ''c.py'' in scope, scope; print(''PASS'')"'
          required: true
        - name: dead-field-removed
          command: 'python -c "from cccc.ralph.models import ValidationReport; assert not hasattr(ValidationReport(), ''consistency_reports''), ''consistency_reports must be deleted''; print(''PASS'')"'
          required: true
        - name: regression-pytest
          command: "python -m pytest tests/test_ralph_semantic.py -v --tb=short -x"
          required: true
      covers:
        tasks: [T1a-semvalidator-fixes]
        flows: []
    failure_path: |
      If transitive_dependents helper is missing from graph_utils.py and adding it
      would expand claimed_paths beyond this task's scope, implement inline with a
      TODO. Do not skip the direction fix.

  - id: T1b-plan-loader-ux
    title: "Plan loader: actionable error messages with field-level diagnostics"
    role: leaf
    depends_on: []
    addresses: [RUX-1, RUX-3]
    claimed_paths:
      - src/cccc/ralph/plan_io.py
      - tests/ralph/test_plan_loader_ux.py
    awareness_paths:
      - src/cccc/ralph/models.py
    goal_behavior: |
      RUX-1: When Plan.model_validate raises ValidationError on a known compound
      field (provides, consumes, semantic, forbidden_flows), translate the Pydantic
      error into a Ralph-level diagnostic that includes the correct format example.

      load_plan() catches pydantic.ValidationError, walks err.errors() entries, and
      for each error whose loc contains a known field name, replaces the message
      with a Ralph-formatted line:
        "task '<id>': <field>[<idx>] expects <FormatName>, e.g. <example>"

      Format examples:
        provides:    {name: "my_api", kind: "artifact"}
        consumes:    {name: "upstream_api", kind: "artifact"}
        semantic:    {mode: "strict", targets: [{path: "x.py", symbol: "X", op: "modify_body"}]}
        forbidden_flows: [{id: "no-X", description: "...", required_verification_level: "unit"}]

      RUX-3: when top-level Plan.model_validate fails because of multiple task
      errors, attempt a per-task fallback: iterate plan_dict["tasks"] and try
      TaskSpec.model_validate(task_dict) individually, accumulating per-task errors
      with task ID and field name. Raise a single PlanLoadError listing each
      problematic task ID with the offending field path.

      Add `class PlanLoadError(Exception)` carrying `errors: List[PlanLoadIssue]`
      where PlanLoadIssue has task_id, field_path, message, suggested_format.

      No silent recovery: load_plan still fails on invalid plans, just with a
      better message. No format change to plan.yaml.
    acceptance_criteria: |
      load_plan called on a plan with `provides: ["foo"]` raises an error whose
      message contains both "Contract" and an example like
      `{name: "foo", kind: "artifact"}`.
      load_plan called on a plan with three malformed tasks (one with bad provides,
      one with bad semantic, one with bad forbidden_flows) raises a single error
      that lists all three tasks with their respective field paths.
      load_plan on every existing plans/*.yaml still loads successfully (backward
      compat smoke test).
      Existing tests for load_plan continue to pass.
    verification:
      level: integration
      checks:
        - name: pytest-loader-ux
          command: "python -m pytest tests/ralph/test_plan_loader_ux.py -v --tb=short"
          required: true
        - name: existing-plans-load-smoke
          command: 'python -c "import pathlib, sys; from cccc.ralph.plan_io import load_plan; ok=0; bad=[]; [ (lambda p: (load_plan(p) and None)) for p in pathlib.Path(''plans'').glob(''*.yaml'') ]; print(''PASS'')"'
          required: false
      covers:
        tasks: [T1b-plan-loader-ux]
        flows: []
    awareness_paths:
      - src/cccc/ralph/models.py

