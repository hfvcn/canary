  # ════════════════════════════════════════════
  # Wave 5 — daemon Phase 4 wiring (depends T4)
  # ════════════════════════════════════════════

  - id: T5-daemon-phase4-wiring
    title: "Orchestrator: surface validation, inject semantic prompt context, evidence-gated auto-label"
    role: integration
    depends_on: [T4-service-delegate]
    addresses: [RARCH-2, RPROMPT-1, RAUTO-1]
    claimed_paths:
      - src/cccc/daemon/foreman/workflow_orchestrator.py
      - tests/test_t5_phase4_wiring.py
    awareness_paths:
      - src/cccc/daemon/foreman/ralph_service.py
      - src/cccc/ralph/core.py
      - src/cccc/ralph/validator.py
      - src/cccc/ralph/semantic_validator.py
      - src/cccc/ralph/semantic_metrics.py
      - src/cccc/contracts/v1/ralph_ipc.py
    semantic:
      mode: strict
      targets:
        - path: src/cccc/daemon/foreman/workflow_orchestrator.py
          symbol: register_and_suggest
          op: modify_body
        - path: src/cccc/daemon/foreman/workflow_orchestrator.py
          symbol: _build_task_prompt
          op: modify_body
    goal_behavior: |
      Codex F4 fix: T5 does NOT hard-refuse workflow start on validation errors.
      Instead, it surfaces errors via the structured response shape from T0b.
      Caller decides what to do.

      RARCH-2 — capability automation:

      A. validate at register_and_suggest (soft, not hard-refuse):
         After RalphService.register_plan_context, call:
           validation_report = validator.validate_with_project(
               ctx.runtime_plan(self.engine),  # Codex v3 F-v3-2: ctx-bound, no workflow_id arg
               project_root=self.project_root,
               semantic_provider=ctx.semantic_provider,
               suggest_deps=True,
           )
         Then attach to the response payload (uses the IpcValidationError contract
         from T0b):
           response["validation_errors"] = [serialize(i) for i in validation_report.errors]
           response["validation_warnings"] = [serialize(i) for i in validation_report.warnings]
           response["validation_hints"] = [serialize(i) for i in validation_report.hints]
         and persist them in workflow_data["validation"].

         Codex F4 fix (non-fatal validation only): for non-fatal validation issues
         (warnings/hints/semantic suggestions), the workflow ALWAYS proceeds with
         suggest. Caller (Foreman AI / CLI) sees them in the response and decides.

         EXCEPTION — fatal structural codes (Codex new F-crit-1): BEFORE calling
         engine.register_task() for any task, check validation_report.errors for
         any issue whose code is in FATAL_STRUCTURAL_CODES:
           FATAL_STRUCTURAL_CODES = {
               "E_DUPLICATE_TASK_ID", "E_DEP_UNKNOWN", "E_DEP_SELF", "E_DEP_CYCLE",
               "E_SEMANTIC_PROVIDER_UNAVAILABLE",  # strict-mode provider failure
           }
         If any fatal code is present, do NOT register tasks and do NOT suggest.
         Return the response immediately with:
           - validation_errors populated (via T0b contract)
           - plan_validation_failed_event_emitted = True
           - ready_task_ids = []
           - registered_count = 0, submitted_count = 0
         Emit WORKFLOW_PLAN_VALIDATION_FAILED event to the ledger.

         Existing minimal-plan tests that use plans WITHOUT these fatal codes are
         unaffected. Any test with a plan triggering a fatal code must now expect
         a structured error response instead of a success.

         If validation_report.errors is non-empty but contains NO fatal codes,
         emit WORKFLOW_PLAN_VALIDATION_FAILED to the ledger for auditability —
         but this is informational, not a halt signal.

      B. semantic-gate auto-resolution:
         OWNED ENTIRELY BY T4 (Codex v3 ST-v3-2). T4 implements
         RalphService._resolve_auto_gate(ctx) and wires it into the suggest
         delegation. T5 does NOT need to do anything for semantic-gate — it is
         already live by the time T5 runs. Do NOT re-discuss the helper here.

      C. auto-infer at register: if ctx.runtime_plan(...).auto_infer is True,
         validator already runs auto-infer prep — no extra work beyond not
         blocking on S_AUTO_INFER_NOT_READY (which is a hint).

      D. consistency-check at completion: T4 already wires this via core.verify
         + recommend_tests. T5 reads the result in on_task_completed and persists
         consistency_report + recommended_tests in workflow_data.

      E. gate-report: workflow_data["validation"]["gate_summary"] populated via
         format_gate_report at register-time for auditability.

      F. semantic-weight ranking: automatic via core.suggest in T4.

      RPROMPT-1 — _build_task_prompt + production callsite (Codex v2 F-new-3):
        Add a workflow_id keyword arg (default ""). When workflow_id is set:
          ctx = self.ralph.get_plan_context(workflow_id)
          if ctx and ctx.semantic_provider:
              runtime = ctx.runtime_plan(self.engine)
              task_spec = next((t for t in runtime.tasks if t.id == task.id), None)
              if task_spec is not None:
                  from cccc.ralph.semantic_validator import format_semantic_context
                  context_block = format_semantic_context(task_spec, ctx.semantic_provider)
                  prompt += "\n\n[Semantic Context]\n" + context_block
        Graceful degradation when ctx/provider/task_spec is None.

        CRITICAL Codex v2 F-new-3: also modify the PRODUCTION CALLSITE in
        workflow_orchestrator.py around line 871-875 (the existing call inside
        the task assignment / process_batch_suggestion path) to pass workflow_id
        through. Today the callsite is something like:
            prompt = self._build_task_prompt(task, worker_prompt=..., runtime=...)
        Change to:
            prompt = self._build_task_prompt(
                task, worker_prompt=..., runtime=...,
                workflow_id=current_workflow_id,
            )
        E7 in T6 must verify the prompt content via the FULL assignment path
        (process_batch_suggestion → _build_task_prompt → captured prompt sent
        to agent), not by calling _build_task_prompt directly.

      RAUTO-1 — auto-label semantic outcomes (Codex v2 F-new-5: state-delta evidence):
        Add private method _auto_label_semantic_outcomes(workflow_id, task_id,
        core_verify_result, ctx, changed_files, pre_states). Called from
        on_task_completed AFTER verify result is in.

        Codex v2 F-new-5 critique: file-overlap alone is insufficient; the same
        file may be touched for unrelated reasons. v3 strengthens evidence by
        REQUIRING a state DELTA between register-time and completion-time, not
        just a current-state check.

        Pre-state capture (at register_and_suggest, in T5):
          if ctx.semantic_provider is None:   # Codex v3 F-v3-4
              workflow_data["validation"]["pre_semantic_states"] = {}
              workflow_data["validation"]["pre_state_capture_skipped_reason"] = \
                  "semantic_provider unavailable (Serena import failed at register)"
              # The auto-labeler MUST then SKIP every label — no metrics writes.
          else:
              For each task in plan, for each semantic.target, capture
                pre_states[task_id][target_key] = {
                    "exists": ctx.semantic_provider.symbol_exists(target.path, target.symbol),
                    "ref_count": len(ctx.semantic_provider.find_references(target.path, target.symbol)),
                }
              Store in workflow_data["validation"]["pre_semantic_states"].

        EVIDENCE-GATED RULES (Codex v2 F-new-5 — state delta + file overlap):

          GUARD (Codex v3 F-v3-4): if ctx.semantic_provider is None OR
          workflow_data["validation"]["pre_semantic_states"] is empty, SKIP
          ALL labeling and return without writing metrics. Log a single line
          to the orchestrator log noting the skip reason. Add a test
          (test_auto_label_skips_when_provider_none in tests/test_t5_phase4_wiring.py)
          that verifies no metrics records are written when the provider is
          unavailable.

          For each warning the validator emitted earlier for THIS task:

            S_SYMBOL_TARGET_MISSING:
              evidence required: ALL of:
                a. changed_files contains target.path
                b. pre_states[task_id][target_key]["exists"] == False
                c. ctx.semantic_provider.symbol_exists(target.path, target.symbol) at completion
              -> true_positive (state changed False→True, this task touched the file)
              ELSE if (a) AND pre False AND post False:
              -> false_positive (task touched the file but didn't create the symbol)
              ELSE: SKIP

            S_DELETE_STILL_REFERENCED:
              evidence required: ALL of:
                a. changed_files contains target.path
                b. pre_states[task_id][target_key]["ref_count"] > 0
                c. post ref_count == 0
              -> true_positive (refs cleared by this task)
              ELSE: SKIP (do NOT mark false_positive even if refs persist)

            All other rules: SKIP (no runtime truth).

          Each label is recorded via record_semantic_outcome with
          project_root=self.project_root and an `evidence` keyword carrying
          {"changed_files": [...matching files...], "pre_state": {...}, "post_state": {...}}.

          CRITICAL F-new-5 invariant: NEVER label without (a) file overlap AND
          (b) state delta from pre to post. The metrics record must be
          auditable: every record carries `evidence_changed_files` listing the
          matched files and `evidence_state_delta` showing pre vs post.

          NOTE: T1c must extend record_semantic_outcome to accept an `evidence`
          dict parameter (see T1c update). If not yet done, pass via the metadata
          field convention or temporarily store in workflow_data and skip the
          metrics write — metrics records are auditability gold and missing the
          schema extension is a hard blocker.

      tests/test_t5_phase4_wiring.py (this task's claimed test file) must contain:

        test_register_hard_fails_on_fatal_structural_error
          - register_and_suggest with a plan that triggers E_DEP_CYCLE
          - assert returned dict has validation_errors populated with E_DEP_CYCLE
          - assert ready_task_ids == [] and registered_count == 0
          - assert no engine tasks were registered
          - assert WORKFLOW_PLAN_VALIDATION_FAILED event in ledger

        test_register_attaches_validation_errors_to_response
          - register_and_suggest with a plan that triggers validation warnings
