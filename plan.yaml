schema_version: "1.0.0"

# 本批次（2026-06-07 v71 B 类多层契约专项 + 蓝图不变量/盲点）
#
# 用户指令：修复 deferred「B. 多层契约专项」+ BPA-3/BPA-4。用户决策（AskUserQuestion）：四项全做；
# MSE-NS 采「扩 TaskRef.type 枚举 + 上游定型」路线。
#
# step-1 understand 实测（见 .ralph-flow/step-1-understand/understand.md）+ 三路并行探查核实：
#   T1 = FL-74   executor_runtime canonical 'codex' 与 Agent 合同默认 'claude' 不一致 → 合同默认统一为 codex
#                （含 _save_agent_yaml exclude_defaults round-trip 耦合：合同默认 + load/save 兜底须同改）
#   T2 = BPA-3   蓝图 INV-7 NO_COMPLETE_WITHOUT_FRESH_SELF_TEST 未作命名引擎守卫 → 新增命名 pre-transition
#                guard（复用 register_pre_transition_hook 基础设施 + 把当次 attempt 的 self-test 证据接入完成 payload，
#                使守卫非休眠；mode-configurable，默认 WARN 第一道防线）
#   T3 = MSE-NS  命名空间统一 → 扩 TaskRef.type/TaskSpec.type 枚举纳入 security_review，上游按既有 title/goal
#                信号定型（使新词表可达，非休眠），selector 经既有 strengths 子串匹配端到端路由（registry 已含
#                security_review strength）
#   T4 = BPA-4   BP-2 liveness 强制约束（gap 检测仅 OBSERVE/WARN → 加硬 liveness 截止 + 强制升级，不再无限挂起）；
#                BP-5 动态 DAG 版本治理：探查证实运行时无动态拆分路径，加可达基础（plan-version 戳 + depends_on
#                存在性守卫），完整治理待动态拆分特性落地（honest，不造休眠治理）
#   T5 = 验证脊（role: verification）：跨任务行为脊 + 回归锁，covers T1-T4
#
# 独立宽度：T1(agent.py+agent_ops.py) / T2(orchestrator+verification_gate+monitor) /
# T3(ralph_ipc.py+models.py+task_typing.py) claimed_paths 两两不相交 → estimated_parallelism=3（dogfood FL-73）。
# T4 depends_on T2（共享 orchestrator+monitor，串行）。T5 depends_on T1-T4（验证脊）。

required_issues:
  - FL-74
  - BPA-3
  - MSE-NS
  - BPA-4

batch_e2e_command: "python -m pytest tests/ralph/test_bclass_fl74_runtime_default.py tests/ralph/test_bclass_bpa3_inv7.py tests/ralph/test_bclass_msens_task_type.py tests/ralph/test_bclass_bpa4_liveness.py tests/ralph/test_bclass_regression_spine.py -v"

semantic_mode: "off"
auto_infer: false

# step-3 Codex 对抗设计评审（.ralph-flow/step-3-review/design_review.json，verdict=adjust，
# 2 blocker + 3 major + 1 minor）。6 finding 全核实属实、全采纳（M1-6 adoption discipline）。
# 用户决策（AskUserQuestion）：BPA-3 本批同时建 self-test producer + 守卫。
finding_refs:
  - id: F1-BPA3-FABRICATED-EVIDENCE
    mitigation: "BPA-3：守卫不再用 self_test.source=verification_id（completion 上报早于 verification，guard 触发点 verification_id 尚不存在 → 时间倒流式伪证据 DG-26）。改为：worker 自测元数据作为 completion 事件的**原生生产物**经入口 schema 携带，guard 只校验真实携带的 self_test（attempt_id + outcome），不反查/不回填 verification_id"
    enforced_by:
      - T2
    status: accepted
    status_reason: "blocker 属实：verification_gate.process_completed_event(:207) 先 report_worker_completion，verification_id 要到 ralph_service._verification_result(:1095) 才生成；草案 source=verification_id 在 guard 点不存在，硬塞即 reverse-inferred 伪证据"
  - id: F2-BPA3-NO-PRODUCER-UNREACHABLE
    mitigation: "BPA-3（用户决策：本批建 producer）：补齐所有真实 completion producer——REST TaskCompletedRequest(workflow.py:76) 增 attempt_id + self_test 字段并入 evidence 传 complete_task；AF 桥 convert_af_results_to_completion_events(af_gateway_bridge.py:405) 在 evidence 内带 self_test；verification_gate report_worker_completion evidence dict 透传 payload['self_test']（修 process_completed_event 重建 evidence 丢弃 self_test）。先建 producer 再开 guard，使 self_test 经真实主路径可达，避免 WARN 误杀所有完成 / BLOCK 死锁完成主路径"
    enforced_by:
      - T2
    status: accepted
    status_reason: "blocker 属实：当前真实 completion 入口（REST/AF/重建 evidence 路径）都不产 fresh self_test，无 producer 的 guard 必误杀或死锁主路径。TaskEvent.payload 为 Dict[str,Any]，self_test 走 payload/evidence dict 键，无需改 ralph_ipc 合同"
  - id: F3-BPA3-WRONG-EXCEPTION-TYPE
    mitigation: "BPA-3：INV-7 改为 **monitor-style guard**（沿用 workflow_monitor.create_completer_mismatch_hook(:241) 模板：新签名 hook(kind,data,engine) + 从 workflow_state_types import TransitionRejected）。BLOCK 模式抛 **TransitionRejected**（非 PreTransitionVetoed），避免被 apply_task_event(:1879) 误标成 plan_digest_divergence、打坏既有拒绝契约"
    enforced_by:
      - T2
    status: accepted
    status_reason: "major 属实：PreTransitionVetoed 在 apply_task_event 按 plan_digest_divergence 返回；monitor hooks 统一抛 TransitionRejected。INV-7 借用 veto 类型会污染返回码/审计语义"
  - id: F4-MSENS-PEER-REUSE-BYPASS
    mitigation: "MSE-NS：把 peer-reuse 也做成 security-review-aware——_find_group_peer_agent(agent_pool.py:545) 当 task.type=='security_review' 时不复用 review 不胜任的 peer（如纯 codex peer 降权/跳过），使 security_review 路由在「复用既有 peer」与「新建 agent」两条主路径都收敛到 review-capable（claude）。验收含 peer-reuse 路径，非仅 new-agent selector"
    enforced_by:
      - T3
    status: accepted
    status_reason: "major 属实：create_or_reuse_agent 先走 peer 复用，_find_group_peer_agent 只按 claimed_paths domain 推断、不看 task.type；有现成 codex peer 时 security_review 任务绕过 selector → 词表可达但路由未闭合（DG-13 group-peer 旁路同源）"
  - id: F5-BPA4-BP5-DORMANT
    mitigation: "BPA-4：**诚实收缩 BP-5**——运行时无动态拆分路径可治理，static unknown-dep 已由 E_DEP_UNKNOWN(structural.py:106) 覆盖；不把非 ledger-backed 的 per-task plan-version stamp 包装成 BP-5 foundation（那是 dormant bookkeeping）。本批 BPA-4 只闭合 **BP-2 liveness**（reachable + ledger-backed KIND_MONITOR_VIOLATION + enforce 升级）；BP-5 完整动态 DAG 版本治理显式 DEFERRED，待动态拆分特性落地后专项，记入 tracker 已知边界"
    enforced_by:
      - T4
    status: accepted
    status_reason: "major 属实：仅 workflow 级 plan_digest，无 task 级 version carrier；plan-version stamp 若只塞 orchestrator shadow 非 ledger/replay 即休眠。诚实收缩避免 BP-5 假闭合"
  - id: F6-REGRESSION-SURFACE
    mitigation: "采纳回归面：T1 同步 DG-20 夹具 tests/ralph/test_semantic_defaults.py（canonical codex round-trip）；T2/T4 新增 MonitorConfig 字段须同步 tests/test_workflow_monitor.py 构造与 default 断言；T2 hook 拒绝语义须同步 tests/test_workflow_orchestrator_apply_event.py 与 tests/e2e/test_batch_e_engine_guard.py。这些是既有契约面，纳入各 task awareness_paths + 显式修复，避免 silent drift"
    enforced_by:
      - T1
      - T2
      - T4
    status: accepted
    status_reason: "minor 属实：默认值/MonitorConfig/hook 拒绝语义变更会漂移既有契约测试；不同步即 DG-11 式 silent drift"

