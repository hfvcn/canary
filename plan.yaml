tasks:
  # ============================================================
  # T1 — FL-74 executor_runtime semantic-default 统一为 codex（合同默认 + round-trip 兜底）
  # ============================================================
  - id: T1
    title: "FL-74：Agent 合同默认 model_runtime 'claude'→'codex' 统一 canonical，含 _save_agent_yaml exclude_defaults round-trip 耦合的 load/save 兜底同改"
    addresses:
      - FL-74
    aegis:
      intent: fix
      compat_boundary: "Agent / create_agent / _load_agent_yaml / _save_agent_yaml 公共签名不变；仅把 executor_runtime canonical 默认从 'claude' 改为 'codex'。amp/gemini/claude 等显式 runtime 路径不受影响（显式值始终被持久化与读回）"
      baseline_refs:
        - "tests/test_foreman_workflow.py"
        - "tests/test_model_selection_main_path.py"
        - "tests/test_agent_acquire_release.py"
      patch_shape_triage:
        kind: behavior-fix
        notes: "semantic-default 统一（DG-2 家族实例）；改默认值并保持 round-trip 自洽，对显式 runtime 透明"
      repair_track:
        root_cause: |
          executor_runtime canonical 应为 'codex'（agent_pool/assignment_actor_registration/kernel.actors/
          actor_add_ops/create_agent 均已 'codex'），但 Agent 合同默认仍 'claude'（contracts/v1/agent.py:116
          `model_runtime: str = "claude"`），且 agent_ops.py 的 load/save 兜底亦 'claude'（agent_ops.py:119
          `data["model_runtime"] = model_data.get("runtime", "claude")`；agent_ops.py:146
          `"runtime": data.pop("model_runtime", "claude")`）。DG-20 检测器（W_SEMANTIC_DEFAULT_VALUE_DRIFT）
          已 live 在真实仓库对 agent_ops.py 报出此漂移。
          **round-trip 耦合**：_save_agent_yaml 用 model_dump(exclude_defaults=True)——agent.model_runtime 等于
          合同默认时被省略，再由 load/save 的 get/pop(..., DEFAULT) 兜底写回；故这两处兜底值**必须等于合同默认**
          才能 round-trip 自洽。要把 canonical 真正统一为 codex，须协调改三处（合同默认 + load 兜底 + save 兜底）。
        canonical_owner: "src/cccc/contracts/v1/agent.py::Agent.model_runtime + src/cccc/daemon/ops/agent_ops.py::(_load_agent_yaml/_save_agent_yaml runtime 兜底)"
        minimal_change: |
          (a) contracts/v1/agent.py:116 `model_runtime: str = "claude"` → `= "codex"`（含 docstring/示例同步）。
          (b) agent_ops.py:119 load 兜底 `get("runtime", "claude")` → `get("runtime", "codex")`。
          (c) agent_ops.py:146 save 兜底 `pop("model_runtime", "codex")`（与合同默认一致，保持 exclude_defaults round-trip）。
          (d) 修受影响测试期望（test_create_or_reuse_populates_model_info / test_acquire_auto_mode_returns_valid_lease /
          test_process_batch_suggestion_records_selector_bypass，以及 grep 出的其它断言默认 'claude' 的用例）：
          凡断言「未显式指定 runtime 时落 'claude'」者改为 'codex'。
          (e) 复核 amp/gemini/claude 等**显式** runtime 路径不受影响（显式值被持久化、读回不走兜底）。
        verification_method: |
          1. round-trip：构造未显式指定 runtime 的 Agent → _save_agent_yaml（exclude_defaults 省略 model_runtime）→
             _load_agent_yaml 读回 == 'codex'（非 'claude'）；构造显式 runtime='claude' 的 Agent → round-trip 仍 'claude'。
          2. 真实主路径行为变化（disappearance 证据）：`ralph validate --no-agent`（或 _check_semantic_default_consistency
             value-drift 子检查）在真实仓库对 agent_ops.py **不再**报 W_SEMANTIC_DEFAULT_VALUE_DRIFT（修复前报）。
          3. 全量 pytest 不回归。
    goal_behavior: |
      A. contracts/v1/agent.py Agent.model_runtime 默认 'claude'→'codex'（canonical 统一）。
      B. agent_ops.py 的 load/save runtime 兜底同步为 'codex'，保持 _save_agent_yaml exclude_defaults round-trip 自洽。
      C. 受影响测试期望（未显式 runtime → 默认）由 'claude' 改为 'codex'。
      D. 显式 runtime（amp/gemini/claude）路径行为不变。
      E. 真实仓库 DG-20 value-drift 检测对 agent_ops.py 不再报 W_SEMANTIC_DEFAULT_VALUE_DRIFT（主路径行为变化）。
    acceptance_criteria: |
      1. 未显式指定 runtime 的 Agent 经 _save_agent_yaml→_load_agent_yaml round-trip 读回 model_runtime=='codex'。
      2. 显式 runtime='claude' 的 Agent round-trip 仍 'claude'（显式值不被兜底覆盖）。
      3. 真实仓库 W_SEMANTIC_DEFAULT_VALUE_DRIFT 在 agent_ops.py 上消失（修复前报、修复后不报；disappearance 行为证据）。
      4. 既有受影响测试期望已同步更新且通过。
      5. 全量 pytest 不回归。
    claimed_paths:
      - src/cccc/contracts/v1/agent.py
      - src/cccc/daemon/ops/agent_ops.py
      - tests/ralph/test_bclass_fl74_runtime_default.py
    awareness_paths:
      - src/cccc/daemon/foreman/agent_pool.py
      - src/cccc/ralph/validation_rules/semantic_defaults.py
      - tests/ralph/test_semantic_defaults.py
    verification:
      level: integration
      command: "python -m pytest tests/ralph/test_bclass_fl74_runtime_default.py -v"
      checks:
        - name: fl74-runtime-default-codex
          required: true
          command: "python -m pytest tests/ralph/test_bclass_fl74_runtime_default.py -v"

  # ============================================================
  # T2 — BPA-3 INV-7 NO_COMPLETE_WITHOUT_FRESH_SELF_TEST 命名引擎守卫
  # ============================================================
  - id: T2
    title: "BPA-3：建 self-test producer（REST/AF/verification_gate 透传）+ 命名 monitor-style guard INV-7 NO_COMPLETE_WITHOUT_FRESH_SELF_TEST（TransitionRejected），worker complete 须附当次 attempt 的 fresh self-test，复用旧/缺失自测被拦截"
    addresses:
      - BPA-3
    aegis:
      intent: fix
      compat_boundary: "TaskCompletedRequest / convert_af_results_to_completion_events / report_worker_completion 公共调用约定向后兼容（新增可选 self_test/attempt_id，缺省不破坏既有调用）。先建 producer 使 self_test 经真实完成主路径可达，再开 INV-7 monitor-style guard。守卫 mode-configurable（MonitorConfig.fresh_self_test），默认 WARN（emit KIND_MONITOR_VIOLATION，第一道防线，不误杀完成）；BLOCK 才抛 TransitionRejected"
      baseline_refs:
        - "tests/test_verification_gate.py"
        - "tests/test_workflow_monitor.py"
        - "tests/test_workflow_orchestrator_apply_event.py"
        - "tests/test_workflow_task_ops_attempt_id.py"
      patch_shape_triage:
        kind: behavior-add
        notes: "采纳 step-3 F1/F2/F3：先建 producer 再开守卫，sentence-style guard 用 TransitionRejected，证据原生非反查；沿用 create_completer_mismatch_hook 模板与 MonitorMode 三态。ripple: 改 completion 入口 schema + monitor 契约面"
      repair_track:
        root_cause: |
          蓝图 3.3 第 7 条 INV-7（DI-10 前移）要求 worker complete 必须附**当次 attempt 的 fresh self-test**；
          代码 grep 无任何 INV- 命名守卫。step-3 Codex 评审证实更深 root cause（F1/F2 blocker）：
          (1) **无 producer**：真实 completion 入口都不产 fresh self-test——REST TaskCompletedRequest(workflow.py:76)
              无 attempt_id/evidence/self_test；AF 桥 convert_af_results_to_completion_events(af_gateway_bridge.py:405)
              只发 exit_code/interim_statuses/failure_category；verification_gate process_completed_event(:207) 重建
              evidence dict 丢弃 payload['self_test']。无 producer 的守卫会误杀所有完成（WARN）或死锁主路径（BLOCK）。
          (2) **伪证据**（F1，DG-26）：completion 上报早于 verification（verification_id 要到 ralph_service
              ._verification_result:1095 才生成），草案 self_test.source=verification_id 在守卫点不存在，硬塞即反查。
          (3) **异常类型错**（F3）：PreTransitionVetoed 在 apply_task_event(:1879) 按 plan_digest_divergence 返回；
              monitor guard 应抛 TransitionRejected（见 create_completer_mismatch_hook 模板 workflow_monitor.py:241）。
          引擎完成转换 KIND_TASK_REPORTED_COMPLETED 在 engine:377 触发 hooks，payload 含 evidence；TaskEvent.payload
          为 Dict[str,Any]（ralph_ipc.py:280）故 self_test 走 payload/evidence dict 键，无需改 IPC 合同。
        canonical_owner: "completion self-test producer（ports/web/routes/workflow.py + af_gateway_bridge.py + verification_gate.py 透传）+ src/cccc/daemon/foreman/workflow_monitor.py::create_fresh_self_test_hook（新 monitor-style guard）+ MonitorConfig"
        minimal_change: |
          PRODUCER（采纳 F1/F2，先建可达生产物，非反查）：
          (a) ports/web/routes/workflow.py：TaskCompletedRequest 增可选 `attempt_id: str=""` 与
              `self_test: Optional[Dict]=None`（worker 自测元数据：{outcome, attempt_id, ran_at/source}）；
              report_task_completed 把 self_test 并入传给 complete_task 的 evidence、attempt_id 透传。
          (b) af_gateway_bridge.py convert_af_results_to_completion_events：evidence 内带
              `self_test: result.get("self_test")`（AF worker 自测结果原生透传）。
          (c) verification_gate.py process_completed_event：report_worker_completion 的 evidence dict 增
              `"self_test": payload.get("self_test")`（修「重建 evidence 丢弃 self_test」），并把 attempt_id 一并带入
              evidence.self_test 供守卫核对——证据**取自 worker 原生上报，非反查 verification_id**。
