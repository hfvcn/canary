schema_version: "1.0.0"

# v45 修复：RO-108/109/110/111 + FL-27 + FL-28
# RO-108: SSRF 防护仅 import 检查，未验证路由调用链
# RO-109: SSRF 编码绕过（0x7f000001 等）检查未强制要求
# RO-110: FTS5+中文搜索假通过——验证仅整串匹配
# RO-111: search.py 静默降级——catch-all 异常返回空列表
# FL-27: 全部任务 verification_force_passed，叶子 check 过浅
# FL-28: Worker desired_state=running 但 runtime_state=stopped

required_issues:
  - RO-108
  - RO-109
  - RO-110
  - RO-111
  - FL-27
  - FL-28

semantic_mode: "off"
auto_infer: false

plan_scope:
  - src/cccc/ralph/validation_rules/discipline_security.py
  - src/cccc/ralph/security_recipes.py
  - src/cccc/daemon/foreman/verification_gate.py
  - src/cccc/daemon/foreman/assignment_startup.py
  - src/cccc/daemon/foreman/prompt_builder.py
  - tests/

suppress_codes:
  - E_CRITICAL_ENTRYPOINT_UNOWNED
  - E_CRITICAL_FLOW_UNCOVERED
  - E_CRITICAL_FLOW_ENTRYPOINT_UNOWNED
  - W_AGENT_REVIEW_SKIPPED
  - W_UNCLAIMED_TEST_FOR_SOURCE
  - W_VERIFICATION_BEHAVIOR_MISMATCH
  - W_NO_FAILURE_PATH
  - W_TEST_COVERAGE_GAP
  - W_COVERS_NOT_EXERCISED
  - W_INDIRECT_TEST_IMPORT
  - W_SHARED_FILE_PARTIAL_VERIFICATION
  - W_AEGIS_FIX_NO_REPAIR_TRACK
  - W_AEGIS_COMPLEX_MISSING_BASELINE
  - W_NO_EARLY_INTEGRATION_CHECKPOINT
  - W_VERIFICATION_SHAPE_UNKNOWN
  - W_TASK_ADDRESSES_DISJOINT
  - W_VERIFICATION_TARGET_MISSING
  - W_AEGIS_RIPPLE_TRIAGE_MISSING
  - W_AEGIS_PLAN_NO_COMPAT_BOUNDARY
  - W_AEGIS_PATCH_SHAPE_TRIAGE_MISSING
  - W_AEGIS_TDD_NO_TEST_PATH
  - W_CROSS_BOUNDARY_WITHOUT_GLUE
  - W_E2E_MISSING_COMPILE_CHECK
  - W_PLAN_SCOPE_UNUSED
  - W_VERIFICATION_CROSS_SCOPE
  - W_COVERS_PATHS_UNVERIFIED
  - W_CRITICAL_FLOW_WORKER_ONLY_VERIFICATION
  - W_REGISTRATION_INVARIANT_UNCOVERED
  - W_ACCEPTANCE_COVERAGE_GAP
  - W_GOAL_REFERENCES_UNCLAIMED_PATH
  - W_GOAL_SYMBOL_NOT_IN_CLAIMED_PATH

tasks:
  - id: T1
    title: "RO-108: Aegis 规则要求 SSRF 函数必须有路由调用链证据"
    addresses:
      - RO-108
    goal_behavior: |
      discipline_security.py 增加新规则 `_check_ssrf_route_binding`：
      1. 遍历 plan 的 critical_flows，找到含 "ssrf" 关键词的 flow
      2. 检查对应 task 的 verification checks 中是否有路由级验证（非仅 import 检查）
      3. 路由级验证关键词：endpoint, route, handler, api, request, response, client, call-chain
      4. 若 task 只有 import/compile 级别 check（通过 _is_import_only_check 判断），
         emit warning W_SSRF_ROUTE_BINDING_MISSING：
         "SSRF protection function declared but no route-level verification — import-only checks do not prove endpoint integration"
      5. _is_import_only_check：check name 或 command 只含 import/compile 关键词，不含路由关键词
      6. 将新规则注册到 _DISCIPLINE_RULES 列表
    acceptance_criteria: |
      1. plan 有 ssrf flow + task 只有 import check → W_SSRF_ROUTE_BINDING_MISSING
      2. plan 有 ssrf flow + task 有 endpoint/route 级 check → 无 warning
      3. plan 无 ssrf flow → 无 warning
      4. plan 有 ssrf flow + task 无 check → 已有 E_AEGIS_SECURITY_CHAIN_MISSING 兜底
    claimed_paths:
      - src/cccc/ralph/validation_rules/discipline_security.py
      - src/cccc/ralph/validation_rules/discipline.py
      - tests/test_aegis_security_chain.py
    verification:
      level: unit
      checks:
        - name: ssrf-route-binding
          command: "python -m pytest tests/test_aegis_security_chain.py -v -k 'ssrf_route_binding or route_binding'"

  - id: T2
    title: "RO-109: security recipe 强制要求 SSRF 编码矩阵测试覆盖"
    addresses:
      - RO-109
    goal_behavior: |
      security_recipes.py 的 url_input recipe 增强：
      1. `_build_issue` 当前把 severity 写死为 "hint"。修改为动态决定：
         新增 `_resolve_severity(task, flow, recipe_name)` 函数
      2. 对 url_input recipe：检查 task 所有 verification check 的 name+command 文本，
         是否包含 HOSTNAME_ENCODING_MATRIX 中任意条目
      3. 若完全不含任何编码矩阵条目 → severity="warning"，否则 severity="hint"
      4. 新增 `_missing_encodings(task)` helper：返回未在 check 文本中出现的 HOSTNAME_ENCODING_MATRIX 条目列表
      5. 在 evidence 中添加 "missing_encodings" 字段
      6. 其他 recipe 保持 severity="hint" 不变
    acceptance_criteria: |
      1. task check 含至少一个编码矩阵条目 → severity=hint（现有行为）
      2. task check 不含任何编码矩阵条目 → severity=warning + missing_encodings
      3. 无 ssrf flow → 不触发
    claimed_paths:
      - src/cccc/ralph/security_recipes.py
      - tests/test_security_recipes.py
    verification:
      level: unit
      checks:
        - name: ssrf-encoding-severity
          command: "python -m pytest tests/test_security_recipes.py -v -k 'encoding_matrix or encoding_severity'"

  - id: T3
    title: "RO-110: Aegis 规则对 FTS5+中文场景强制子串匹配用例"
    depends_on: [T1]
    addresses:
      - RO-110
    goal_behavior: |
      discipline_security.py 增加新规则 `_check_fts_cjk_coverage`：
      1. 遍历 plan 的 critical_flows，找到含 "fts" 或 "search" 或 "fulltext" 关键词的 flow
      2. 检查 flow description 或 plan 上下文是否涉及 CJK 语言（中文/日文/韩文关键词：
         chinese, cjk, 中文, unicode, i18n, cjk, zh, ja, ko, multilingual）
      3. 若匹配，检查对应 task 的 verification checks 是否包含子串匹配测试关键词：
         substring, partial, 子串, 分词, tokenize, segment, bigram, ngram
      4. 若不包含，emit warning W_FTS_CJK_SUBSTRING_MISSING：
         "FTS/search with CJK context lacks substring/segmentation test coverage"
      5. 将新规则注册到 _DISCIPLINE_RULES
    acceptance_criteria: |
      1. plan 有 search flow + CJK 上下文 + 无子串测试 → warning
      2. plan 有 search flow + CJK 上下文 + 有子串测试 → 无 warning
      3. plan 有 search flow + 无 CJK 上下文 → 无 warning
      4. plan 无 search flow → 无 warning
    claimed_paths:
      - src/cccc/ralph/validation_rules/discipline_security.py
      - tests/test_aegis_security_chain.py
    verification:
      level: unit
      checks:
        - name: fts-cjk-coverage
          command: "python -m pytest tests/test_aegis_security_chain.py -v -k 'fts_cjk or cjk_coverage'"

  - id: T4
    title: "RO-111: Aegis 规则检测 catch-all 异常静默降级模式"
    depends_on: [T1, T3]
    addresses:
      - RO-111
    goal_behavior: |
      discipline_security.py 增加新规则 `_check_silent_degradation_pattern`：
      1. 遍历 plan 的 critical_flows，找到含 "search" 或 "query" 或 "database" 关键词的 flow
      2. 检查对应 task 的 verification checks 是否包含异常处理验证关键词：
         error-propagation, exception, error-handling, fault, degradation, fallback-test
      3. 若 flow 涉及 search/query 且 task 无异常处理验证 → emit warning
         W_SILENT_DEGRADATION_UNCHECKED：
         "search/query critical flow lacks error-propagation test — catch-all exceptions may mask failures"
      4. 将新规则注册到 _DISCIPLINE_RULES
    acceptance_criteria: |
      1. plan 有 search flow + 无 error-propagation check → warning
      2. plan 有 search flow + 有 error-propagation check → 无 warning
      3. plan 无 search flow → 无 warning
    claimed_paths:
      - src/cccc/ralph/validation_rules/discipline_security.py
      - tests/test_aegis_security_chain.py
    verification:
      level: unit
      checks:
        - name: silent-degradation
          command: "python -m pytest tests/test_aegis_security_chain.py -v -k 'silent_degradation'"

  - id: T5
    title: "FL-27: verification gate 拒绝 import-only check 作为有效验证"
    depends_on: [T1]
    addresses:
      - FL-27
    goal_behavior: |
      verification_gate.py 增加 shallow check rejection gate（遵循现有 _apply_*_gate 模式）：
      1. 新增 `_apply_shallow_check_gate(verification, task_ref)` 函数，
         位于 `_apply_input_robustness_gate` 之后调用
      2. 复用 structural.py 中已有的 `_is_compile_or_import_check` 判定逻辑：
         从 structural 导入或内联等价判定，避免重复造分类器
      3. 新增常量 SHALLOW_CHECK_NAME = "shallow_check_depth"
      4. 新增常量 SHALLOW_CHECK_FAILURE =
         "W_VERIFICATION_SHALLOW_CHECKS: all verification checks are import/compile-only — no behavioral verification"
      5. 检查逻辑：从 task_ref 获取 verification.checks，若所有 check 均为 compile/import 级别，
         追加 failed VerificationCheck 到 verification.checks，并将 overall_outcome 降级为 "failed"
      6. 遵循 security_lint gate 的模式：产出正式 failed check + summary，不是只加 warning 文案
      7. 跳过 agent_pending / infra_error / force_passed 分支（已在 process_completed_event 中短路）
      8. 这解决 FL-27 根因：叶子 check 仅 import/compile → runtime gate 拒绝 → foreman 必须产出更深的 check
    acceptance_criteria: |
      1. 所有 check 都是 import/compile → overall_outcome=failed + SHALLOW_CHECK_WARNING
      2. 至少一个 check 含 behavioral 关键词 → 正常 passed
      3. force_complete 的 task（无 check）→ 现有 force_passed 行为不变
      4. 无 verification checks → 现有 skipped 行为不变
    claimed_paths:
      - src/cccc/daemon/foreman/verification_gate.py
      - tests/test_verification_gate.py
    verification:
      level: unit
      checks:
        - name: shallow-check-rejection
          command: "python -m pytest tests/test_verification_gate.py -v -k 'shallow_check or import_only_check'"

  - id: T6
    title: "FL-28: daemon actor spawn 确保 pty runner 自动拉起"
    addresses:
      - FL-28
    goal_behavior: |
      assignment_startup.py `_start_actor_for_assignment` 增强，消费 actor_add 返回的详细状态：
      1. `add_actor_via_daemon` 调用后，从 response 中提取 `running` 和 `start_error` 字段
         （actor_add_ops.py 返回这两个字段）
      2. 若 resp.ok 但 running=False 或 start_error 非空：
         - log warning "W_ACTOR_START_ERROR: actor {agent_id} added but not running: {start_error}"
         - 尝试 actor_restart（通过 daemon request op="actor_restart"），而非 _legacy_start_actor
      3. 若 restart 也失败，再 fallback 到 _legacy_start_actor
      4. 新增 `_restart_stalled_actor` 方法：
         - 发送 DaemonRequest(op="actor_restart", args={group_id, actor_id, by="orchestrator"})
         - 成功返回 True，失败 log + 返回 False
      5. `_start_actor_for_assignment` 的完整流程：
         add_actor_via_daemon → 检查 running/start_error → restart_stalled_actor → legacy_start_actor
    acceptance_criteria: |
      1. actor_add 成功 + runtime_state=running → 正常继续
      2. actor_add 成功 + runtime_state=stopped → log warning + fallback restart
      3. actor_add 失败 → 现有 fallback 到 _legacy_start_actor 行为不变
    claimed_paths:
      - src/cccc/daemon/foreman/assignment_startup.py
      - tests/test_assignment_startup.py
    verification:
      level: unit
      checks:
        - name: actor-runtime-verify
          command: "python -m pytest tests/test_assignment_startup.py -v -k 'runtime_stall or verify_actor_running'"

  - id: T-int
    title: "全量回归测试"
    depends_on: [T1, T2, T3, T4, T5, T6]
    role: integration
    addresses:
      - RO-108
      - RO-109
      - RO-110
      - RO-111
      - FL-27
      - FL-28
    goal_behavior: |
      运行全量 pytest 确认零回归。
    acceptance_criteria: |
      1. 全量 pytest 0 failures
    claimed_paths:
      - tests/
    verification:
      level: integration
      checks:
        - name: full-regression
          command: "python -m pytest -q"
          timeout: 600
      covers:
        tasks: [T1, T2, T3, T4, T5, T6]

batch_e2e_command: "python -m pytest -q"
batch_e2e_timeout: 600
