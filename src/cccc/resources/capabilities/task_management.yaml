# Task Management Capability
# 任务管理能力配置示例
#
# 此配置定义了任务管理相关的 prompt 片段和 API 端点
# prompt_fragments 按角色分组，会在构建 actor 系统提示时自动组装

id: task_management
title: Task Management
description: |
  提供任务创建、分配和跟踪功能的 Capability。
  包含针对不同角色（foreman/peer）的 prompt 片段。
version: "1.0.0"
enabled: true

# Prompt 片段 - 按角色分组
# - common: 所有角色共享的片段
# - foreman: 仅 foreman 角色使用
# - peer: 仅 peer 角色使用
prompt_fragments:
  common: |
    ## 任务管理

    你可以使用以下任务管理工具：
    - `cccc_task`: 创建、查询、更新任务
    - `cccc_inbox_list`: 查看待处理任务列表

    任务具有以下状态：pending, active, completed, blocked

  foreman: |
    ### Foreman 任务职责

    作为 Foreman，你负责：
    1. 分解复杂任务为可执行的子任务
    2. 将任务分配给合适的 Peer
    3. 监控任务进度并处理阻塞
    4. 汇总和验证任务结果

    分配任务时，确保提供清晰的验收标准。

  peer: |
    ### Peer 任务职责

    作为 Peer，你负责：
    1. 接收并理解分配的任务
    2. 报告任务进度和阻塞点
    3. 完成任务后提交结果给 Foreman

    遇到问题时及时向 Foreman 反馈。

# API 端点定义 - 用于文档生成和工具定义
api_endpoints:
  - path: /tasks
    method: POST
    summary: 创建新任务
    description: 创建一个新的任务实例
    tags:
      - tasks
    request_schema:
      type: object
      properties:
        title:
          type: string
          description: 任务标题
        description:
          type: string
          description: 任务详细描述
        assignee:
          type: string
          description: 任务接收者 ID
      required:
        - title

  - path: /tasks/{task_id}
    method: GET
    summary: 获取任务详情
    description: 根据 ID 获取任务的完整信息
    tags:
      - tasks

  - path: /tasks/{task_id}/status
    method: PATCH
    summary: 更新任务状态
    description: 更新任务的状态字段
    tags:
      - tasks
    request_schema:
      type: object
      properties:
        status:
          type: string
          enum:
            - pending
            - active
            - completed
            - blocked
      required:
        - status

# 分类标签
tags:
  - workflow
  - coordination
  - tasks

# 依赖的其他 Capability
requires: []
