# Task Management Capability
# 任务管理能力配置示例
#
# 此配置定义了任务管理相关的 prompt 片段和 API 端点
# prompt_fragments 按角色分组，会在构建 actor 系统提示时自动组装

id: task_management
title: Task Management
description: |
  提供任务创建、分配和跟踪功能的 Capability。
  包含针对不同角色（foreman/peer）的 prompt 片段。
version: "1.0.0"
enabled: true

# Prompt 片段 - 按角色分组
# - common: 所有角色共享的片段
# - foreman: 仅 foreman 角色使用
# - peer: 仅 peer 角色使用
prompt_fragments:
  common: |
    ## 任务管理

    你可以使用以下任务管理工具：
    - `cccc_task`: 创建、查询、更新任务
    - `cccc_coordination`: 同步共享目标、决策和交接
    - `cccc_actor`: 复用、创建、启动或回收 worker
    - `cccc_runtime_list`: 查看当前可用 runtime
    - `cccc_model`: 查看模型注册表、能力说明和 Foreman 历史评价

    任务具有以下状态：pending, active, completed, blocked

  foreman: |
    ### Foreman 编排职责

    作为 Foreman，你负责：
    1. 和用户对接，澄清需求、范围、约束与验收标准
    2. 审阅 Ralph 的 ready/pending workflow，并决定 approve / modify / defer / reject
    3. 优先复用现有 worker；不够时再创建或重启合适的 agent
    4. 结合 `cccc_runtime_list` 与 `cccc_model` 选择最合适的 runtime / model
    5. 跟踪进度、阻塞、交付质量，并向用户 / 飞书汇报

    Foreman 默认不亲自执行实现任务；worker 完成不等于对用户交付，必须经过 Foreman 判断。

  peer: |
    ### Peer 执行职责

    作为 Peer，你负责：
    1. 执行 Foreman 分配的明确任务
    2. 及时报告进度、证据、变更文件和阻塞点
    3. 完成后把结果交回 Foreman 判断是否达标

    Peer 不主动改写用户范围，不额外拉起新 worker，除非 Foreman 明确要求。

# API 端点定义 - 用于文档生成和工具定义
api_endpoints:
  - path: /tasks
    method: POST
    summary: 创建新任务
    description: 创建一个新的任务实例
    tags:
      - tasks
    request_schema:
      type: object
      properties:
        title:
          type: string
          description: 任务标题
        description:
          type: string
          description: 任务详细描述
        assignee:
          type: string
          description: 任务接收者 ID
      required:
        - title

  - path: /tasks/{task_id}
    method: GET
    summary: 获取任务详情
    description: 根据 ID 获取任务的完整信息
    tags:
      - tasks

  - path: /tasks/{task_id}/status
    method: PATCH
    summary: 更新任务状态
    description: 更新任务的状态字段
    tags:
      - tasks
    request_schema:
      type: object
      properties:
        status:
          type: string
          enum:
            - pending
            - active
            - completed
            - blocked
      required:
        - status

# 分类标签
tags:
  - workflow
  - coordination
  - tasks

# 依赖的其他 Capability
requires: []
