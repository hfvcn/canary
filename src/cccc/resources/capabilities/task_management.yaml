# Task Management Capability
# 任务管理能力配置示例
#
# 此配置定义了任务管理相关的 prompt 片段和 API 端点
# prompt_fragments 按角色分组，会在构建 actor 系统提示时自动组装

id: task_management
title: Task Management
description: |
  提供任务创建、分配和跟踪功能的 Capability。
  包含针对不同角色（foreman/peer）的 prompt 片段。
version: "1.0.0"
enabled: true

# Prompt 片段 - 按角色分组
# - common: 所有角色共享的片段
# - foreman: 仅 foreman 角色使用
# - peer: 仅 peer 角色使用
prompt_fragments:
  common: |
    ## 任务管理

    任务管理的 canonical CLI/角色约定见 `src/cccc/resources/workflow_guidance.md`。
    构建行动前先用 `cccc context get` 读取共享看板与协同状态；其余 workflow 命令、角色分工与验收门控以 canonical guidance 为准。

    任务具有以下状态：planned, active, done, archived

  foreman: |
    ### Foreman 编排职责

    作为 Foreman，保持编排职责：对齐用户目标、按“可独立验证的功能切片”分配任务、跟踪阻塞与交付判断。
    详细 CLI 与角色规则见 `src/cccc/resources/workflow_guidance.md`；workflow-first 的提交入口是 `cccc workflow submit --workflow-id <id> --tasks <file>`。
    Foreman 默认不亲自执行实现任务；worker 报 done 不等于对用户交付，仍需验证门控与 Foreman 判断。

  peer: |
    ### Peer 执行职责

    作为 Peer，执行 Foreman 分配的明确任务，及时回传证据、变更文件和阻塞点。
    详细 CLI 与角色边界见 `src/cccc/resources/workflow_guidance.md`。
    Peer 不主动改写用户范围，不额外拉起新 worker，除非 Foreman 明确要求。

# API 端点定义 - 用于文档生成和工具定义
api_endpoints:
  - path: /tasks
    method: POST
    summary: 创建新任务
    description: 创建一个新的任务实例
    tags:
      - tasks
    request_schema:
      type: object
      properties:
        title:
          type: string
          description: 任务标题
        description:
          type: string
          description: 任务详细描述
        assignee:
          type: string
          description: 任务接收者 ID
      required:
        - title

  - path: /tasks/{task_id}
    method: GET
    summary: 获取任务详情
    description: 根据 ID 获取任务的完整信息
    tags:
      - tasks

  - path: /tasks/{task_id}/status
    method: PATCH
    summary: 更新任务状态
    description: 更新任务的状态字段
    tags:
      - tasks
    request_schema:
      type: object
      properties:
        status:
          type: string
          enum:
            - pending
            - active
            - completed
            - blocked
      required:
        - status

# 分类标签
tags:
  - workflow
  - coordination
  - tasks

# 依赖的其他 Capability
requires: []
